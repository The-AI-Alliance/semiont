# The Rust workspace: the services written in Rust and the crates they share.
# One lockfile, one target/ and one toolchain (rust-toolchain.toml) for all of
# them. The desktop app's crate is its own project, outside the workspace.
[workspace]
resolver = "3"
members = [
    "apps/archivist",
    "apps/archivist/record",
    "apps/archivist/staging",
    "apps/dispatcher",
    "apps/dispatcher/handlers",
    "apps/dispatcher/jetstream",
    "apps/gateway",
    "packages/codegen-rust",
    "packages/core-rust",
    "packages/http-service-rust",
    "packages/http-transport-rust",
    "packages/http-transport-rust/conformance",
    "packages/observability-rust",
    "packages/sdk-rust",
    "packages/telemetry-rust",
]
exclude = ["apps/desktop/src-tauri"]

# What the crates published to crates.io share. `version` is version.json's:
# scripts/release/cargo-version.sh writes it here, beside the three paths
# below that name it, and in Cargo.lock, and CI fails a crate that carries
# another.
[workspace.package]
version = "0.6.13"
repository = "https://github.com/The-AI-Alliance/semiont"

# Every crate a member uses, by version, once: a member names the ones it uses
# with `.workspace = true` and adds the features it needs.
[workspace.dependencies]
semiont = { path = "packages/sdk-rust", version = "0.6.13" }
semiont-codegen = { path = "packages/codegen-rust", version = "0.6.13" }
semiont-archivist-record = { path = "apps/archivist/record" }
semiont-archivist-staging = { path = "apps/archivist/staging" }
semiont-dispatcher-handlers = { path = "apps/dispatcher/handlers" }
semiont-dispatcher-jetstream = { path = "apps/dispatcher/jetstream" }
semiont-core = { path = "packages/core-rust" }
semiont-http-service = { path = "packages/http-service-rust" }
semiont-http-transport = { path = "packages/http-transport-rust" }
semiont-observability = { path = "packages/observability-rust" }
semiont-telemetry = { path = "packages/telemetry-rust", version = "0.6.13" }
async-nats = { version = "0.50.0", default-features = false }
axum = { version = "0.8.9", default-features = false }
base64 = "0.23.1"
bytes = "1.12.1"
encoding_rs = "0.8.42"
chrono = { version = "0.4.45", default-features = false }
futures = "0.3.34"
futures-core = "0.3.34"
http-body = "1.1.0"
http-body-util = "0.1.5"
hyper = "1.11.1"
hyper-util = "0.1.21"
jsonschema = { version = "0.58.1", default-features = false }
jsonwebtoken = { version = "11.1.0", default-features = false }
opentelemetry = { version = "0.33.0", default-features = false }
opentelemetry_sdk = { version = "0.33.0", default-features = false }
opentelemetry-otlp = { version = "0.33.0", default-features = false }
opentelemetry-stdout = { version = "0.33.0", default-features = false }
percent-encoding = "2.3.2"
proptest = { version = "1.11.0", default-features = false, features = ["std"] }
reqwest = { version = "0.13.5", default-features = false }
ring = "0.17.14"
rustls = { version = "0.23.45", default-features = false }
serde = "1.0.229"
serde_json = "1.0.151"
socket2 = "0.6.5"
tikv-jemalloc-ctl = "0.7.0"
tikv-jemallocator = "0.7.0"
tokio = "1.53.1"
toml = { version = "0.9", default-features = false, features = ["parse", "serde"] }
tokio-stream = { version = "0.1.19", default-features = false }
tower = "0.5.3"
unicode-normalization = "0.1.24"
uuid = "1.26.1"

[profile.release]
strip = true
lto = "thin"
