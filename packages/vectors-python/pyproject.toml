[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "semiont-vectors"
dynamic = ["version"]
description = "The vector index Semiont's Python services write and search, and the embedding providers that make its vectors, each behind one interface"
readme = "README.md"
requires-python = ">=3.12"
license = "Apache-2.0"
keywords = ["semiont", "vectors", "embeddings", "qdrant", "ollama", "voyage"]
classifiers = [
    "Framework :: AsyncIO",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Typing :: Typed",
]
# What every install has, which is all of it: Qdrant and both providers are
# asked over HTTP, so no database's client and no provider's library is taken,
# and there is no extra. Each of the first two is the SDK's dependency too, and
# the SDK states the versions: a bound written here would be a second copy of
# its.
dependencies = [
    "httpx",
    "pydantic",
    "semiont",
]

[project.urls]
Homepage = "https://the-ai-alliance.github.io/semiont/"
Repository = "https://github.com/The-AI-Alliance/semiont"
Issues = "https://github.com/The-AI-Alliance/semiont/issues"

# The SDK is the one in this repository: this package is checked and tested
# against the types the tree's spec generates.
[tool.uv.sources]
semiont = { path = "../sdk-python", editable = true }

# The checkers and the formatter are the SDK's, at the SDK's versions:
# tests/test_census.py holds these pins, and the strictness below, to
# packages/sdk-python/pyproject.toml.
[dependency-groups]
dev = [
    "mypy==2.4.0",
    "pyright==1.1.414",
    "pytest>=9.1,<10",
    "ruff==0.17.1",
]

# The version is the repository's, stated once, in version.json.
[tool.hatch.version]
path = "../../version.json"
pattern = '"version": "(?P<version>[^"]+)"'

[tool.hatch.build.targets.wheel]
packages = ["src/semiont_vectors"]

# What the wheel is built from, and no more. The tests read the repository
# around this package, which a source distribution does not hold.
[tool.hatch.build.targets.sdist]
only-include = ["src/semiont_vectors", "README.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["--strict-markers", "--strict-config", "-ra"]
xfail_strict = true

# No target-version: ruff takes it from requires-python.
[tool.ruff]
line-length = 140

[tool.ruff.lint]
select = ["ANN", "ASYNC", "B", "C4", "E", "F", "I", "PGH", "PT", "RUF", "SIM", "TID", "UP", "W"]

[tool.mypy]
# requires-python's floor, which mypy does not read. lint:python-version holds
# this, pyright's, the classifiers and CI's matrix to it.
python_version = "3.12"
files = ["src", "tests"]
strict = true
# pydantic's own plugin, with each of its looser defaults turned off below: at
# its defaults a constructor takes anything.
plugins = ["pydantic.mypy"]
disallow_any_explicit = true
disallow_any_unimported = true
warn_unreachable = true
enable_error_code = ["explicit-override", "ignore-without-code", "possibly-undefined", "redundant-expr", "truthy-bool"]

[tool.pydantic-mypy]
init_typed = true
init_forbid_extra = true
warn_required_dynamic_aliases = true

[tool.pyright]
pythonVersion = "3.12"
include = ["src", "tests"]
typeCheckingMode = "strict"
# `# type: ignore` is mypy's alone here; pyright is told by `# pyright: ignore[rule]`.
# Either left on a line that no longer needs it is an error.
enableTypeIgnoreComments = false
reportUnnecessaryTypeIgnoreComment = "error"
reportImplicitOverride = "error"
reportImportCycles = "error"
reportMissingSuperCall = "none"
reportPropertyTypeMismatch = "error"
reportUnnecessaryCast = "error"
