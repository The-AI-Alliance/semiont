[package]
name = "semiont-telemetry"
version.workspace = true
edition = "2024"
license = "Apache-2.0"
repository.workspace = true
description = "The telemetry a Semiont transport and a Semiont service share: the spans and the count of the SDK telemetry table, and the trace context they travel in, reported to whatever OpenTelemetry the process installed."

[dependencies]
opentelemetry = { workspace = true, features = ["trace", "metrics"] }
semiont.workspace = true

[dev-dependencies]
# The tests install an OpenTelemetry of their own, as an application does.
opentelemetry_sdk = { workspace = true, features = ["trace", "metrics", "testing"] }
# What holds this crate's README to source that runs.
semiont = { workspace = true, features = ["testing"] }
serde_json.workspace = true
tokio = { workspace = true, features = ["rt", "macros"] }
