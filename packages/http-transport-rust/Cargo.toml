[package]
name = "semiont-http-transport"
version.workspace = true
edition = "2024"
license = "Apache-2.0"
repository.workspace = true
description = "Semiont's HTTP transport, in Rust: a knowledge base's bus over its gateway, as semiont's Transport, and the sign-in that reaches it."

[features]
# Signing a person in, and sessions over a gateway: the issuer's grants with
# PKCE, a registry's sign-in, the loopback redirect and discovery over HTTP.
# A service signs in as its own account and links none of it.
sign-in = ["dep:base64", "dep:ring", "tokio/net", "tokio/io-util"]

[dependencies]
base64 = { workspace = true, optional = true }
bytes.workspace = true
futures.workspace = true
reqwest = { workspace = true, features = ["json", "stream"] }
ring = { workspace = true, optional = true }
semiont.workspace = true
semiont-telemetry.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio = { workspace = true, features = ["sync", "time", "rt", "macros"] }
uuid = { workspace = true, features = ["v4"] }

[dev-dependencies]
axum = { workspace = true, features = ["http1", "tokio", "json"] }
http-body-util.workspace = true
# The telemetry tests install an OpenTelemetry of their own, as an application does.
opentelemetry = { workspace = true, features = ["trace", "metrics"] }
opentelemetry_sdk = { workspace = true, features = ["trace", "metrics", "testing"] }
proptest.workspace = true
# As an application builds its client: TLS on, and the provider its own choice.
reqwest = { workspace = true, features = ["rustls-no-provider"] }
rustls = { workspace = true, features = ["ring", "std"] }
# The liveness harness and the bus log's capture.
semiont = { workspace = true, features = ["testing"] }
# This crate's own tests sign people in.
semiont-http-transport = { path = ".", features = ["sign-in"] }
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "net"] }
tokio-stream = { workspace = true, features = ["sync"] }
