[package]
name = "semiont-http-transport"
edition = "2024"
publish = false
license = "Apache-2.0"
description = "Semiont's HTTP transport, in Rust: a knowledge base's bus over its gateway, as semiont's Transport, and the sign-in that reaches it."

[dependencies]
bytes.workspace = true
futures.workspace = true
opentelemetry = { workspace = true, features = ["trace"] }
reqwest = { workspace = true, features = ["json", "stream"] }
semiont.workspace = true
semiont-observability.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio = { workspace = true, features = ["sync", "time", "rt", "macros"] }
uuid = { workspace = true, features = ["v4"] }

[dev-dependencies]
axum = { workspace = true, features = ["http1", "tokio", "json"] }
http-body-util.workspace = true
proptest.workspace = true
# As an application builds its client: TLS on, and the provider its own choice.
reqwest = { workspace = true, features = ["rustls-no-provider"] }
rustls = { workspace = true, features = ["ring", "std"] }
# The liveness harness and the bus log's capture.
semiont = { workspace = true, features = ["testing"] }
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "net"] }
tokio-stream = { workspace = true, features = ["sync"] }
