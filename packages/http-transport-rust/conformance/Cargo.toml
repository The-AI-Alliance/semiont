[package]
name = "semiont-conformance-drivers"
edition = "2024"
publish = false
license = "Apache-2.0"
description = "The Rust drivers for the SDK and worker conformance suites (tests/conformance/sdk, tests/conformance/worker): the suites' operations as calls on the public API of semiont-http-transport (the wire driver) and of semiont's client over it (the live driver and the worker driver)."

[dependencies]
base64.workspace = true
bytes.workspace = true
chrono.workspace = true
futures.workspace = true
# The worker driver opens a span of its own around each job, as a worker's code does.
opentelemetry = { workspace = true, features = ["trace"] }
reqwest = { workspace = true, features = ["rustls-no-provider"] }
rustls = { workspace = true, features = ["ring", "std"] }
semiont.workspace = true
semiont-http-transport.workspace = true
semiont-observability.workspace = true
semiont-telemetry.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "io-std", "io-util", "sync", "time"] }
