[package]
name = "semiont"
edition = "2024"
publish = false
license = "Apache-2.0"
description = "Semiont's Rust SDK: the protocol's types, the transport contract and a client of the bus over it, and what a client needs to name its principals and hold its roles, as specs/ states it."

[dependencies]
percent-encoding.workspace = true
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
tokio = { workspace = true, features = ["sync", "time", "macros"] }
uuid = { workspace = true, features = ["v4"] }

[build-dependencies]
semiont-codegen.workspace = true
serde_json.workspace = true
