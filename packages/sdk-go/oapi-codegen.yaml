# What oapi-codegen writes api/client_gen.go with. `always-prefix-enum-values` names
# every enum constant <Type><Value>, so a schema that reuses a value renames no
# constant. Each place that runs the generator gives the output's path itself
# with `-o`: a path named here would win over the drift checks' scratch path.
package: api
generate:
  models: true
  client: true
output-options:
  # Every schema gets a type, also the bus's payloads, which no HTTP path reaches.
  skip-prune: true
  # But not the kinds of id: oapi-codegen would make each an alias of string,
  # which any text converts to. scripts/spec/generate-identifiers-go.mjs writes
  # them into this package as types made only through their rule
  # (api/ids_gen.go), and holds this list to specs/src/identifiers/kinds.json.
  exclude-schemas:
    - ResourceId
    - AnnotationId
    - JobId
    - UserId
  # A timestamp stays the text the wire carries, as it does in every other
  # SDK: a time.Time writes it back in its own form (2026-01-01T00:00:00Z for
  # 2026-01-01T00:00:00.000Z), so a value read and passed on would not be the
  # value the gateway sent.
  type-mapping:
    string:
      formats:
        date-time:
          type: string
compatibility:
  always-prefix-enum-values: true
