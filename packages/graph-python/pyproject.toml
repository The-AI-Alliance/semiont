[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "semiont-graph"
dynamic = ["version"]
description = "The graph databases Semiont's Python services write and read, behind one interface: what the graph holds of a resource and of an annotation"
readme = "README.md"
requires-python = ">=3.12"
license = "Apache-2.0"
keywords = ["semiont", "graph", "neo4j", "janusgraph", "neptune"]
classifiers = [
    "Framework :: AsyncIO",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Typing :: Typed",
]
# What every install has: the interface, the codec and the in-memory store.
# Pydantic is the SDK's dependency too, and the SDK states the versions: a
# bound written here would be a second copy of its.
dependencies = [
    "pydantic",
    "semiont",
]

# A database's own client is not required: it comes with the extra named for
# the store, and is imported only when that store's module is. An image built
# for one database installs that store's extra alone.
[project.optional-dependencies]
# Neo4j's client, from the version the neo4j store was written against.
neo4j = ["neo4j>=6.4,<7"]
# Apache TinkerPop's Gremlin client, which both Gremlin stores ask through.
# Neither store has been run against a server.
janusgraph = ["gremlinpython>=3.8,<4"]
neptune = ["gremlinpython>=3.8,<4"]

[project.urls]
Homepage = "https://the-ai-alliance.github.io/semiont/"
Repository = "https://github.com/The-AI-Alliance/semiont"
Issues = "https://github.com/The-AI-Alliance/semiont/issues"

# The SDK is the one in this repository: this package is checked and tested
# against the types the tree's spec generates.
[tool.uv.sources]
semiont = { path = "../sdk-python", editable = true }

# The checkers and the formatter are the SDK's, at the SDK's versions:
# tests/test_census.py holds these pins, and the strictness below, to
# packages/sdk-python/pyproject.toml.
[dependency-groups]
dev = [
    # Every extra: the checkers and the tests read every store.
    "semiont-graph[janusgraph,neo4j,neptune]",
    "mypy==2.4.0",
    "pyright==1.1.414",
    "pytest>=9.1,<10",
    "ruff==0.16.10",
]

# The version is the repository's, stated once, in version.json.
[tool.hatch.version]
path = "../../version.json"
pattern = '"version": "(?P<version>[^"]+)"'

[tool.hatch.build.targets.wheel]
packages = ["src/semiont_graph"]

# What the wheel is built from, and no more. The tests read the repository
# around this package, which a source distribution does not hold.
[tool.hatch.build.targets.sdist]
only-include = ["src/semiont_graph", "README.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["--strict-markers", "--strict-config", "-ra"]
xfail_strict = true

# No target-version: ruff takes it from requires-python.
[tool.ruff]
line-length = 140

[tool.ruff.lint]
select = ["ANN", "ASYNC", "B", "C4", "E", "F", "I", "PGH", "PT", "RUF", "SIM", "TID", "UP", "W"]

[tool.mypy]
# requires-python's floor, which mypy does not read. lint:python-version holds
# this, pyright's, the classifiers and CI's matrix to it.
python_version = "3.12"
files = ["src", "tests"]
strict = true
# pydantic's own plugin, with each of its looser defaults turned off below: at
# its defaults a constructor takes anything.
plugins = ["pydantic.mypy"]
disallow_any_explicit = true
disallow_any_unimported = true
warn_unreachable = true
enable_error_code = ["explicit-override", "ignore-without-code", "possibly-undefined", "redundant-expr", "truthy-bool"]

[tool.pydantic-mypy]
init_typed = true
init_forbid_extra = true
warn_required_dynamic_aliases = true

[tool.pyright]
pythonVersion = "3.12"
include = ["src", "tests"]
typeCheckingMode = "strict"
# `# type: ignore` is mypy's alone here; pyright is told by `# pyright: ignore[rule]`.
# Either left on a line that no longer needs it is an error.
enableTypeIgnoreComments = false
reportUnnecessaryTypeIgnoreComment = "error"
reportImplicitOverride = "error"
reportImportCycles = "error"
reportMissingSuperCall = "none"
reportPropertyTypeMismatch = "error"
reportUnnecessaryCast = "error"
# Neo4j's client states the signatures a checker is to read under `t.TYPE_CHECKING`, where `t` is a module of its
# own that hands `typing` on. Pyright knows the constant by `typing`'s name and not by that one, and reads the
# untyped signatures beside them. This says what the constant is. tests/test_census.py holds it to this one line.
defineConstant = { TYPE_CHECKING = true }
