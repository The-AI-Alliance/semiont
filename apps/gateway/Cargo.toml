[package]
name = "semiont-gateway"
edition = "2024"
publish = false
license = "Apache-2.0"
description = "The Semiont gateway: authenticates, validates and relays the knowledge base's protocol as specs/ states it."

[lib]
name = "semiont_gateway"
path = "src/lib.rs"

[[bin]]
name = "semiont-gateway"
path = "src/main.rs"

[dependencies]
async-nats = { workspace = true, features = ["ring", "kv", "server_2_10", "nuid"] }
axum = { workspace = true, features = ["http1", "tokio", "query"] }
base64.workspace = true
bytes.workspace = true
chrono = { workspace = true, features = ["clock", "std"] }
futures.workspace = true
http-body.workspace = true
hyper = { workspace = true, features = ["server", "http1"] }
hyper-util = { workspace = true, features = ["tokio"] }
jsonwebtoken = { workspace = true, features = ["rust_crypto"] }
opentelemetry = { workspace = true, features = ["trace", "metrics"] }
percent-encoding.workspace = true
reqwest = { workspace = true, features = ["rustls-no-provider", "stream", "json"] }
rustls = { workspace = true, features = ["ring", "std"] }
semiont.workspace = true
semiont-core = { workspace = true, features = ["nats"] }
semiont-http-transport.workspace = true
semiont-observability.workspace = true
semiont-telemetry.workspace = true
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true, features = ["preserve_order"] }
socket2.workspace = true
tikv-jemallocator.workspace = true
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "net", "time", "signal", "sync", "io-util", "fs"] }
tower = { workspace = true, features = ["util"] }
uuid = { workspace = true, features = ["v4"] }

