[package]
name = "semiont-dispatcher-jetstream"
edition = "2024"
publish = false
license = "Apache-2.0"
description = "The dispatcher's job queue on NATS JetStream, behind the handlers' JobQueue contract."

[dependencies]
async-nats = { workspace = true, features = ["ring", "kv", "server_2_10", "nuid"] }
bytes.workspace = true
chrono = { workspace = true, features = ["clock", "std"] }
futures.workspace = true
semiont.workspace = true
semiont-core = { workspace = true, features = ["nats"] }
semiont-observability.workspace = true
semiont-dispatcher-handlers.workspace = true
serde_json.workspace = true
tokio = { workspace = true, features = ["rt", "sync", "time", "macros"] }

[build-dependencies]
serde_json.workspace = true
