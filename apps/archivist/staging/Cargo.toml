[package]
name = "semiont-archivist-staging"
edition = "2024"
publish = false
license = "Apache-2.0"
description = "The Archivist's staging, as docs/protocol/ARCHIVIST.md states it: a working tree's changes recorded in the git index, deferred and deduped, or nowhere for a knowledge base that does not sync git."

[dependencies]
opentelemetry = { workspace = true, features = ["metrics"] }
semiont-observability.workspace = true
serde_json.workspace = true
tokio = { workspace = true, features = ["process", "fs", "sync", "time", "rt", "macros"] }

[dev-dependencies]
tokio = { workspace = true, features = ["rt-multi-thread", "macros"] }
