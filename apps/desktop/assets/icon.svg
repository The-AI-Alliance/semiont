<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <style>
      @font-face {
        font-family: Orbitron;
        src: url("Orbitron[wght].ttf") format("truetype");
        font-weight: 400 900;
      }
    </style>
    <linearGradient id="tile" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#111827" />
      <stop offset="1" stop-color="#050914" />
    </linearGradient>
    <linearGradient id="edge" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#19e6f2" />
      <stop offset="1" stop-color="#2676ff" />
    </linearGradient>
    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="18" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>
  <rect x="44" y="44" width="936" height="936" rx="218" fill="url(#tile)" />
  <rect x="45.5" y="45.5" width="933" height="933" rx="216.5" fill="none" stroke="#ffffff" stroke-opacity=".12" stroke-width="3" />
  <text x="512" y="756" text-anchor="middle" font-family="Orbitron" font-size="720" font-weight="700"
        fill="none" stroke="url(#edge)" stroke-width="18" filter="url(#glow)">S</text>
  <text x="512" y="756" text-anchor="middle" font-family="Orbitron" font-size="720" font-weight="700"
        fill="none" stroke="url(#edge)" stroke-width="11">S</text>
</svg>
