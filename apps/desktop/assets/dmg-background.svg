<svg xmlns="http://www.w3.org/2000/svg" width="760" height="760" viewBox="0 0 760 760">
  <defs>
    <style>
      @font-face {
        font-family: Orbitron;
        src: url("Orbitron[wght].ttf") format("truetype");
        font-weight: 400 900;
      }
    </style>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#101d32"/>
      <stop offset="1" stop-color="#060c17"/>
    </linearGradient>
    <linearGradient id="accent" gradientUnits="userSpaceOnUse" x1="320" y1="0" x2="440" y2="0">
      <stop stop-color="#14d9e6"/>
      <stop offset="1" stop-color="#3489ff"/>
    </linearGradient>
    <linearGradient id="card" x1="0" y1="0" x2="0" y2="1">
      <stop stop-color="#ffffff"/>
      <stop offset="1" stop-color="#e6eef9"/>
    </linearGradient>
    <radialGradient id="glow">
      <stop stop-color="#164a79" stop-opacity=".6"/>
      <stop offset="1" stop-color="#164a79" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="760" height="760" fill="url(#background)"/>
  <!-- Center the installer artwork in Quick Look’s square thumbnail before cropping. -->
  <g transform="translate(0 100)">
  <ellipse cx="380" cy="300" rx="380" ry="240" fill="url(#glow)"/>
  <path d="M40 32H60" stroke="#16dce9" stroke-width="3" stroke-linecap="round"/>
  <text x="72" y="39" fill="#dceeff" font-family="Orbitron, sans-serif" font-size="17" font-weight="700" letter-spacing="2.5">SEMIONT</text>
  <text x="40" y="103" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="30" font-weight="650">Install Semiont Desktop</text>
  <text x="41" y="137" fill="#a9bed9" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="15">Drag the app into Applications to get started.</text>
  <path d="M40 170H720" stroke="#accfff" stroke-opacity=".13"/>
  <rect x="76" y="218" width="228" height="210" rx="24" fill="url(#card)"/>
  <rect x="456" y="218" width="228" height="210" rx="24" fill="url(#card)"/>
  <path d="M331 300H427M414 287L427 300L414 313" fill="none" stroke="url(#accent)" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="380" y="344" text-anchor="middle" fill="#a9bed9" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="10" font-weight="600" letter-spacing="2">DRAG TO INSTALL</text>
  <path d="M40 475H720" stroke="#accfff" stroke-opacity=".13"/>
  <text x="40" y="511" fill="#9eb3cf" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12">Once copied, open Semiont Desktop from Applications.</text>
  <text x="720" y="511" text-anchor="end" fill="#5ed7f1" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11" font-weight="600" letter-spacing="1">macOS</text>
  </g>
</svg>
