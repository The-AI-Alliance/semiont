# The toolchain every Rust build in the repository uses: the workspace's
# crates and the desktop app's. rustup reads this file. A Rust image's tag is
# its `channel` (rust:<channel>-alpine, rust:<channel>-bookworm), which
# scripts/ci/rust-toolchain.sh reads for the scripts and workflows that build
# one. So the version is written here and nowhere else, and
# lint:rust-toolchain refuses a second copy.
[toolchain]
channel = "1.99.0"
components = ["rustfmt", "clippy"]
profile = "minimal"
