# Trivy's secret scan of the service images reads this file
# (publish-service-images.yml, the "Scan image with Trivy" step). Every built-in
# rule stays on. An allow rule here skips the files its path names, and says
# why nothing in them is a secret.
allow-rules:
  - id: anthropic-library
    description: >-
      The anthropic library's documentation quotes the value
      {"type": "service_account"} that its managed-agents API takes, which the
      built-in gcp-service-account rule reads as a key. The files are the
      library's own, installed from the hash the service's uv.lock pins.
    path: /site-packages/anthropic/
