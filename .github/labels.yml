# The repository's labels: every one of them, and nothing else.
#
# The Labels workflow (.github/workflows/labels.yml) makes the repository's
# labels this file's. On a push to main it creates, updates, renames and
# deletes until they agree; on a pull request it prints what it would do. A
# label made by hand is deleted by the next sync.
#
# A label is `<dimension>:<value>`, each dimension in one colour, or one of
# the three below the dimensions. `from_name` renames a label in place, so
# what it is on keeps it; it is deleted once the sync has run.
#
# npm run lint:labels holds the file to its rules, the app:, tests:, spec:,
# verb: and stack: labels to what owns them, and .github/dependabot.yml to the
# file.

# kind: what a change or an issue is.
- name: "kind:bug"
  color: "d93f0b"
  description: "Something isn't working"
  from_name: "bug"
- name: "kind:enhancement"
  color: "d93f0b"
  description: "New feature or request"
  from_name: "enhancement"
- name: "kind:documentation"
  color: "d93f0b"
  description: "Improvements or additions to documentation"
  from_name: "documentation"
- name: "kind:dependencies"
  color: "d93f0b"
  description: "Moves a dependency: Dependabot's pull requests, and the batches that take them"
  from_name: "dependencies"
- name: "kind:security"
  color: "d93f0b"
  description: "A vulnerability, an advisory or a security alert"
  from_name: "Security"

