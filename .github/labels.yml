# The repository's labels: every one of them, and nothing else.
#
# The Labels workflow (.github/workflows/labels.yml) makes the repository's
# labels this file's. On a push to main it creates, updates, renames and
# deletes until they agree; on a pull request it prints what it would do. A
# label made by hand is deleted by the next sync.
#
# A label is `<dimension>:<value>`, or one of the three below the dimensions.
# Its colour says what it is: each kind its own, bold, as GitHub's are; every
# other dimension one pale hue of its own, but the verbs, one shade each for
# the three ways they work on the corpus (writing, reading, attention).
#
# `from_name` renames a label in place, so what it is on keeps it; it is
# deleted once the sync has run.
#
# npm run lint:labels holds the file to its rules, the app:, image:, tests:,
# spec:, verb: and stack: labels to what owns them, and .github/dependabot.yml to the
# file.

# kind: what a change or an issue is.
- name: "kind:bug"
  color: "d73a4a"
  description: "Something isn't working"
- name: "kind:enhancement"
  color: "1a7f37"
  description: "New feature or request"
- name: "kind:documentation"
  color: "0969da"
  description: "Improvements or additions to documentation"
- name: "kind:dependencies"
  color: "57606a"
  description: "Moves a dependency: Dependabot's pull requests, and the batches that take them"
- name: "kind:security"
  color: "b60205"
  description: "A vulnerability, an advisory or a security alert"
- name: "kind:refactor"
  color: "8250df"
  description: "Restructures code without changing what it does: renames, moves, splits, consolidations, ports"
- name: "kind:ci"
  color: "bf8700"
  description: "Build, CI or release: the workflows, the scripts they run, and the releases they make"

# verb: the eight verbs, the namespaces of specs/src/client/surface.json:
# writing (yield, mark, bind, frame), reading (browse, match, gather),
# attention (beckon).
- name: "verb:yield"
  color: "c4b5f4"
  description: "Creating resources: by upload, by generation, by cloning (aka \"Generate\")"
- name: "verb:mark"
  color: "c4b5f4"
  description: "Annotations: making and removing them, by hand or as a job (aka \"Annotate\")"
- name: "verb:bind"
  color: "c4b5f4"
  description: "Linking a reference to what it refers to (aka \"Link\")"
- name: "verb:frame"
  color: "c4b5f4"
  description: "The knowledge base's vocabulary: what kinds of things exist"
- name: "verb:browse"
  color: "e0dbfa"
  description: "Reading resources and annotations: live queries and one-shot reads"
- name: "verb:match"
  color: "e0dbfa"
  description: "Searching: for what a reference could refer to, and for resources by text"
- name: "verb:gather"
  color: "e0dbfa"
  description: "Assembling the context a model is given, and what refers to a resource"
- name: "verb:beckon"
  color: "e3b9f2"
  description: "Attention: driving the other viewers, sparkle and scroll-to (\"Look here\")"

