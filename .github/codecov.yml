# Codecov configuration for Semiont monorepo
# https://docs.codecov.io/docs/codecovyml-reference

codecov:
  # Don't require CI to finish before processing coverage
  require_ci_to_pass: false

  # Process coverage immediately
  notify:
    wait_for_ci: false
    after_n_builds: 1  # Comment after first build

coverage:
  # Overall project coverage settings
  status:
    # Project-wide coverage status
    project:
      default:
        # Coverage can drop by 1% without failing
        threshold: 1%
        target: 70%  # Target 70% overall coverage

    # Per-PR patch coverage
    patch:
      default:
        # New code should have at least 80% coverage
        target: 80%
        threshold: 5%

  # Round coverage to 2 decimal places
  precision: 2
  round: down

  # Coverage range for color coding
  range: "50...90"

# Component-specific coverage configuration
component_management:
  default_rules:
    statuses:
      - type: project
        target: auto
        threshold: 1%
  individual_components:
    # Core packages with higher coverage requirements
    - component_id: core
      name: "@semiont/core"
      paths:
        - packages/typescript/core/**
    - component_id: http-transport
      name: "@semiont/http-transport"
      paths:
        - packages/typescript/http-transport/**
    - component_id: react-ui
      name: "@semiont/react-ui"
      paths:
        - packages/typescript/react-ui/**
    - component_id: sdk
      name: "@semiont/sdk"
      paths:
        - packages/typescript/sdk/**
    - component_id: observability
      name: "@semiont/observability"
      paths:
        - packages/typescript/observability/**
    - component_id: browser
      name: "Browser (app)"
      paths:
        - images/browser/**

# Ignore certain files from coverage
ignore:
  # Test files
  - "**/*.test.ts"
  - "**/*.test.tsx"
  - "**/*.spec.ts"
  - "**/*.spec.tsx"
  - "**/test/**"
  - "**/tests/**"
  - "**/__tests__/**"
  - "**/test-utils/**"

  # Build artifacts
  - "**/dist/**"
  - "**/build/**"
  - "**/coverage/**"

  # Config files
  - "**/*.config.ts"
  - "**/*.config.js"

  # Generated files
  - "**/generated/**"

  # Scripts
  - "scripts/**"

# Comment configuration
comment:
  layout: "reach, diff, flags, files"
  behavior: default
  require_changes: false
  require_base: false
  require_head: true

# Flag configuration for different test suites
flags:
  # Individual package flags
  http-transport:
    paths:
      - packages/typescript/http-transport/**
    carryforward: true

  core:
    paths:
      - packages/typescript/core/**
    carryforward: true

  observability:
    paths:
      - packages/typescript/observability/**
    carryforward: true

  react-ui:
    paths:
      - packages/typescript/react-ui/**
    carryforward: true

  sdk:
    paths:
      - packages/typescript/sdk/**
    carryforward: true

  # App flags. These upload from ci.yml's Browser Tests, not the package matrix.

  browser:
    paths:
      - images/browser/**
    carryforward: true
