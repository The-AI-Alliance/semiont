# A Go profile names each file by its import path, which is the repository's
# own path below this prefix.
fixes:
  - "github.com/The-AI-Alliance/semiont/::"

# Ignore certain files from coverage
ignore:
  # Test files
  - "**/*.test.ts"
  - "**/*.test.tsx"
  - "**/*.spec.ts"
  - "**/*.spec.tsx"
  - "**/test/**"
  - "**/tests/**"
  - "**/__tests__/**"
  - "**/test-utils/**"

  # The launcher's test tooling: the fake container runtime its scenarios
  # drive, and the scaffolding its tests share, with the stand-in program
  # they put on PATH.
  - "packages/go/launcher/fakert/**"
  - "packages/go/launcher/harness/**"

  # Build artifacts
  - "**/dist/**"
  - "**/build/**"
  - "**/coverage/**"

  # Config files
  - "**/*.config.ts"
  - "**/*.config.js"

  # Generated files
  - "**/generated/**"
  - "**/*_gen.go"

  # Scripts
  - "scripts/**"

# Comment configuration
comment:
  layout: "reach, diff, flags, files"
  behavior: default
  require_changes: false
  require_base: false
  require_head: true

