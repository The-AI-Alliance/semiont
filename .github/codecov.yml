# Codecov configuration for Semiont monorepo
# https://docs.codecov.io/docs/codecovyml-reference

codecov:
  # Don't require CI to finish before processing coverage
  require_ci_to_pass: false

  # Process coverage immediately
  notify:
    wait_for_ci: false
    after_n_builds: 1  # Comment after first build

coverage:
  # Overall project coverage settings
  status:
    # Project-wide coverage status
    project:
      default:
        # Coverage can drop by 1% without failing
        threshold: 1%
        target: 70%  # Target 70% overall coverage

    # Per-PR patch coverage
    patch:
      default:
        # New code should have at least 80% coverage
        target: 80%
        threshold: 5%

  # Round coverage to 2 decimal places
  precision: 2
  round: down

  # Coverage range for color coding
  range: "50...90"

# One component and one flag for each package, packages/<language>/<name>, named
# <language>-<name>, and for each image, images/<name>, named image-<name>; and a
# component for each language, its packages together. A component is scoped by its paths in every report, so the
# badges read components: a flag is scoped by the uploads that carry it, and the
# Rust workspace's two uploads (its tests', and its binaries' run by the conformance
# suites) each carry many crates'. lint:coverage-roster holds the
# lists, ci.yml's uploads and the READMEs' badges to the packages there are.
component_management:
  default_rules:
    statuses:
      - type: project
        target: auto
        threshold: 1%
  individual_components:
    - component_id: typescript-core
      name: "packages/typescript/core"
      paths:
        - packages/typescript/core/**
    - component_id: typescript-http-transport
      name: "packages/typescript/http-transport"
      paths:
        - packages/typescript/http-transport/**
    - component_id: typescript-observability
      name: "packages/typescript/observability"
      paths:
        - packages/typescript/observability/**
    - component_id: typescript-react-ui
      name: "packages/typescript/react-ui"
      paths:
        - packages/typescript/react-ui/**
    - component_id: typescript-sdk
      name: "packages/typescript/sdk"
      paths:
        - packages/typescript/sdk/**
    - component_id: rust-codegen
      name: "packages/rust/codegen"
      paths:
        - packages/rust/codegen/**
    - component_id: rust-core
      name: "packages/rust/core"
      paths:
        - packages/rust/core/**
    - component_id: rust-http-service
      name: "packages/rust/http-service"
      paths:
        - packages/rust/http-service/**
    - component_id: rust-http-transport
      name: "packages/rust/http-transport"
      paths:
        - packages/rust/http-transport/**
    - component_id: rust-observability
      name: "packages/rust/observability"
      paths:
        - packages/rust/observability/**
    - component_id: rust-sdk
