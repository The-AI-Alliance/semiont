name: Publish Browser Container Image

run-name: "Browser Image: @semiont/browser@${{ inputs.version }}"

on:
  workflow_dispatch:
    inputs:
      version:
        description: '@semiont/browser version (e.g. 0.4.15, 0.4.15-build.42, latest)'
        required: true
        type: string
      dry_run:
        description: 'Dry run (build but do not push)'
        required: false
        type: boolean
        default: false
      tag_latest:
        description: 'Also tag as :latest'
        required: false
        type: boolean
        default: false

permissions:
  contents: read
  packages: write
  id-token: write
  attestations: write

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7.0.1

      - name: Verify packages are installable from npm
        # A just-published version is not installable for minutes afterwards,
        # even though npmjs.com shows it instantly, so a single probe right
        # after publish fails on a package that is genuinely there. Poll.
        #
        # Probe the TARBALL, not the packument. `npm view <pkg>@<ver> version`
        # reads the registry's JSON metadata document; `npm install` reads that
        # document to resolve a version and then downloads the file named in
        # `dist.tarball`. Those are different artifacts served by different
        # infrastructure, and they do not become available at the same instant.
        # On 0.6.2 this step reported every published package present and all
        # seven service images then died on
        # `404 .../@semiont/inference/-/inference-0.6.2.tgz` -- both statements
        # were true at the same moment. A gate in front of a build has to
        # perform the operation the build performs, not a cheaper one that
        # correlates with it.
        #
        # Waiting only for @semiont/browser is not enough either: the install
        # resolves its whole @semiont/* closure at the same version, and those
        # propagate independently. version.json owns which packages publish, so
        # wait for all of them rather than restating a dependency list that
        # would drift. This workflow passed the 0.6.2 publish that killed the
        # service images -- by luck of which package lagged, not by
        # construction, since it polls the identical package set.
        run: |
          PKGS=$(node -e "
            const v = JSON.parse(require('fs').readFileSync('version.json','utf-8'));
            const names = Object.entries(v.packages)
              .filter(([, p]) => p.publish)
              .map(([key, p]) => {
                const pub = p.stage ? require('path').join(p.dir, 'package.publish.json') : null;
                return pub ? JSON.parse(require('fs').readFileSync(pub,'utf-8')).name : key;
              });
            console.log(names.join(' '));
          ")
          echo "Waiting on: $PKGS"
          ERR=$(mktemp)
          for pkg in $PKGS; do
            found=""
            for attempt in $(seq 1 20); do
              # Both conditions sit in one loop because they clear in sequence:
              # the packument lands first, the tarball second. `-f` is what makes
              # curl exit non-zero on 4xx/5xx -- without it a 404 body counts as
              # success. `-I` asks only whether the CDN will serve the object,
              # which is the entire question; downloading it would re-learn at
              # full network cost what the HEAD already said.
              url=$(npm view "${pkg}@${{ inputs.version }}" dist.tarball 2>"$ERR") || true
              if [ -n "$url" ] && curl -sfI "$url" >/dev/null; then
                found=yes; break
              fi
              echo "waiting for ${pkg}@${{ inputs.version }} tarball (attempt $attempt/20)"
              sleep 30
            done
            if [ -z "$found" ]; then
              echo "❌ ${pkg}@${{ inputs.version }} not installable from npm after 10 minutes"
              echo "--- last npm view stderr ---"
              cat "$ERR"
              exit 1
            fi
          done
          echo "✅ every published @semiont package is installable at ${{ inputs.version }}"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4.4.1

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Determine tags
        id: tags
        run: |
          COMMIT_SHA=$(git rev-parse --short HEAD)
          TAGS="ghcr.io/the-ai-alliance/semiont-browser:${{ inputs.version }}"
          TAGS="$TAGS,ghcr.io/the-ai-alliance/semiont-browser:sha-$COMMIT_SHA"
          if [ "${{ inputs.tag_latest }}" = "true" ]; then
            TAGS="$TAGS,ghcr.io/the-ai-alliance/semiont-browser:latest"
          fi
          echo "tags=$TAGS" >> $GITHUB_OUTPUT
          echo "sha=$COMMIT_SHA" >> $GITHUB_OUTPUT

      # Single-platform build for scanning. amd64 OS-package CVEs cover
      # arm64 too since base layers share package versions, so one scan
      # is sufficient. Both builds share the GHA cache; the multi-arch
      # rebuild below is a near-instant cache hit on amd64.
      - name: Build image (amd64, for Trivy scan)
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./apps/browser/Dockerfile
          platforms: linux/amd64
          load: true
          tags: semiont-browser:scan
          build-args: |
            SEMIONT_BROWSER_VERSION=${{ inputs.version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Scan image with Trivy
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: semiont-browser:scan
          severity: HIGH,CRITICAL
          exit-code: '1'
          ignore-unfixed: true
          vuln-type: os,library

      # Generate the SBOM before push so it gates the publish AND is reused for
      # the attestation below (one SBOM, two uses). Runs on dry-run too: a dry
      # run should exercise every gate, or it proves less than it appears to.
      #
      # Built from the same amd64 image we already scanned. OS packages and
      # language libraries are platform-independent, so the amd64 SBOM
      # accurately describes the multi-arch image's contents.
      - name: Generate SBOM with Trivy
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: semiont-browser:scan
          format: spdx-json
          output: sbom.spdx.json

      # License-policy gate, matching publish-service-images.yml.
      #
      # Scope note, so this is not read as more than it is: @semiont/browser
      # ships a PRE-BUILT SPA, so its third-party dependencies are bundled into
      # the output before the package is published and never appear as npm
      # packages in the image. Measured on 0.5.39 this inspects exactly 2
      # packages (@semiont/browser itself and the installer-stage scaffold).
      # It is here for symmetry and to catch drift if this image ever gains a
      # real runtime dependency tree -- NOT as assurance about the bundle.
      - name: License policy gate
        run: node .github/scripts/check-licenses.mjs sbom.spdx.json .github/licenses/allowlist.txt .github/licenses/exceptions.txt

      # Boot smoke, module load only. Unlike the service images -- which refuse
      # with the config loader's "No environment selected" and exit -- this CMD
      # is a static server that never exits, so there is no refusal to assert
      # and a bare `docker run` would hang. Surviving a short window IS the
      # signal: a missing entry point or unresolved import dies in milliseconds.
      #
      # Deliberately not a liveness probe: that the server answers correctly on
      # 3000 is e2e's question, not a publish gate's.
      - name: Boot smoke (module load)
        run: |
          set +e
          out=$(timeout 10 docker run --rm semiont-browser:scan 2>&1)
          rc=$?
          set -e
          echo "$out"
          if echo "$out" | grep -qE "Cannot find module|Cannot find package|ERR_MODULE_NOT_FOUND|MODULE_NOT_FOUND"; then
            echo "::error::browser image died at module load — the entry point or a dependency is missing from the image."
            exit 1
          fi
          # 124 is `timeout` killing a process that was still running: the
          # server came up and stayed up, which is what we are asserting.
          if [ "$rc" -ne 124 ]; then
            echo "::error::browser image exited on its own (status $rc) instead of serving; see the output above."
            exit 1
          fi
          echo "browser: entry point and imports resolved, process stayed up"

      - name: Build and push Docker image
        id: build-push
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./apps/browser/Dockerfile
          platforms: linux/amd64,linux/arm64
          # `dry_run` is a boolean input. Comparing it to the STRING 'true' coerces
          # both sides to numbers (true → 1, 'true' → NaN), so `!= 'true'` is true
          # for every value and a dry run pushed — five :latest tags on 2026-09-20
          # came from one, unattested. Negate the boolean, as the attest steps do.
          push: ${{ !inputs.dry_run }}
          tags: ${{ steps.tags.outputs.tags }}
          build-args: |
            SEMIONT_BROWSER_VERSION=${{ inputs.version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # SLSA build provenance via GitHub's OIDC + Sigstore. Stored as an
      # OCI attestation alongside the image in GHCR. Verify with:
      #   gh attestation verify oci://ghcr.io/the-ai-alliance/semiont-browser:VERSION \
      #     --owner The-AI-Alliance
      - name: Attest build provenance
        if: ${{ !inputs.dry_run }}
        uses: actions/attest-build-provenance@v4.2.2
        with:
          subject-name: ghcr.io/the-ai-alliance/semiont-browser
          subject-digest: ${{ steps.build-push.outputs.digest }}
          push-to-registry: true

      - name: Attest SBOM
        if: ${{ !inputs.dry_run }}
        uses: actions/attest-sbom@v4
        with:
          subject-name: ghcr.io/the-ai-alliance/semiont-browser
          subject-digest: ${{ steps.build-push.outputs.digest }}
          sbom-path: sbom.spdx.json
          push-to-registry: true

      - name: Summary
        run: |
          echo "## Browser Container Image" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**@semiont/browser version:** ${{ inputs.version }}" >> $GITHUB_STEP_SUMMARY
          echo "**Commit:** ${{ steps.tags.outputs.sha }}" >> $GITHUB_STEP_SUMMARY
          echo "**Dry run:** ${{ inputs.dry_run }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Pull with:" >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`bash" >> $GITHUB_STEP_SUMMARY
          echo "docker pull ghcr.io/the-ai-alliance/semiont-browser:${{ inputs.version }}" >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Verify supply-chain attestations:" >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`bash" >> $GITHUB_STEP_SUMMARY
          echo "gh attestation verify oci://ghcr.io/the-ai-alliance/semiont-browser:${{ inputs.version }} \\" >> $GITHUB_STEP_SUMMARY
          echo "  --owner The-AI-Alliance" >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
