name: Package Tests

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]
  workflow_dispatch:

jobs:
  # Matrix strategy for all packages
  test-package:
    name: Test ${{ matrix.package }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false  # Don't cancel other packages if one fails
      matrix:
        package:
          - http-transport
          - content
          - core
          - event-sourcing
          - graph
          - inference
          - make-meaning
          - mcp-server
          - observability
          - ontology
          - react-ui
          - sdk
          - vectors

    steps:
      - name: Checkout code
        uses: actions/checkout@v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: 'npm'
          cache-dependency-path: 'package-lock.json'

      - name: Install dependencies
        run: npm ci --include=optional

      - name: Build package dependencies only
        run: |
          # Only build packages that this package actually depends on at test-time
          # Most packages only need @semiont/http-transport and @semiont/core built
          case "${{ matrix.package }}" in
            core)
              # core generates OpenAPI types - no dependencies
              npm run openapi:bundle
              ;;
            http-transport)
              # http-transport depends on core for OpenAPI types
              npm run openapi:bundle
              npm run build --workspace=@semiont/core
              ;;
            sdk)
              # sdk depends on core (contract + types) and http-transport
              # (re-exports HttpTransport for the convenience-bundle).
              npm run openapi:bundle
              npm run build --workspace=@semiont/core
              npm run build --workspace=@semiont/http-transport
              ;;
            observability)
              # observability depends only on core (for setBusLogTraceIdProvider).
              npm run openapi:bundle
              npm run build --workspace=@semiont/core
              ;;
            ontology|vectors|content|event-sourcing)
              npm run openapi:bundle
              npm run build --workspace=@semiont/core
              ;;
            graph|inference)
              npm run openapi:bundle
              npm run build --workspace=@semiont/core
              npm run build --workspace=@semiont/ontology
              npm run build --workspace=@semiont/http-transport
              ;;
            make-meaning)
              npm run openapi:bundle
              npm run build --workspace=@semiont/core
              npm run build --workspace=@semiont/ontology
              npm run build --workspace=@semiont/http-transport
              npm run build --workspace=@semiont/sdk
              npm run build --workspace=@semiont/content
              npm run build --workspace=@semiont/event-sourcing
              npm run build --workspace=@semiont/inference
              npm run build --workspace=@semiont/vectors
              npm run build --workspace=@semiont/graph
              ;;
            react-ui)
              npm run openapi:bundle
              npm run build --workspace=@semiont/core
              npm run build --workspace=@semiont/ontology
              npm run build --workspace=@semiont/http-transport
              npm run build --workspace=@semiont/sdk
              ;;
            mcp-server)
              npm run openapi:bundle
              npm run build --workspace=@semiont/core
              npm run build --workspace=@semiont/http-transport
              npm run build --workspace=@semiont/sdk
              ;;
          esac

      - name: Build the package itself
        run: |
          cd packages/${{ matrix.package }}
          if grep -q '"build"' package.json; then
            npm run build
          fi

      - name: Run type check
        run: |
          if grep -q '"typecheck"' packages/${{ matrix.package }}/package.json; then
            npm run typecheck --workspace=@semiont/${{ matrix.package }}
          else
            echo "No typecheck script found, skipping"
          fi
        env:
          CI: true

      - name: Run tests
        run: |
          cd packages/${{ matrix.package }}
          npm test
        env:
          CI: true

      - name: Run tests with coverage
        id: coverage
        continue-on-error: true
        run: |
          cd packages/${{ matrix.package }}
          # Try to run coverage, fallback to test with coverage flag
          if grep -q '"test:coverage"' package.json; then
            npm run test:coverage
          else
            npm test -- --coverage
          fi

          # Extract coverage summary if available
          if [ -f coverage/coverage-summary.json ]; then
            echo "## Coverage for ${{ matrix.package }}" >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
            node -e "
              const summary = require('./coverage/coverage-summary.json');
              const total = summary.total;
              console.log('Lines:      ' + total.lines.pct + '%');
              console.log('Statements: ' + total.statements.pct + '%');
              console.log('Functions:  ' + total.functions.pct + '%');
              console.log('Branches:   ' + total.branches.pct + '%');
            " >> $GITHUB_STEP_SUMMARY 2>/dev/null || echo "Coverage data not available" >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
          fi
        env:
          CI: true

      - name: Check coverage files
        run: |
          echo "Looking for coverage files in packages/${{ matrix.package }}/coverage/"
          ls -la packages/${{ matrix.package }}/coverage/ || echo "No coverage directory found"
          if [ -f "packages/${{ matrix.package }}/coverage/lcov.info" ]; then
            echo "✅ Found lcov.info"
            head -5 packages/${{ matrix.package }}/coverage/lcov.info
          else
            echo "❌ No lcov.info found"
          fi
          if [ -f "packages/${{ matrix.package }}/coverage/coverage-final.json" ]; then
            echo "✅ Found coverage-final.json"
          else
            echo "❌ No coverage-final.json found"
          fi

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v7.1.1
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./packages/${{ matrix.package }}/coverage/lcov.info
          flags: ${{ matrix.package }}
          name: ${{ matrix.package }}
          verbose: true
        continue-on-error: true

      - name: Upload coverage artifact
        uses: actions/upload-artifact@v7
        with:
          name: coverage-${{ matrix.package }}
          path: packages/${{ matrix.package }}/coverage/
          retention-days: 30
        continue-on-error: true

  # The graph stores against a real neo4j. `npm test` in packages/graph needs
  # no database, and holds the stores to fake drivers and the in-memory store.
  # A fake is a claim about a database: this run asks the database. It starts
  # the neo4j the launcher starts for an operator, whose image
  # scripts/ci/neo4j-image.sh reads from the launcher's own descriptor.
  test-graph-neo4j:
    name: Graph Stores (neo4j)
    runs-on: ubuntu-latest
    env:
      # Where the run finds its database, and the password it was started
      # with below: a container this job makes and discards.
      NEO4J_HOST: localhost
      NEO4J_PASSWORD: graph-stores-ci

    steps:
      - name: Checkout code
        uses: actions/checkout@v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: 'npm'
          cache-dependency-path: 'package-lock.json'

      - name: Install dependencies
        run: npm ci --include=optional

      - name: Build what the graph package depends on
        run: |
          npm run openapi:bundle
          npm run build --workspace=@semiont/core
          npm run build --workspace=@semiont/ontology
          npm run build --workspace=@semiont/http-transport

      - name: Start neo4j
        run: |
          image=$(scripts/ci/neo4j-image.sh)
          docker run -d --name neo4j -p 7687:7687 -e NEO4J_AUTH="neo4j/${NEO4J_PASSWORD}" "$image"
          for attempt in $(seq 1 60); do
            if docker exec neo4j cypher-shell -u neo4j -p "$NEO4J_PASSWORD" 'RETURN 1' > /dev/null 2>&1; then
              exit 0
            fi
            sleep 2
          done
          docker logs neo4j
          echo "neo4j did not answer within two minutes"
          exit 1

      - name: Run the stores against it
        run: |
          cd packages/graph
          npm run test:neo4j -- --coverage
        env:
          CI: true

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v7.1.1
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./packages/graph/coverage/lcov.info
          flags: graph
          name: graph-neo4j
          verbose: true
        continue-on-error: true

  # Summary job to ensure at least one package was tested
  summary:
    name: Test Summary
    runs-on: ubuntu-latest
    needs: test-package
    if: always()

    steps:
      - name: Check results
        run: |
          echo "## 📦 Package Test Results" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "All package tests completed. Check individual job results above." >> $GITHUB_STEP_SUMMARY
