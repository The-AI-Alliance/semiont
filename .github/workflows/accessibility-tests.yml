name: Accessibility Testing

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]
  workflow_dispatch:
  schedule:
    # Run daily at 6 AM UTC to catch accessibility regressions
    - cron: '0 6 * * *'

# One run per pull request: a push cancels the run of the push before it, which
# nobody is waiting for. A push to main is never cancelled: it is the run that
# sees the merged tree. lint:workflows holds every pull-request workflow to this.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Job 1: Automated axe-core testing for react-ui components
  test-react-ui-accessibility:
    name: React UI - axe-core Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: 'npm'
          cache-dependency-path: 'package-lock.json'

      - name: Build dependencies
        run: |
          npm ci --include=optional
          npm run openapi:bundle
          npm run build --workspace=@semiont/core
          npm run build --workspace=@semiont/http-transport
          npm run build --workspace=@semiont/sdk
          npm run build --workspace=@semiont/react-ui

      - name: Run accessibility tests
        id: a11y-tests
        run: |
          # Run accessibility tests in split mode to avoid memory issues
          # This only runs tests with "Accessibility" in the name
          npm run test:a11y --workspace=@semiont/react-ui
        continue-on-error: false
        env:
          CI: true

      - name: Comment PR with results
        if: github.event_name == 'pull_request' && failure()
        uses: actions/github-script@v9
        with:
          script: |
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: '⚠️ **Accessibility tests failed for @semiont/react-ui**\n\nPlease review the test results and fix accessibility violations before merging.'
            })

  # Job 2: Lighthouse accessibility audit of the built Browser's signed-out pages.
  # apps/browser/lighthouserc.json names the pages and the score they must reach.
  lighthouse-accessibility:
    name: Lighthouse - Signed-out Pages
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: 'npm'
          cache-dependency-path: 'package-lock.json'

      - name: Build dependencies
        run: |
          npm ci --include=optional
          npm run openapi:bundle
          npm run build --workspace=@semiont/core
          npm run build --workspace=@semiont/http-transport
          npm run build --workspace=@semiont/sdk
          npm run build --workspace=@semiont/react-ui

      - name: Build browser
        run: |
          cd apps/browser
          npm run build

      - name: Install Lighthouse CI
        run: npm install -g @lhci/cli@0.15.1

      - name: Audit the signed-out pages
        run: |
          cd apps/browser
          lhci collect

      - name: Assert the audit's scores
        id: assert
        run: |
          cd apps/browser
          # lhci assert passes when it finds no reports at all
          ls .lighthouseci/lhr-*.json > /dev/null
          lhci assert

      - name: Upload Lighthouse results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: lighthouse-results
          path: apps/browser/.lighthouseci
          retention-days: 30

      - name: Comment PR with Lighthouse results
        if: always() && github.event_name == 'pull_request'
        uses: actions/github-script@v9
        env:
          ASSERT_OUTCOME: ${{ steps.assert.outcome }}
        with:
          script: |
            const fs = require('fs');
            const path = require('path');

            const lighthouseDir = 'apps/browser/.lighthouseci';
            const reports = fs.existsSync(lighthouseDir)
              ? fs.readdirSync(lighthouseDir)
                  .filter((f) => f.startsWith('lhr-') && f.endsWith('.json'))
                  .map((f) => JSON.parse(fs.readFileSync(path.join(lighthouseDir, f), 'utf8')))
              : [];

            let body;
            if (reports.length === 0) {
              body = '❌ **Lighthouse produced no report.** It could not audit the built Browser; see the job log.';
            } else {
              const scores = new Map();
              for (const report of reports) {
                const page = new URL(report.requestedUrl).pathname;
                if (!scores.has(page)) scores.set(page, []);
                scores.get(page).push(Math.round(report.categories.accessibility.score * 100));
              }
              const rows = [...scores].map(([page, runs]) => `| \`${page}\` | ${runs.join(', ')} |`);
              const verdict = {
                success: '✅ The scores meet `apps/browser/lighthouserc.json`.',
                failure: '❌ The scores fall short of `apps/browser/lighthouserc.json`.',
              }[process.env.ASSERT_OUTCOME] ?? `The assertion step did not finish (${process.env.ASSERT_OUTCOME}).`;
              body = [
                '**Lighthouse accessibility, signed-out pages**',
                '',
                '| Page | Score per run |',
                '|---|---|',
                ...rows,
                '',
                verdict,
                '',
                'Full results are in the workflow artifacts.',
              ].join('\n');
            }

            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body,
            })

  # Job 3: Accessibility summary
  accessibility-summary:
    name: Accessibility Summary
    runs-on: ubuntu-latest
    needs: [test-react-ui-accessibility, lighthouse-accessibility]
    if: always()

    steps:
      - name: Generate summary
        run: |
          echo "# 🔍 Accessibility Testing Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          # React UI status
          if [ "${{ needs.test-react-ui-accessibility.result }}" == "success" ]; then
            echo "✅ **React UI (axe-core):** PASSED" >> $GITHUB_STEP_SUMMARY
          else
            echo "❌ **React UI (axe-core):** FAILED" >> $GITHUB_STEP_SUMMARY
          fi

          # Lighthouse status
          if [ "${{ needs.lighthouse-accessibility.result }}" == "success" ]; then
            echo "✅ **Lighthouse (signed-out pages):** PASSED" >> $GITHUB_STEP_SUMMARY
          else
            echo "❌ **Lighthouse (signed-out pages):** FAILED" >> $GITHUB_STEP_SUMMARY
          fi

          echo "" >> $GITHUB_STEP_SUMMARY

          if [ "${{ needs.test-react-ui-accessibility.result }}" == "success" ] && \
             [ "${{ needs.lighthouse-accessibility.result }}" == "success" ]; then
            echo "Automated accessibility checks passed." >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "They cover part of WCAG 2.1 AA: axe-core on the react-ui components that have accessibility tests, and Lighthouse on the signed-out pages." >> $GITHUB_STEP_SUMMARY
          else
            echo "⚠️ **Some automated accessibility checks failed**" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "Please review the test results and fix accessibility violations." >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "### Resources:" >> $GITHUB_STEP_SUMMARY
            echo "- [WCAG 2.1 Guidelines](https://www.w3.org/WAI/WCAG21/quickref/)" >> $GITHUB_STEP_SUMMARY
            echo "- [axe-core Rules](https://github.com/dequelabs/axe-core/blob/develop/doc/rule-descriptions.md)" >> $GITHUB_STEP_SUMMARY
            echo "- [Lighthouse Accessibility Scoring](https://web.dev/accessibility-scoring/)" >> $GITHUB_STEP_SUMMARY
          fi

      - name: Fail workflow if any test failed
        if: |
          needs.test-react-ui-accessibility.result != 'success' ||
          needs.lighthouse-accessibility.result != 'success'
        run: |
          echo "One or more accessibility tests failed"
          exit 1
