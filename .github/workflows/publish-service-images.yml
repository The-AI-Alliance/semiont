name: Publish Service Container Images

run-name: "Service Images @ ${{ inputs.version }}${{ inputs.dry_run && ' (dry-run)' || '' }}"

# Builds and publishes the seven Semiont service images
# (gateway · worker · smelter · weaver · archivist · librarian · dispatcher):
# the gateway and the dispatcher compiled from this checkout (apps/gateway and
# apps/dispatcher, reporting version.json's version), the other five from the
# published @semiont/* packages, mirroring publish-browser.yml's verify-npm → scan →
# multi-arch push → SBOM → attest spine, with an added license-policy gate.
# Config is runtime (bind-mount); the images ship config-free.
#
# The gateway and the dispatcher compile Rust, and the gateway's arm64 half
# took over an hour under emulation (2026-09-28), so each of their platforms
# builds on a runner of its own architecture and pushes by digest, and the
# manifest job joins the two under the tags. The other five only `npm install` in their
# images, which emulation handles in minutes, so each publishes both platforms
# from one leg.

on:
  workflow_dispatch:
    inputs:
      version:
        description: '@semiont/* version to bundle (e.g. 0.5.13, 0.5.13-build.42, latest)'
        required: true
        type: string
      dry_run:
        description: 'Dry run (build + gate but do not push)'
        required: false
        type: boolean
        default: false
      tag_latest:
        description: 'Also tag as :latest'
        required: false
        type: boolean
        default: false

permissions:
  contents: read
  packages: write
  id-token: write
  attestations: write

jobs:
  publish:
    runs-on: ${{ matrix.runner }}

    strategy:
      # One service's failure must not cancel the others' publishes.
      fail-fast: false
      matrix:
        include:
          # `runner`: the machine the leg runs on. `scan`: the platform its gates
          # build and run, the runner's own. `platforms`: what it publishes.
          # `arch`: a leg that publishes one architecture by digest, for
          # the manifest job to join; a leg without one publishes tagged.
          # `installs`: the image installs @semiont/* packages from npm, so it
          # waits for them to be installable. `refusal`: what the image says,
          # run bare, when it reaches its own configuration.
          - service: gateway
            arch: amd64
            runner: ubuntu-latest
            scan: linux/amd64
            platforms: linux/amd64
            dockerfile: apps/gateway/Dockerfile
            refusal: "Cannot read the gateway's configuration document"
          - service: gateway
            arch: arm64
            runner: ubuntu-24.04-arm
            scan: linux/arm64
            platforms: linux/arm64
            dockerfile: apps/gateway/Dockerfile
            refusal: "Cannot read the gateway's configuration document"
          - service: worker
            runner: ubuntu-latest
            scan: linux/amd64
            platforms: linux/amd64,linux/arm64
            dockerfile: apps/worker/Dockerfile
            installs: npm
            refusal: No environment selected
          - service: smelter
            runner: ubuntu-latest
            scan: linux/amd64
            platforms: linux/amd64,linux/arm64
            dockerfile: apps/smelter/Dockerfile
            installs: npm
            refusal: No environment selected
          - service: weaver
            runner: ubuntu-latest
            scan: linux/amd64
            platforms: linux/amd64,linux/arm64
            dockerfile: apps/weaver/Dockerfile
            installs: npm
            refusal: No environment selected
          - service: archivist
            runner: ubuntu-latest
            scan: linux/amd64
            platforms: linux/amd64,linux/arm64
            dockerfile: apps/archivist/Dockerfile
            installs: npm
            refusal: No environment selected
          - service: librarian
            runner: ubuntu-latest
            scan: linux/amd64
            platforms: linux/amd64,linux/arm64
            dockerfile: apps/librarian/Dockerfile
            installs: npm
            refusal: No environment selected
          - service: dispatcher
            arch: amd64
            runner: ubuntu-latest
            scan: linux/amd64
            platforms: linux/amd64
            dockerfile: apps/dispatcher/Dockerfile
            refusal: "Cannot read the dispatcher's configuration document"
          - service: dispatcher
            arch: arm64
            runner: ubuntu-24.04-arm
            scan: linux/arm64
            platforms: linux/arm64
            dockerfile: apps/dispatcher/Dockerfile
            refusal: "Cannot read the dispatcher's configuration document"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7.0.1

      # The license gate and the npm probe run node; an arm64 runner's image
      # need not carry it.
      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: '24'

      - name: Verify packages are installable from npm
        if: matrix.installs == 'npm'
        # A just-published version is not installable for minutes afterwards,
        # even though npmjs.com shows it instantly, so a single probe right
        # after publish fails on a package that is genuinely there. Poll.
        #
        # Probe the TARBALL, not the packument. `npm view <pkg>@<ver> version`
        # reads the registry's JSON metadata document; `npm install` reads that
        # document to resolve a version and then downloads the file named in
        # `dist.tarball`. Those are different artifacts served by different
        # infrastructure, and they do not become available at the same instant.
        # On 0.6.2 this step reported every published package present and all
        # seven service images then died on
        # `404 .../@semiont/inference/-/inference-0.6.2.tgz` -- both statements
        # were true at the same moment. A gate in front of a build has to
        # perform the operation the build performs, not a cheaper one that
        # correlates with it.
        #
        # Waiting only for this service's own entry point is not enough either:
        # the install resolves that package's whole @semiont/* closure at the
        # same version, and on 0.5.34 make-meaning had indexed while
        # @semiont/jobs and @semiont/inference had not, so the gate passed and
        # the build died in `npm install`. version.json owns which packages
        # publish, so wait for all of them rather than restating a per-service
        # dependency list that would drift the first time an import changed.
        run: |
          PKGS=$(node -e "
            const v = JSON.parse(require('fs').readFileSync('version.json','utf-8'));
            const names = Object.entries(v.packages)
              .filter(([, p]) => p.publish)
              .map(([key, p]) => {
                const pub = p.stage ? require('path').join(p.dir, 'package.publish.json') : null;
                return pub ? JSON.parse(require('fs').readFileSync(pub,'utf-8')).name : key;
              });
            console.log(names.join(' '));
          ")
          echo "Waiting on: $PKGS"
          ERR=$(mktemp)
          for pkg in $PKGS; do
            found=""
            for attempt in $(seq 1 20); do
              # Both conditions sit in one loop because they clear in sequence:
              # the packument lands first, the tarball second. `-f` is what makes
              # curl exit non-zero on 4xx/5xx -- without it a 404 body counts as
              # success. `-I` asks only whether the CDN will serve the object,
              # which is the entire question; downloading it would re-learn at
              # full network cost what the HEAD already said.
              url=$(npm view "${pkg}@${{ inputs.version }}" dist.tarball 2>"$ERR") || true
              if [ -n "$url" ] && curl -sfI "$url" >/dev/null; then
                found=yes; break
              fi
              echo "waiting for ${pkg}@${{ inputs.version }} tarball (attempt $attempt/20)"
              sleep 30
            done
            if [ -z "$found" ]; then
              echo "❌ ${pkg}@${{ inputs.version }} not installable from npm after 10 minutes"
              echo "--- last npm view stderr ---"
              cat "$ERR"
              exit 1
            fi
          done
          echo "✅ every published @semiont package is installable at ${{ inputs.version }}"

      # The gateway and the dispatcher compile with the toolchain
      # rust-toolchain.toml pins; the others install the version this run publishes.
      - name: Build arguments
        id: args
        run: |
          {
            echo "args<<EOF"
            if [ "${{ matrix.service }}" = gateway ] || [ "${{ matrix.service }}" = dispatcher ]; then
              echo "RUST_TOOLCHAIN=$(sed -n 's/^channel = "\(.*\)"$/\1/p' rust-toolchain.toml)"
            else
              echo "SEMIONT_VERSION=${{ inputs.version }}"
            fi
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4.4.1

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Determine tags
        id: tags
        run: scripts/ci/image-tags.sh "${{ matrix.service }}" "${{ inputs.version }}" "${{ inputs.tag_latest }}" >> "$GITHUB_OUTPUT"

      # Single-platform build for scanning + SBOM, on the runner's own platform.
      # For an emulated multi-arch leg, amd64 OS-package CVEs cover arm64 too
      # since base layers share package versions, and OS/library licenses are
      # platform-independent, so one build feeds both gates. Both builds share
      # the GHA cache; the publishing build below is a near-instant cache hit on
      # the scanned platform.
      - name: Build image (${{ matrix.scan }}, for scan + SBOM)
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./${{ matrix.dockerfile }}
          platforms: ${{ matrix.scan }}
          load: true
          tags: semiont-${{ matrix.service }}:scan
          build-args: ${{ steps.args.outputs.args }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Scan image with Trivy
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: semiont-${{ matrix.service }}:scan
          severity: HIGH,CRITICAL
          exit-code: '1'
          ignore-unfixed: true
          vuln-type: os,library

      # Generate the SBOM before push so it gates the publish AND is reused for
      # the attestation below (one SBOM, two uses). Runs on dry-run too.
      - name: Generate SBOM with Trivy
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: semiont-${{ matrix.service }}:scan
          format: spdx-json
          output: sbom.spdx.json

      # License-policy gate: every bundled npm dependency's license must be on the
      # permissive allowlist, else the publish fails for a human review.
      - name: License policy gate
        run: node .github/scripts/check-licenses.mjs sbom.spdx.json .github/licenses/allowlist.txt .github/licenses/exceptions.txt

      # Boot smoke: run the image built above for the scan and require that it
      # gets as far as CONFIG RESOLUTION. Every defect this catches died in
      # milliseconds, before any dependency mattered — a missing dist entry
      # point, an unresolved import, a native module absent for the platform —
      # and every one of them would otherwise be published and only discovered
      # when a stack refused to come up.
      #
      # Run BARE, with no config and no env, deliberately: the assertion is
      # about how FAR the process gets, and inventing a config or an env set
      # here would restate a contract the launcher owns (its args builders) in
      # a place nothing keeps in sync. Reaching the loader's own refusal is
      # proof the entry point resolved, every import resolved, and @semiont/core
      # ran — without standing up a single dependency.
      #
      # This is the cheap half. It does NOT prove the service reaches a healthy
      # state with real config; that needs the launcher-derived env (and a
      # --check-config entry point would make it exact).
      - name: Boot smoke (reaches config resolution)
        run: |
          set +e
          out=$(docker run --rm semiont-${{ matrix.service }}:scan 2>&1)
          set -e
          echo "$out"
          if echo "$out" | grep -qE "Cannot find module|Cannot find package|ERR_MODULE_NOT_FOUND|MODULE_NOT_FOUND"; then
            echo "::error::${{ matrix.service }} image died at module load — the entry point or a dependency is missing from the image."
            exit 1
          fi
          # The refusal each service raises when it has no configuration: for the
          # sidecars @semiont/core's loader with no environment staged, for the
          # gateway and the dispatcher their own with no document. A change to either message should
          # fail here loudly rather than pass silently.
          if ! echo "$out" | grep -qF "${{ matrix.refusal }}"; then
            echo "::error::${{ matrix.service }} image did not reach config resolution. Expected \"${{ matrix.refusal }}\"; see the output above for where it stopped instead."
            exit 1
          fi
          echo "${{ matrix.service }}: entry point and imports resolved, reached config resolution"

      # The gateway image carries no source and starts within its bound.
      - name: Check the gateway image
        if: matrix.service == 'gateway'
        run: scripts/container/check-gateway-image.sh semiont-${{ matrix.service }}:scan docker

      # The dispatcher image carries no source and no Node, and refuses at once
      # without its document.
      - name: Check the dispatcher image
        if: matrix.service == 'dispatcher'
        run: scripts/container/check-dispatcher-image.sh semiont-${{ matrix.service }}:scan docker

      - name: Build and push Docker image
        id: build-push
        if: ${{ !matrix.arch }}
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./${{ matrix.dockerfile }}
          platforms: ${{ matrix.platforms }}
          # `dry_run` is a boolean input. Comparing it to the STRING 'true' coerces
          # both sides to numbers (true → 1, 'true' → NaN), so `!= 'true'` is true
          # for every value and a dry run pushed — five :latest tags on 2026-09-20
          # came from one, unattested. Negate the boolean, as the attest steps do.
          push: ${{ !inputs.dry_run }}
          tags: ${{ steps.tags.outputs.tags }}
          build-args: ${{ steps.args.outputs.args }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # One architecture, untagged: the manifest job names it. The push rides
      # the same negated boolean as the tagged build above.
      - name: Build and push this architecture by digest
        id: push-digest
        if: ${{ matrix.arch }}
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./${{ matrix.dockerfile }}
          platforms: ${{ matrix.platforms }}
          outputs: type=image,name=${{ steps.tags.outputs.image }},push-by-digest=true,name-canonical=true,push=${{ !inputs.dry_run }}
          build-args: ${{ steps.args.outputs.args }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Record this architecture's digest
        if: ${{ matrix.arch && !inputs.dry_run }}
        run: |
          mkdir -p digests
          digest="${{ steps.push-digest.outputs.digest }}"
          touch "digests/${digest#sha256:}"

      - name: Hand the digest to the manifest job
        if: ${{ matrix.arch && !inputs.dry_run }}
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.service }}-digest-${{ matrix.arch }}
          path: digests/*
          if-no-files-found: error
          retention-days: 1

      # The joined image is attested with the amd64 SBOM, as a tagged multi-arch
      # build is below.
      - name: Hand the SBOM to the manifest job
        if: ${{ matrix.arch == 'amd64' && !inputs.dry_run }}
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.service }}-sbom
          path: sbom.spdx.json
          if-no-files-found: error
          retention-days: 1

      # SLSA build provenance via GitHub's OIDC + Sigstore, stored as an OCI
      # attestation alongside the image in GHCR. Verify with:
      #   gh attestation verify oci://ghcr.io/the-ai-alliance/semiont-<svc>:VERSION \
      #     --owner The-AI-Alliance
      # A leg with an `arch` is attested once joined, by the manifest jobst.
      - name: Attest build provenance
        if: ${{ !inputs.dry_run && !matrix.arch }}
        uses: actions/attest-build-provenance@v4.2.2
        with:
          subject-name: ${{ steps.tags.outputs.image }}
          subject-digest: ${{ steps.build-push.outputs.digest }}
          push-to-registry: true

      - name: Attest SBOM
        if: ${{ !inputs.dry_run && !matrix.arch }}
        uses: actions/attest-sbom@v4
        with:
          subject-name: ${{ steps.tags.outputs.image }}
          subject-digest: ${{ steps.build-push.outputs.digest }}
          sbom-path: sbom.spdx.json
          push-to-registry: true

      - name: Summary
        run: |
          {
            echo "## semiont-${{ matrix.service }} Container Image"
            echo ""
            echo "**Version:** ${{ inputs.version }}${{ matrix.installs != 'npm' && ' (built from this commit)' || '' }}"
            echo "**Commit:** ${{ steps.tags.outputs.sha }}"
            echo "**Dry run:** ${{ inputs.dry_run }}"
            echo ""
            echo "### Pull with:"
            echo "\`\`\`bash"
            echo "docker pull ${{ steps.tags.outputs.image }}:${{ inputs.version }}"
            echo "\`\`\`"
            echo ""
            echo "### Verify supply-chain attestations:"
            echo "\`\`\`bash"
            echo "gh attestation verify oci://${{ steps.tags.outputs.image }}:${{ inputs.version }} \\"
            echo "  --owner The-AI-Alliance"
            echo "\`\`\`"
          } >> "$GITHUB_STEP_SUMMARY"

  # A service's two architectures, each built on its own runner and pushed by
  # digest, joined into one image under the tags, then attested.
  manifest:
    needs: publish
    # Each leg of publish succeeds or fails alone (fail-fast is off), so a
    # failure elsewhere must not hold a service back. A leg that failed leaves
    # no digest, and its download below fails on it.
    if: ${{ !cancelled() && !inputs.dry_run }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service: [gateway, dispatcher]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7.0.1

      - name: Determine tags
        id: tags
        run: scripts/ci/image-tags.sh "${{ matrix.service }}" "${{ inputs.version }}" "${{ inputs.tag_latest }}" >> "$GITHUB_OUTPUT"

      - name: Collect the amd64 digest
        uses: actions/download-artifact@v8
        with:
          name: ${{ matrix.service }}-digest-amd64
          path: digests

      - name: Collect the arm64 digest
        uses: actions/download-artifact@v8
        with:
          name: ${{ matrix.service }}-digest-arm64
          path: digests

      - name: Collect the SBOM
        uses: actions/download-artifact@v8
        with:
          name: ${{ matrix.service }}-sbom

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4.4.1

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Join the architectures under the tags
        id: join
        env:
          IMAGE: ${{ steps.tags.outputs.image }}
          TAGS: ${{ steps.tags.outputs.tags }}
          VERSION: ${{ inputs.version }}
        run: |
          tag_args=$(echo "$TAGS" | tr ',' '\n' | sed 's/^/-t /' | tr '\n' ' ')
          sources=$(cd digests && for d in *; do printf '%s@sha256:%s ' "$IMAGE" "$d"; done)
          # shellcheck disable=SC2086 # both lists split on spaces by design
          docker buildx imagetools create $tag_args $sources
          docker buildx imagetools inspect "$IMAGE:$VERSION"
          echo "digest=$(docker buildx imagetools inspect "$IMAGE:$VERSION" --format '{{json .Manifest}}' | jq -r .digest)" >> "$GITHUB_OUTPUT"

      - name: Attest build provenance
        uses: actions/attest-build-provenance@v4.2.2
        with:
          subject-name: ${{ steps.tags.outputs.image }}
          subject-digest: ${{ steps.join.outputs.digest }}
          push-to-registry: true

      - name: Attest SBOM
        uses: actions/attest-sbom@v4
        with:
          subject-name: ${{ steps.tags.outputs.image }}
          subject-digest: ${{ steps.join.outputs.digest }}
          sbom-path: sbom.spdx.json
          push-to-registry: true

