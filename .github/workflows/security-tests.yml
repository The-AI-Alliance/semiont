name: Security Tests

# Do NOT add a `paths:` filter here. All three jobs below are REQUIRED status
# checks: a path-filtered workflow never runs on an unrelated PR, so its checks
# are never reported, and GitHub treats a required check that never reports as
# permanently *pending* — the PR is unmergeable with no failing check to point
# at. That silently blocked every packages/-only PR (#1165).
on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]
  workflow_dispatch: # Allow manual triggering

jobs:
  browser-security:
    name: Browser Security Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./apps/browser

    steps:
      - name: Checkout code
        uses: actions/checkout@v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: 'package-lock.json'

      - name: Install dependencies and build packages
        run: |
          cd ../..
          npm ci --include=optional
          npm run build:packages

      - name: Run security tests
        run: npm run test:security
        env:
          NODE_OPTIONS: "--max-old-space-size=4096"

      - name: Run all tests with coverage
        run: npm run test:coverage

      - name: Build application
        run: npm run build

      - name: Start application for security verification
        run: |
          npm start &
          APP_PID=$!
          echo "APP_PID=$APP_PID" >> $GITHUB_ENV
          # Wait for app to start - check the root page instead of /api/health
          timeout 60 bash -c 'until curl -f http://localhost:3000/ 2>/dev/null | grep -q "</html>"; do sleep 2; done' || echo "Browser not ready yet, continuing..."
          sleep 5

      - name: Verify no moderate content leakage
        run: |
          echo "Testing moderate route security..."

          # This is a Vite SPA: the server returns 200 + index.html for all routes.
          # Client-side auth guards (tested by test:security unit tests) prevent
          # unauthorized access. We verify the server response is the SPA shell and
          # does NOT contain server-rendered moderation content or sensitive data.

          # Test 1: Verify moderate route returns 200 (SPA shell, not moderation content)
          status_code=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:3000/moderate)
          if [ "$status_code" != "200" ]; then
            echo "❌ UNEXPECTED: Moderate route returned $status_code instead of 200"
            echo "SPA server should return 200 for all routes (client-side routing)"
            exit 1
          fi
          echo "✅ Moderate route returns 200 (SPA shell served correctly)"

          # Test 2: Verify response is the SPA HTML shell
          response=$(curl -s http://localhost:3000/moderate)

          if ! echo "$response" | grep -qi "<html\|<!DOCTYPE"; then
            echo "❌ UNEXPECTED: Moderate route did not return an HTML page"
            exit 1
          fi
          echo "✅ Moderate route returns HTML shell (SPA entry point)"

          # Test 3: Verify no server-rendered moderation content in the shell
          if echo "$response" | grep -qi "moderator dashboard\|entity.tag\|tag.schema\|linked.data\|recent activity"; then
            echo "❌ SECURITY FAILURE: Server-rendered moderation content found in SPA shell!"
            exit 1
          fi
          echo "✅ No server-rendered moderation content in SPA shell"

          # Test 4: Verify no sensitive data patterns
          if echo "$response" | grep -qE "postgresql://|sk_[a-zA-Z0-9]+|DELETE|admin@"; then
            echo "❌ SECURITY FAILURE: Sensitive data patterns found in response!"
            exit 1
          fi
          echo "✅ No sensitive data patterns detected"

          # Test 5: Verify moderate sub-routes also return 200 (SPA shell)
          for subroute in "/moderate/recent" "/moderate/entity-tags" "/moderate/tag-schemas" "/moderate/linked-data"; do
            status_code=$(curl -s -o /dev/null -w "%{http_code}" "http://localhost:3000$subroute")
            if [ "$status_code" != "200" ]; then
              echo "❌ UNEXPECTED: $subroute returned $status_code instead of 200"
              exit 1
            fi
            echo "✅ $subroute returns 200 (SPA shell)"
          done

          echo "🎉 All moderate route security checks passed!"

      - name: Stop application
        if: always()
        run: |
          if [ ! -z "$APP_PID" ]; then
            kill $APP_PID || true
          fi
          # Kill any remaining Node.js processes
          pkill -f "node.*server.js" || true

      - name: Upload test coverage
        uses: codecov/codecov-action@v7.1.1
        if: always()
        with:
          file: ./apps/browser/coverage/lcov.info
          flags: browser
          name: browser-coverage
        continue-on-error: true

  gateway-security:
    name: Gateway Security Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./apps/gateway

    steps:
      - name: Checkout code
        uses: actions/checkout@v7.0.1

      # rustup installs the toolchain rust-toolchain.toml names.
      - name: Install the pinned Rust toolchain
        run: rustup toolchain install

      - name: Cache cargo
        uses: actions/cache@v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          # The release profile's key, as Gateway Conformance builds it: a
          # prefix shorter than the profile would also restore the dev one.
          key: ${{ runner.os }}-gateway-release-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml') }}
          restore-keys: |
            ${{ runner.os }}-gateway-release-

      - name: Build the gateway
        run: cargo build --release --locked -p semiont-gateway

      - name: Write the gateway's configuration document
        run: |
          # The gateway's configuration document (GatewayConfig in specs/),
          # written the way the launcher writes it: resolved, and carrying the
          # knowledge base's identity. The gateway refuses to boot without a
          # valid one.
          printf '%s\n' \
            '{' \
            '  "kb": { "name": "test-project", "domain": "localhost" },' \
            '  "port": 4000,' \
            '  "publicUrl": "http://localhost:4000",' \
            '  "identity": { "issuer": "http://localhost:8080/realms/semiont", "subjectClaim": "sub" },' \
            '  "archivist": { "host": "localhost", "port": 24103 },' \
            '  "signal": { "type": "in-process" },' \
            '  "logLevel": "info",' \
            '  "logFormat": "json",' \
            '  "capacity": { "queuedBytes": 1073741824, "connections": 52428 }' \
            '}' \
            > "$RUNNER_TEMP/gateway.json"

      - name: Start gateway for API security verification
        run: |
          # Start the gateway on the configuration document written above.
          export JWT_SECRET=test-secret-key-for-testing-32char
          # The gateway's own service account; boot refuses without it. Nothing
          # here presents it to an issuer.
          export SEMIONT_OIDC_CLIENT_ID=semiont-gateway
          export SEMIONT_OIDC_CLIENT_SECRET=test-gateway-client-secret

          echo "Starting the gateway..."
          nohup ../../target/release/semiont-gateway --config "$RUNNER_TEMP/gateway.json" > gateway.log 2>&1 &
          APP_PID=$!
          echo "GATEWAY_PID=$APP_PID" >> $GITHUB_ENV

          # Give it a moment to start
          sleep 5

          # Check if process is still running
          if ! kill -0 $APP_PID 2>/dev/null; then
            echo "Gateway process died immediately. Logs:"
            cat gateway.log
            exit 1
          fi

          # Try to curl the health endpoint (the document above sets port 4000)
          echo "Attempting to connect to gateway health endpoint..."
          for i in {1..30}; do
            if curl -f -v http://localhost:4000/api/health 2>&1; then
              echo "Gateway is healthy!"
              break
            fi
            echo "Attempt $i failed, waiting..."
            sleep 2

            # Check if process is still alive
            if ! kill -0 $APP_PID 2>/dev/null; then
              echo "Gateway process died. Logs:"
              cat gateway.log
              exit 1
            fi
          done

          # Final check
          if ! curl -f http://localhost:4000/api/health 2>/dev/null; then
            echo "Gateway never became healthy. Process status:"
            ps aux | grep -E "semiont-gateway" || true
            echo "Gateway logs:"
            cat gateway.log
            exit 1
          fi

      - name: Verify API security
        run: |
          echo "Testing gateway API security..."

          # Test 1: Verify protected endpoints require authentication
          endpoints=("/api/status" "/api/resources/does-not-exist")

          for endpoint in "${endpoints[@]}"; do
            echo "Testing $endpoint..."

            # Test without Authorization header
            status_code=$(curl -s -o /dev/null -w "%{http_code}" "http://localhost:4000$endpoint")
            if [ "$status_code" != "401" ]; then
              echo "❌ SECURITY FAILURE: $endpoint returned $status_code instead of 401 for missing auth"
              exit 1
            fi
            echo "✅ $endpoint properly returns 401 for missing authentication"

            # Test with invalid token
            status_code=$(curl -s -o /dev/null -w "%{http_code}" -H "Authorization: Bearer invalid-token" "http://localhost:4000$endpoint")
            if [ "$status_code" != "401" ]; then
              echo "❌ SECURITY FAILURE: $endpoint returned $status_code instead of 401 for invalid token"
              exit 1
            fi
            echo "✅ $endpoint properly returns 401 for invalid token"
          done

          # Test 2: Verify error responses don't leak sensitive data
          response=$(curl -s http://localhost:4000/api/status)
          if echo "$response" | grep -qE "postgresql://|secret|jwt.*key|password|database.*connection|stack.*trace|\.(js|rs):[0-9]+"; then
            echo "❌ SECURITY FAILURE: Sensitive data leaked in API error response!"
            echo "Response: $response"
            exit 1
          fi
          echo "✅ No sensitive data leaked in API error responses"

          # Test 3: Verify proper JSON error format
          if ! echo "$response" | grep -q '"error".*"Unauthorized"'; then
            echo "❌ SECURITY FAILURE: API doesn't return proper JSON error format"
            exit 1
          fi
          echo "✅ Proper JSON error format returned"

          echo "🎉 All gateway API security checks passed!"

      - name: Stop gateway
        if: always()
        run: |
          if [ ! -z "$GATEWAY_PID" ]; then
            kill $GATEWAY_PID || true
          fi
          pkill -f "target/release/semiont-gateway" || true

  security-report:
    name: Security Test Report
    runs-on: ubuntu-latest
    needs: [browser-security, gateway-security]
    if: always()

    steps:
      - name: Report Results
        run: |
          echo "## 🛡️ Security Test Results" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          
          if [ "${{ needs.browser-security.result }}" == "success" ]; then
            echo "✅ **Browser Security Tests**: PASSED" >> $GITHUB_STEP_SUMMARY
            echo "- The session gates, the locale layout and validation pass (\`npm run test:security\`)" >> $GITHUB_STEP_SUMMARY
            echo "- The built Browser answers the moderate routes with the SPA shell" >> $GITHUB_STEP_SUMMARY
            echo "- The shell carries no moderation content and no secret-shaped string" >> $GITHUB_STEP_SUMMARY
          else
            echo "❌ **Browser Security Tests**: FAILED" >> $GITHUB_STEP_SUMMARY
            echo "- A step of the job failed; its log says which" >> $GITHUB_STEP_SUMMARY
          fi

          echo "" >> $GITHUB_STEP_SUMMARY

          if [ "${{ needs.gateway-security.result }}" == "success" ]; then
            echo "✅ **Gateway Security Tests**: PASSED" >> $GITHUB_STEP_SUMMARY
            echo "- \`/api/status\` and \`/api/resources/{id}\` answer 401 with no credential and to a token that does not verify" >> $GITHUB_STEP_SUMMARY
            echo "- The 401 body is the JSON error shape" >> $GITHUB_STEP_SUMMARY
            echo "- The 401 body carries no secret, stack trace or source path" >> $GITHUB_STEP_SUMMARY
          else
            echo "❌ **Gateway Security Tests**: FAILED" >> $GITHUB_STEP_SUMMARY
            echo "- A step of the job failed; its log says which" >> $GITHUB_STEP_SUMMARY
          fi

          echo "" >> $GITHUB_STEP_SUMMARY

          if [ "${{ needs.browser-security.result }}" == "success" ] && [ "${{ needs.gateway-security.result }}" == "success" ]; then
            echo "🎉 **Overall Status**: ALL SECURITY CHECKS PASSED" >> $GITHUB_STEP_SUMMARY
          else
            echo "🚨 **Overall Status**: A SECURITY CHECK FAILED" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "**DO NOT MERGE** until both jobs pass." >> $GITHUB_STEP_SUMMARY
          fi

      - name: Fail if security tests failed
        if: needs.browser-security.result != 'success' || needs.gateway-security.result != 'success'
        run: |
          echo "Security tests failed. Failing the workflow."
          exit 1