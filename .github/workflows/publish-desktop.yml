name: Publish Desktop App

on:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7.0.1

      - name: Install Apple container runtime
        run: brew install container

      - name: Build and package Semiont Desktop
        run: make desktop-macos

      - name: Build Linux x64 package
        run: make desktop-linux

      - name: Upload macOS installer
        uses: actions/upload-artifact@v7
        with:
          name: desktop-macos-arm64
          path: apps/desktop/release/*.dmg
          if-no-files-found: error

      - name: Upload Linux package
        uses: actions/upload-artifact@v7
        with:
          name: desktop-linux-x64
          path: apps/desktop/release/*.deb
          if-no-files-found: error

  attach:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1

      - name: Read version
        id: version
        run: echo "version=$(jq -r .version version.json)" >> "$GITHUB_OUTPUT"

      - name: Download installer
        uses: actions/download-artifact@v8
        with:
          name: desktop-macos-arm64
          path: artifacts/macos

      - name: Download Linux package
        uses: actions/download-artifact@v8
        with:
          name: desktop-linux-x64
          path: artifacts/linux

      - name: Attach to GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="v${{ steps.version.outputs.version }}"
          echo "Attaching Semiont Desktop to release $TAG..."
          find artifacts -type f \( -name '*.dmg' -o -name '*.deb' \) | while read f; do
            echo "  Uploading $(basename "$f")..."
            gh release upload "$TAG" "$f" --clobber
          done
