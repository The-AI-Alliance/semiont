name: Continuous Integration

# Three tiers, which the `changes` job decides (.github/scripts/changed-areas.mjs):
# a pull request and a push to main run the jobs whose areas they touched; the
# nightly schedule, a dispatch and a release's call run every job, those that
# run at night and for a release alone among them (`tier == 'full'`).
on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]
  workflow_dispatch:
  # 08:17 UTC: 4:17 in the morning Eastern under daylight time, 3:17 under
  # standard, off the hour, when GitHub delays scheduled runs least. A scheduled
  # run that fails mails whoever last changed this line.
  schedule:
    - cron: '17 8 * * *'
  # release.yml calls the full tier on the commit it is about to tag.
  workflow_call:

# One run per pull request: a push cancels the run of the push before it, which
# nobody is waiting for. A push to main is never cancelled: it is the run that
# sees the merged tree. lint:workflows holds every pull-request workflow to this.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # ── The first stage ──────────────────────────────────────────────────
  # census, changes and generated-artifacts need no build and finish in about
  # two minutes. Every other job needs all three, so a tree that fails a census or has
  # drifted from its spec starts none of the forty-odd matrix legs behind it, and the
  # pool of twenty concurrent jobs the organisation shares goes to pull
  # requests that can pass. lint:workflows holds every job to this.
  census:
    name: Census
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: 'npm'
          cache-dependency-path: 'package-lock.json'

      # The lints read the tree as git holds it and the tools in node_modules;
      # none reads a built package, so nothing is built here.
      - name: Install dependencies
        run: npm ci --include=optional

      # Every gate below is INDEPENDENT: each checks a different invariant, and
      # a failure in one says nothing about the others, so all of them run and
      # the step fails if any did.
      - name: Run the lint gates
        run: |
          fail=0
          npm run lint:css || fail=1
          npm run lint:css-variables || fail=1
          npm run lint:css-classes || fail=1
          npm run lint:docs-names || fail=1
          npm run lint:translations || fail=1
          npm run lint:no-utility-classes || fail=1
          npm run lint:core-subpaths || fail=1
          npm run lint:service-role || fail=1
          npm run lint:attribution || fail=1
          npm run lint:trace-field || fail=1
          npm run lint:coverage-roster || fail=1
          npm run lint:compliance-audits || fail=1
          npm run lint:vitest-coverage || fail=1
          npm run lint:notice || fail=1
          npm run lint:dependabot || fail=1
          npm run lint:broker-boundary || fail=1
          npm run lint:staging-boundary || fail=1
          npm run lint:secure-context-apis || fail=1
          npm run lint:skips-and-any || fail=1
          npm run lint:event-tags || fail=1
          npm run lint:spec-protocol || fail=1
          npm run lint:spec-jobs || fail=1
          npm run lint:spec-archivist || fail=1
          npm run lint:spec-identifiers || fail=1
          npm run lint:spec-case-tables || fail=1
          npm run lint:spec-channel-rosters || fail=1
          npm run lint:spec-reference-forms || fail=1
          npm run lint:spec-offset-units || fail=1
          npm run lint:spec-reply-bounds || fail=1
          npm run lint:spec-stack || fail=1
          npm run openapi:lint || fail=1
          npm run lint:service-environment || fail=1
          npm run lint:telemetry-doc || fail=1
          npm run lint:rust-images || fail=1
          npm run lint:rust-toolchain || fail=1
          npm run lint:go-toolchain || fail=1
          npm run lint:python-version || fail=1
          npm run lint:node-version || fail=1
          npm run lint:nats-version || fail=1
          npm run lint:conformance-readmes || fail=1
          npm run lint:transport-contract || fail=1
          npm run lint:client-surface || fail=1
          npm run lint:state-unit-census || fail=1
          npm run lint:state-unit-cases || fail=1
          npm run lint:internal-deps || fail=1
          npm run lint:workflows || fail=1
          npm run lint:labels || fail=1
          exit $fail

  # Which areas this push changed, read by every job's `if:`. A job whose
  # areas are untouched is skipped, and a skipped job passes the gate: GitHub
  # reports it as Success. A push to main, a dispatch, or a change to the
  # workflows, the CI scripts or the spec runs everything
  # (.github/scripts/changed-areas.mjs). lint:workflows holds every job to an
  # `if` over areas this map defines, so a job cannot fall out of it.
  changes:
    name: Changed Areas
    runs-on: ubuntu-latest
    # paths-filter lists a pull request's files through the API, which takes
    # this scope; the job's token alone has it, the other jobs keep the default.
    permissions:
      contents: read
      pull-requests: read
    outputs:
      rust: ${{ steps.areas.outputs.rust }}
      ts: ${{ steps.areas.outputs.ts }}
      conformance: ${{ steps.areas.outputs.conformance }}
      go: ${{ steps.areas.outputs.go }}
      python-sdk: ${{ steps.areas.outputs.python-sdk }}
      python-inference: ${{ steps.areas.outputs.python-inference }}
      python-graph: ${{ steps.areas.outputs.python-graph }}
      python-vectors: ${{ steps.areas.outputs.python-vectors }}
      python-service: ${{ steps.areas.outputs.python-service }}
      worker: ${{ steps.areas.outputs.worker }}
      weaver: ${{ steps.areas.outputs.weaver }}
      smelter: ${{ steps.areas.outputs.smelter }}
      librarian: ${{ steps.areas.outputs.librarian }}
      compliance: ${{ steps.areas.outputs.compliance }}
      tier: ${{ steps.areas.outputs.tier }}
    steps:
      # The parent too: a push is mapped against the commit before it.
      - name: Checkout code
        uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 2

      - name: Which paths changed
        id: filter
        uses: dorny/paths-filter@v4.0.3
        with:
          filters: |
            all:
              - '.github/**'
              - 'scripts/ci/**'
              - 'specs/**'
            # The Rust workspace: the three services, the crates they share,
            # the lockfile, the toolchain, cargo-deny's policy, and the two
            # scripts the Gateway Tests job runs over the crates. lint:workflows
            # holds every directory under apps/, images/ and packages/ that has a
            # manifest to a pattern of some filter, so a new package is mapped
            # or the lint says so.
            rust:
              - 'images/gateway/**'
              - 'images/dispatcher/**'
              - 'images/archivist/**'
              - 'packages/codegen-rust/**'
              - 'packages/core-rust/**'
              - 'packages/http-service-rust/**'
              - 'packages/http-transport-rust/**'
              - 'packages/observability-rust/**'
              - 'packages/sdk-rust/**'
              - 'packages/telemetry-rust/**'
              - 'Cargo.toml'
              - 'Cargo.lock'
              - 'rust-toolchain.toml'
              - 'deny.toml'
              - 'scripts/lint/check-image-crates.mjs'
              - 'scripts/release/cargo-version.sh'
            # The npm workspaces, each named (the filter takes no exclusion
            # without a quantifier that breaks a list of several), and what
            # builds them. The conformance suites build @semiont/core or the
            # packages from the root, so a change here runs them too.
            ts:
              - 'images/browser/**'
              - 'apps/desktop/**'
              - 'packages/core/**'
              - 'packages/http-transport/**'
              - 'packages/observability/**'
              - 'packages/react-ui/**'
              - 'packages/sdk/**'
              - 'package.json'
              - 'package-lock.json'
              - 'tsconfig.base.json'
              - 'vitest.shared.config.ts'
              - '.node-version'
            conformance:
              - 'tests/conformance/**'
            go:
              - 'apps/launcher/**'
              - 'packages/go/sdk/**'
            # Each Python project; a job lists its own and the ones its
            # pyproject depends on (every one depends on the SDK).
            python-sdk:
              - 'packages/sdk-python/**'
            python-inference:
              - 'packages/inference-python/**'
            python-graph:
              - 'packages/graph-python/**'
            python-vectors:
              - 'packages/vectors-python/**'
            python-service:
              - 'packages/service-python/**'
            worker:
              - 'images/worker/**'
            weaver:
              - 'images/weaver/**'
            smelter:
              - 'images/smelter/**'
            librarian:
              - 'images/librarian/**'
            # What the compliance audits read beside the code areas: their own
            # scripts, the docs whose snippets they compile and the fixture
            # they compile them in, and the Dockerfiles they hold to
            # supervision.
            compliance:
              - 'scripts/compliance/**'
              - 'docs/**'
              - 'tests/doc-snippets/**'
              - 'images/*/Dockerfile'

      - name: Which areas run
        id: areas
        env:
          FILTERS: ${{ toJSON(steps.filter.outputs) }}
          EVENT: ${{ github.event_name }}
        run: node .github/scripts/changed-areas.mjs

  test-browser:
    name: Browser Tests
    runs-on: ubuntu-latest
    needs: [census, changes, generated-artifacts]
    if: needs.changes.outputs.ts == 'true'

    steps:
      - name: Checkout code
        uses: actions/checkout@v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: 'npm'
          cache-dependency-path: 'package-lock.json'

      - name: Build packages
        run: |
          npm ci --include=optional
          npm run build:packages

      - name: Run browser type check
        run: |
          echo "Running browser TypeScript type check..."
          cd images/browser
          npm run typecheck
        env:
          CI: true
          NODE_OPTIONS: "--max-old-space-size=4096"

      # The suite once, with coverage. Coverage sets no threshold, so the run
      # fails exactly when the suite does; the security files Browser Security
      # Tests once ran again (`test:security`) are files of this suite.
      - name: Run browser tests
        run: |
          cd images/browser
          npm run test:coverage
        env:
          CI: true
          NODE_OPTIONS: "--max-old-space-size=4096"

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v7.1.1
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./images/browser/coverage/lcov.info
          flags: browser
          name: browser
          verbose: true
        continue-on-error: true

  # Each npm package's suite, once, with coverage: coverage sets no threshold,
  # so the run fails exactly when the suite does (docs/contributor/TESTING.md).
  # react-ui's accessibility tests are tests of its suite.
  test-package:
    name: Test ${{ matrix.package }}
    runs-on: ubuntu-latest
    needs: [census, changes, generated-artifacts]
    if: needs.changes.outputs.ts == 'true'
    strategy:
      fail-fast: false
      matrix:
        package:
          - http-transport
          - core
          - observability
          - react-ui
          - sdk

    steps:
      - name: Checkout code
        uses: actions/checkout@v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: 'npm'
          cache-dependency-path: 'package-lock.json'

      - name: Install dependencies
        run: npm ci --include=optional

      # What each package needs built to test, and no more.
      - name: Build the package's dependencies
        run: |
          case "${{ matrix.package }}" in
            core)
              npm run openapi:bundle
              ;;
            http-transport|observability)
              npm run openapi:bundle
              npm run build --workspace=@semiont/core
              ;;
            sdk)
              npm run openapi:bundle
              npm run build --workspace=@semiont/core
              npm run build --workspace=@semiont/http-transport
              ;;
            react-ui)
              npm run openapi:bundle
              npm run build --workspace=@semiont/core
              npm run build --workspace=@semiont/http-transport
              npm run build --workspace=@semiont/sdk
              ;;
          esac

      - name: Build the package
        run: npm run build --workspace=@semiont/${{ matrix.package }}

      - name: Type-check
        run: npm run typecheck --workspace=@semiont/${{ matrix.package }}
        env:
          CI: true

      - name: Run the tests with coverage
        run: |
          cd packages/${{ matrix.package }}
          npm run test:coverage
          node -e "
            const total = require('./coverage/coverage-summary.json').total;
            console.log('## Coverage for ${{ matrix.package }}\n');
            for (const k of ['lines', 'statements', 'functions', 'branches']) console.log('- ' + k + ': ' + total[k].pct + '%');
          " >> "$GITHUB_STEP_SUMMARY"
        env:
          CI: true

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v7.1.1
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./packages/${{ matrix.package }}/coverage/lcov.info
          flags: ${{ matrix.package }}
          name: ${{ matrix.package }}
          verbose: true
        continue-on-error: true

  # The built Browser, served as it ships, answers the moderation routes with
  # its shell and carries no moderation content and no secret-shaped string.
  browser-security:
    name: Browser Security Tests
    runs-on: ubuntu-latest
    needs: [census, changes, generated-artifacts]
    if: needs.changes.outputs.ts == 'true'
    defaults:
      run:
        working-directory: ./images/browser

    steps:
      - name: Checkout code
        uses: actions/checkout@v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: 'npm'
          cache-dependency-path: 'package-lock.json'

      - name: Install dependencies and build packages
        run: |
          cd ../..
          npm ci --include=optional
          npm run build:packages

      - name: Build application
        run: npm run build

      - name: Start application for security verification
        run: |
          npm start &
          APP_PID=$!
          echo "APP_PID=$APP_PID" >> $GITHUB_ENV
          timeout 60 bash -c 'until curl -f http://localhost:3000/ 2>/dev/null | grep -q "</html>"; do sleep 2; done'

      - name: Verify no moderate content leakage
        run: |
          # This is a Vite SPA: the server returns 200 + index.html for every
          # route, and client-side guards (the suite's session-gate tests) keep
          # a signed-out reader out. The server's answer must be that shell and
          # nothing more.
          status_code=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:3000/moderate)
          if [ "$status_code" != "200" ]; then
            echo "❌ /moderate returned $status_code, not the SPA shell's 200"
            exit 1
          fi
          response=$(curl -s http://localhost:3000/moderate)
          if ! echo "$response" | grep -qi "<html\|<!DOCTYPE"; then
            echo "❌ /moderate did not return an HTML page"
            exit 1
          fi
          if echo "$response" | grep -qi "moderator dashboard\|entity.tag\|tag.schema\|linked.data\|recent activity"; then
            echo "❌ SECURITY FAILURE: server-rendered moderation content in the SPA shell"
            exit 1
          fi
          if echo "$response" | grep -qE "sk-ant-[A-Za-z0-9_-]+|eyJ[A-Za-z0-9_-]{10,}\.eyJ"; then
            echo "❌ SECURITY FAILURE: a secret-shaped string in the SPA shell"
            exit 1
          fi
          for subroute in "/moderate/recent" "/moderate/entity-tags" "/moderate/tag-schemas" "/moderate/linked-data"; do
            status_code=$(curl -s -o /dev/null -w "%{http_code}" "http://localhost:3000$subroute")
            if [ "$status_code" != "200" ]; then
              echo "❌ $subroute returned $status_code, not the SPA shell's 200"
              exit 1
            fi
          done
          echo "✅ The moderation routes answer the SPA shell, with no moderation content and no secret"

      - name: Stop application
        if: always()
        run: |
          if [ -n "$APP_PID" ]; then kill "$APP_PID" || true; fi
          # npm start runs `vite preview`; the npm wrapper can leave it behind.
          pkill -f "vite preview" || true

  # Lighthouse's accessibility audit of the built Browser's signed-out pages.
  # images/browser/lighthouserc.json names the pages and the score they must reach.
  lighthouse-accessibility:
    name: Lighthouse - Signed-out Pages
    runs-on: ubuntu-latest
    needs: [census, changes, generated-artifacts]
    if: needs.changes.outputs.ts == 'true'

    steps:
      - name: Checkout code
        uses: actions/checkout@v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: 'npm'
          cache-dependency-path: 'package-lock.json'

      - name: Build dependencies
        run: |
          npm ci --include=optional
          npm run openapi:bundle
          npm run build --workspace=@semiont/core
          npm run build --workspace=@semiont/http-transport
          npm run build --workspace=@semiont/sdk
          npm run build --workspace=@semiont/react-ui

      - name: Build browser
        run: |
          cd images/browser
          npm run build

      - name: Install Lighthouse CI
        run: npm install -g @lhci/cli@0.15.1

      - name: Audit the signed-out pages
        run: |
          cd images/browser
          lhci collect

      - name: Assert the audit's scores
        id: assert
        run: |
          cd images/browser
          # lhci assert passes when it finds no reports at all
          ls .lighthouseci/lhr-*.json > /dev/null
          lhci assert

      - name: Upload Lighthouse results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: lighthouse-results
          path: images/browser/.lighthouseci
          retention-days: 30

      # A run Dependabot started has a read-only token, which cannot comment.
      - name: Comment PR with Lighthouse results
        if: always() && github.event_name == 'pull_request' && github.actor != 'dependabot[bot]'
        uses: actions/github-script@v9
        env:
          ASSERT_OUTCOME: ${{ steps.assert.outcome }}
        with:
          script: |
            const fs = require('fs');
            const path = require('path');

            const lighthouseDir = 'images/browser/.lighthouseci';
            const reports = fs.existsSync(lighthouseDir)
              ? fs.readdirSync(lighthouseDir)
                  .filter((f) => f.startsWith('lhr-') && f.endsWith('.json'))
                  .map((f) => JSON.parse(fs.readFileSync(path.join(lighthouseDir, f), 'utf8')))
              : [];

            let body;
            if (reports.length === 0) {
              body = '❌ **Lighthouse produced no report.** It could not audit the built Browser; see the job log.';
            } else {
              const scores = new Map();
              for (const report of reports) {
                const page = new URL(report.requestedUrl).pathname;
                if (!scores.has(page)) scores.set(page, []);
                scores.get(page).push(Math.round(report.categories.accessibility.score * 100));
              }
              const rows = [...scores].map(([page, runs]) => `| \`${page}\` | ${runs.join(', ')} |`);
              const verdict = {
                success: '✅ The scores meet `images/browser/lighthouserc.json`.',
                failure: '❌ The scores fall short of `images/browser/lighthouserc.json`.',
              }[process.env.ASSERT_OUTCOME] ?? `The assertion step did not finish (${process.env.ASSERT_OUTCOME}).`;
              body = [
                '**Lighthouse accessibility, signed-out pages**',
                '',
                '| Page | Score per run |',
                '|---|---|',
                ...rows,
                '',
                verdict,
                '',
                'Full results are in the workflow artifacts.',
              ].join('\n');
            }

            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body,
            })

  # The audits in scripts/compliance, against the built packages. They read the
  # sources of every app, the launcher, the docs and the Dockerfiles, so they
  # run on any of those areas.
  compliance-check:
    name: React Hooks Architecture Review
    runs-on: ubuntu-latest
    needs: [census, changes, generated-artifacts]
    if: needs.changes.outputs.ts == 'true' || needs.changes.outputs.go == 'true' || needs.changes.outputs.rust == 'true' || needs.changes.outputs.worker == 'true' || needs.changes.outputs.weaver == 'true' || needs.changes.outputs.smelter == 'true' || needs.changes.outputs.librarian == 'true' || needs.changes.outputs.compliance == 'true'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: 'npm'
          cache-dependency-path: 'package-lock.json'

      - name: Install dependencies
        run: npm ci --include=optional

      - name: Build packages (doc-snippets gate checks docs against dist)
        id: build
        run: npm run build:packages

      # Every gate below is INDEPENDENT: each checks a different invariant, and a
      # failure in one says nothing about the others. They defaulted to
      # `if: success()`, so the first failure skipped the rest — which meant one
      # push per problem, and (because two of the skipped steps WRITE the
      # compliance reports) a `cat` further down failing on a file nobody was
      # going to produce.
      #
      # They all depend on the build, though: auditing docs against a `dist` that
      # was never emitted would report nonsense. So each runs when the BUILD
      # succeeded, regardless of its sibling gates. `!cancelled()` rather than
      # `always()` so a cancelled run stops promptly.
      #
      # The lint:* gates, which read the tree and no build, run in the census
      # job, ahead of everything that builds.

      - name: Run Doc Snippets Audit
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: |
          echo "::group::Doc Snippets Audit (sdk docs' code fences compile against dist through the exports map)"
          ./scripts/compliance/audit-doc-snippets.sh
          echo "::endgroup::"

      - name: Run React Hooks Ordering Audit
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: |
          echo "::group::React Hooks Ordering Audit (no hook in a conditional render or inside a callback)"
          npx tsx ./scripts/compliance/audit-hooks-ordering.ts
          echo "::endgroup::"

      - name: Run Raw Bus Access Audit
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: |
          echo "::group::Raw Bus Access Audit (forbid client.emit/.on/.stream outside the SDK)"
          ./scripts/compliance/audit-raw-bus.sh
          echo "::endgroup::"

      - name: Run StateUnit Compliance Audit
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: |
          echo "::group::StateUnit Compliance Audit (no class in a state-unit file / X3-static no-module-state / X5 fire-and-forget / A5 gathered context is SDK state / session-bound units built under a session)"
          fail=0
          ./scripts/compliance/audit-state-unit-no-class.sh || fail=1
          ./scripts/compliance/audit-state-unit-module-state.sh || fail=1
          ./scripts/compliance/audit-fire-and-forget-promise-void.sh || fail=1
          ./scripts/compliance/audit-gathered-context-component-state.sh || fail=1
          ./scripts/compliance/audit-session-typed-factories.sh || fail=1
          echo "::endgroup::"
          exit $fail

      - name: Run Boot Contract Audit
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: |
          echo "::group::Boot Contract Audit (P1-P3 path environment + H1 test-env hygiene + vi.mock targets + every service image can be supervised)"
          fail=0
          ./scripts/compliance/audit-path-env.sh || fail=1
          ./scripts/compliance/audit-test-env-hygiene.sh || fail=1
          ./scripts/compliance/audit-mock-targets.sh || fail=1
          ./scripts/compliance/audit-supervision.sh || fail=1
          echo "::endgroup::"
          exit $fail

      - name: Run Storage-URI One-Home Audit
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: |
          echo "::group::Storage-URI One-Home Audit (storageUri lives on Representation; descriptor access is invisible to tsc)"
          ./scripts/compliance/audit-storage-uri-one-home.sh
          echo "::endgroup::"

      - name: Run One-Home Audits
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: |
          echo "::group::One-Home Audits (A6 one generated validator over the spec + toolbar preferences persisted by the policy layer alone)"
          fail=0
          ./scripts/compliance/audit-spec-validator.sh || fail=1
          ./scripts/compliance/audit-toolbar-pref-storage.sh || fail=1
          echo "::endgroup::"
          exit $fail

      # The two audits below decide by exit status: batch-audit.ts exits
      # non-zero when a symbol fails, its wrapper passes that on, and the step
      # fails. Nothing here reads a report to find out. This step holds the
      # audits to that: each must refuse a planted violation and pass a clean
      # tree, because a gate that cannot fail passes everything.
      - name: Check the Compliance Audits Can Fail
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: ./scripts/compliance/audit-compliance-gate.sh

      - name: Run React-UI Compliance Audit
        id: react-ui-audit
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: |
          cd packages/react-ui
          ./scripts/generate-compliance-report.sh

      - name: Run Browser Compliance Audit
        id: browser-audit
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: |
          cd images/browser
          ./scripts/generate-compliance-report.sh

      - name: Display Full React-UI Report
        if: always()
        run: |
          echo "::group::Full React-UI Compliance Report"
          cat .compliance/REACT-UI-COMPLIANCE.md
          echo "::endgroup::"

      - name: Display Full Browser Report
        if: always()
        run: |
          echo "::group::Full Browser Compliance Report"
          cat .compliance/BROWSER-COMPLIANCE.md
          echo "::endgroup::"

      - name: Upload React-UI Compliance Report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: react-ui-compliance-report
          path: .compliance/REACT-UI-COMPLIANCE.md
          retention-days: 30

      - name: Upload Browser Compliance Report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: browser-compliance-report
          path: .compliance/BROWSER-COMPLIANCE.md
          retention-days: 30

      - name: Create Summary
        if: always()
        run: |
          echo "## Architecture Compliance Report" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          # React-UI Summary
          echo "### React-UI Package" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          grep -A 10 "^## Summary" .compliance/REACT-UI-COMPLIANCE.md >> $GITHUB_STEP_SUMMARY || echo "Report not generated" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          # Browser Summary
          echo "### Browser Application" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          grep -A 10 "^## Summary" .compliance/BROWSER-COMPLIANCE.md >> $GITHUB_STEP_SUMMARY || echo "Report not generated" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          # Overall Status
          echo "---" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          if [ "${{ steps.react-ui-audit.outcome }}" = "success" ] && [ "${{ steps.browser-audit.outcome }}" = "success" ]; then
            echo "✅ **PASSED**: no failing symbol in either workspace" >> $GITHUB_STEP_SUMMARY
          else
            echo "❌ **FAILED**: React-UI audit ${{ steps.react-ui-audit.outcome }}, Browser audit ${{ steps.browser-audit.outcome }}" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "Each failing audit names its failing symbols in its own step's log, and the full reports are above." >> $GITHUB_STEP_SUMMARY
          fi

  test-gateway:
    name: Gateway Tests
    runs-on: ubuntu-latest
    needs: [census, changes, generated-artifacts]
    if: needs.changes.outputs.rust == 'true'

    steps:
      - name: Checkout code
        uses: actions/checkout@v7.0.1

      # rustup installs the toolchain rust-toolchain.toml names, with rustfmt
      # and clippy.
      - name: Install the pinned Rust toolchain
        run: |
          rustup toolchain install
          cargo --version

      # Its own key: this job builds the dev profile (clippy, tests) and
      # Gateway Conformance the release one. A cache key is saved once, by
      # whichever job finishes first, so a shared key left the other restoring
      # the wrong profile and compiling every crate, every run.
      - name: Cache cargo
        uses: actions/cache@v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-gateway-dev-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml') }}
          restore-keys: |
            ${{ runner.os }}-gateway-dev-

      # The gateway's behaviour is the Gateway Conformance job's; what runs
      # here is the code's own hygiene and the runners for the shared case
      # tables, its only Rust tests.
      - name: Format, lint, and run the shared-table runners
        run: |
          cargo fmt --all --check
          cargo clippy --workspace --all-targets --locked -- -D warnings
          cargo test --workspace --locked

      # The broker is reached only by a crate that asks for semiont-core's
      # `nats` feature: the SDK, its telemetry, its HTTP transport,
      # observability, semiont-core itself and the dispatcher's handlers carry
      # no NATS client.
      - name: Check which crates can reach the broker
        run: |
          for crate in semiont semiont-telemetry semiont-http-transport semiont-observability semiont-core semiont-dispatcher-handlers; do
            if cargo tree --locked -p "$crate" -e normal | grep -q '^.*async-nats '; then
              echo "✗ $crate reaches async-nats; only a crate that enables semiont-core's nats feature may"
              exit 1
            fi
          done

      # The Archivist's record keeps files and nothing else: it reaches no
      # network and links no git. The HTTP surface, the bus and the staging
      # drivers are crates beside it.
      - name: Check the Archivist's record links no HTTP and no git
        run: |
          if cargo tree --locked -p semiont-archivist-record -e normal --prefix none | grep -E '^(reqwest|hyper|axum|git2|gix|semiont-http-[a-z]+|async-nats) v'; then
            echo "✗ semiont-archivist-record links an HTTP client or server, the broker or a git library; the record is files, and those are the crates around it"
            exit 1
          fi

      # The SDK names a transport and never is one: HTTP and OpenTelemetry
      # are the crates beside it, which a client that wants neither leaves out.
      - name: Check the SDK links no HTTP client and no telemetry
        run: |
          if cargo tree --locked -p semiont -e normal | grep -E '(^|[^a-z-])(reqwest|hyper|opentelemetry[a-z_-]*) v'; then
            echo "✗ semiont links an HTTP client or OpenTelemetry; those belong to semiont-http-transport and semiont-telemetry"
            exit 1
          fi

      # A transport reports through semiont-telemetry's functions, and what
      # exports is the application's to link: no exporter, no OpenTelemetry
      # SDK and no allocator reading reaches a client through its transport
      # or through semiont-telemetry, which is no transport either. The
      # transport names no OpenTelemetry of its own.
      - name: Check the HTTP transport links no exporter and names no OpenTelemetry
        run: |
          for crate in semiont-http-transport semiont-telemetry; do
            if cargo tree --locked -p "$crate" -e normal --prefix none | grep -E '^(semiont-observability|opentelemetry_sdk|opentelemetry-otlp|opentelemetry-stdout|tikv-jemalloc[a-z-]*) v'; then
              echo "✗ $crate links an exporter, the OpenTelemetry SDK or jemalloc; those are a service's, in semiont-observability"
              exit 1
            fi
          done
          if cargo tree --locked -p semiont-telemetry -e normal --prefix none | grep -E '^(reqwest|hyper) v'; then
            echo "✗ semiont-telemetry links an HTTP client; it is every transport's, and is none"
            exit 1
          fi
          if cargo tree --locked -p semiont-http-transport -e normal --depth 1 --prefix none | grep -E '^opentelemetry[a-z_-]* v'; then
            echo "✗ semiont-http-transport names OpenTelemetry itself; a transport reports through semiont-telemetry"
            exit 1
          fi

      # The crates published to crates.io are these four and no other, so a
      # crate that loses `publish = false` unmeant fails here; and each carries
      # version.json's version, as every published package does
      # (scripts/release/cargo-version.sh keeps it so).
      - name: Check which crates are published, and at what version
        run: |
          released=$(jq -r .version version.json)
          expected=$(printf '%s\n' semiont semiont-codegen semiont-http-transport semiont-telemetry | sed "s/$/ $released/" | sort)
          published=$(cargo metadata --locked --no-deps --format-version 1 | jq -r '.packages[] | select(.publish == null) | "\(.name) \(.version)"' | sort)
          if [ "$published" != "$expected" ]; then
            echo "✗ the workspace publishes:"; echo "$published"
            echo "  where these were expected, at version.json's version:"; echo "$expected"
            exit 1
          fi

      # What publish-crates.yml does before it uploads anything, done here on
      # every change: each published crate packages, and builds from its
      # packaged form against the others. A release is not the first place a
      # crate that does not package is seen. A version already on crates.io is
      # a warning to a dry run and not a refusal, so this holds on main between
      # a release and the bump after it.
      #
      # In a build directory of its own, which no cache restores. To cargo, the
      # packaged form of one of these crates is a registry package of its
      # version, and cargo never rebuilds a registry package it has built. In
      # the cached `target`, a crate built from another crate's packaged form
      # would be built against what that crate was when the cache was saved.
      #
      # And with no copy of these crates in cargo's home, which the cache above
      # does restore. Cargo unpacks a registry package into its home once, and
      # never unpacks one it finds there. So a crate whose API changed at a
      # version it already had would be read from the copy an earlier run left,
      # and the crates that use the new API would not build against it.
      - name: Package and build every published crate
        run: |
          cargo metadata --locked --no-deps --format-version 1 \
            | jq -r '.packages[] | select(.publish == null) | "\(.name)-\(.version)"' \
            | while read -r crate; do
                rm -rf "${CARGO_HOME:-$HOME/.cargo}"/registry/src/*/"$crate" "${CARGO_HOME:-$HOME/.cargo}"/registry/cache/*/"$crate.crate"
              done
          cargo publish --dry-run --workspace --locked --target-dir "$RUNNER_TEMP/packaged"

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .node-version

      # Every crate each service binary links, on each platform the images are
      # built for, is under a permitted licence and credited in its image's NOTICE.
      - name: Check the crates the service binaries link
        run: |
          mkdir "$RUNNER_TEMP/crates"
          cargo metadata --format-version 1 --locked > "$RUNNER_TEMP/crates/metadata.json"
          for binary in semiont-gateway semiont-dispatcher semiont-archivist; do
            for target in x86_64-unknown-linux-musl aarch64-unknown-linux-musl; do
              cargo tree --locked -p "$binary" -e normal,no-proc-macro --target "$target" --prefix none --format '{p}' \
                > "$RUNNER_TEMP/crates/linked-$binary-$target.txt"
            done
          done
          node scripts/lint/check-image-crates.mjs "$RUNNER_TEMP/crates"

  # ── The Rust binaries, built once ─────────────────────────────────────
  # The nine conformance suites start a gateway, and some a dispatcher, an
  # Archivist or the Rust SDK's three drivers, all from target/release
  # (tests/conformance/harness/paths.ts). Each suite built its own: nine
  # release builds a run, twenty minutes of a pool of twenty against thirteen
  # of suites. This job builds the six binaries once and publishes them; the
  # suites fetch them and build nothing. It runs whenever any suite does: its
  # areas are the union of theirs. Gateway Tests builds the debug profile for
  # cargo test and is not this. lint:workflows holds the release build to
  # this job alone.
  build-rust:
    name: Rust Binaries
    runs-on: ubuntu-latest
    needs: [census, changes, generated-artifacts]
    if: needs.changes.outputs.rust == 'true' || needs.changes.outputs.ts == 'true' || needs.changes.outputs.conformance == 'true' || needs.changes.outputs.worker == 'true' || needs.changes.outputs.weaver == 'true' || needs.changes.outputs.smelter == 'true' || needs.changes.outputs.librarian == 'true' || needs.changes.outputs.python-sdk == 'true' || needs.changes.outputs.python-inference == 'true' || needs.changes.outputs.python-graph == 'true' || needs.changes.outputs.python-vectors == 'true' || needs.changes.outputs.python-service == 'true' || needs.changes.outputs.go == 'true'
    steps:
      - name: Checkout code
        uses: actions/checkout@v7.0.1

      # Built from these sources before? Then the six binaries come back and
      # nothing compiles: a pull request that changes no Rust starts its suites
      # minutes sooner. The key hashes what the Rust images' layers' key in
      # stack-smoke.yml hashes, which lint:workflows holds to everything the
      # build reads, and holds equal to this one. No restore-keys: a binary
      # built from other sources is the wrong binary.
      - name: Restore the binaries built from these sources
        id: binaries
        uses: actions/cache@v6.1.0
        with:
          path: |
            target/release/semiont-gateway
            target/release/semiont-dispatcher
            target/release/semiont-archivist
            target/release/semiont-wire-driver
            target/release/semiont-live-driver
            target/release/semiont-worker-driver
          key: ${{ runner.os }}-rust-binaries-${{ hashFiles('rust-toolchain.toml', 'version.json', 'specs/src/**', 'Cargo.toml', 'Cargo.lock', 'images/gateway/**', 'images/dispatcher/**', 'images/archivist/**', 'packages/*-rust/**', '.dockerignore') }}

      - name: Install the pinned Rust toolchain
        if: steps.binaries.outputs.cache-hit != 'true'
        run: |
          rustup toolchain install

      # Its own key, for the release profile: see Gateway Tests.
      - name: Cache cargo
        if: steps.binaries.outputs.cache-hit != 'true'
        uses: actions/cache@v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-gateway-release-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml') }}
          restore-keys: |
            ${{ runner.os }}-gateway-release-

      - name: Build the services and the Rust drivers
        if: steps.binaries.outputs.cache-hit != 'true'
        run: cargo build --release --locked -p semiont-gateway -p semiont-dispatcher -p semiont-archivist -p semiont-conformance-drivers

      # Several paths: the artifact's root is their common directory, so a
      # suite fetching it into target/release gets the six files there.
      - name: Publish the binaries
        uses: actions/upload-artifact@v7
        with:
          name: rust-binaries
          path: |
            target/release/semiont-gateway
            target/release/semiont-dispatcher
            target/release/semiont-archivist
            target/release/semiont-wire-driver
            target/release/semiont-live-driver
            target/release/semiont-worker-driver
          # Long enough for a job re-run to find them; storage is free here.
          retention-days: 30
          if-no-files-found: error

  # The gateway, on the binaries build-rust built, answers a protected route
  # with 401 and the JSON error shape, and leaks nothing in the answer.
  gateway-security:
    name: Gateway Security Tests
    runs-on: ubuntu-latest
    needs: [census, changes, generated-artifacts, build-rust]
    if: needs.changes.outputs.rust == 'true'

    steps:
      - name: Checkout code
        uses: actions/checkout@v7.0.1

      # Built once by build-rust. An artifact keeps no file modes.
      - name: Fetch the Rust binaries
        uses: actions/download-artifact@v8
        with:
          name: rust-binaries
          path: target/release

      - name: Make the binaries executable
        run: chmod +x target/release/semiont-*

      - name: Write the gateway's configuration document
        run: |
          # The gateway's configuration document (GatewayConfig in specs/),
          # written the way the launcher writes it: resolved, and carrying the
          # knowledge base's identity. The gateway refuses to boot without a
          # valid one.
          printf '%s\n' \
            '{' \
            '  "kb": { "name": "test-project", "domain": "localhost" },' \
            '  "port": 4000,' \
            '  "publicUrl": "http://localhost:4000",' \
            '  "identity": { "issuer": "http://localhost:8080/realms/semiont", "subjectClaim": "sub" },' \
            '  "archivist": { "host": "localhost", "port": 24103 },' \
            '  "signal": { "type": "in-process" },' \
            '  "logLevel": "info",' \
            '  "logFormat": "json",' \
            '  "capacity": { "queuedBytes": 1073741824, "connections": 52428 }' \
            '}' \
            > "$RUNNER_TEMP/gateway.json"

      - name: Start the gateway
        run: |
          # The gateway's own service account; boot refuses without it. Nothing
          # here presents it to an issuer.
          export JWT_SECRET=test-secret-key-for-testing-32char
          export SEMIONT_OIDC_CLIENT_ID=semiont-gateway
          export SEMIONT_OIDC_CLIENT_SECRET=test-gateway-client-secret
          nohup target/release/semiont-gateway --config "$RUNNER_TEMP/gateway.json" > "$RUNNER_TEMP/gateway.log" 2>&1 &
          echo "GATEWAY_PID=$!" >> "$GITHUB_ENV"
          for i in $(seq 1 30); do
            if curl -fsS http://localhost:4000/api/health >/dev/null; then echo "The gateway is healthy"; exit 0; fi
            if ! kill -0 "$!" 2>/dev/null; then break; fi
            sleep 2
          done
          echo "The gateway did not become healthy. Its log:"
          cat "$RUNNER_TEMP/gateway.log"
          exit 1

      - name: Verify API security
        run: |
          echo "Testing gateway API security..."

          # Test 1: Verify protected endpoints require authentication
          endpoints=("/api/status" "/api/resources/does-not-exist")

          for endpoint in "${endpoints[@]}"; do
            echo "Testing $endpoint..."

            # Test without Authorization header
            status_code=$(curl -s -o /dev/null -w "%{http_code}" "http://localhost:4000$endpoint")
            if [ "$status_code" != "401" ]; then
              echo "❌ SECURITY FAILURE: $endpoint returned $status_code instead of 401 for missing auth"
              exit 1
            fi
            echo "✅ $endpoint properly returns 401 for missing authentication"

            # Test with invalid token
            status_code=$(curl -s -o /dev/null -w "%{http_code}" -H "Authorization: Bearer invalid-token" "http://localhost:4000$endpoint")
            if [ "$status_code" != "401" ]; then
              echo "❌ SECURITY FAILURE: $endpoint returned $status_code instead of 401 for invalid token"
              exit 1
            fi
            echo "✅ $endpoint properly returns 401 for invalid token"
          done

          # Test 2: Verify error responses don't leak sensitive data
          response=$(curl -s http://localhost:4000/api/status)
          if echo "$response" | grep -qE "secret|jwt.*key|password|stack.*trace|panicked at|\.rs:[0-9]+"; then
            echo "❌ SECURITY FAILURE: Sensitive data leaked in API error response!"
            echo "Response: $response"
            exit 1
          fi
          echo "✅ No sensitive data leaked in API error responses"

          # Test 3: Verify proper JSON error format
          if ! echo "$response" | grep -q '"error".*"Unauthorized"'; then
            echo "❌ SECURITY FAILURE: API doesn't return proper JSON error format"
            exit 1
          fi
          echo "✅ Proper JSON error format returned"

          echo "🎉 All gateway API security checks passed!"

      - name: Stop the gateway
        if: always()
        run: |
          if [ -n "$GATEWAY_PID" ]; then kill "$GATEWAY_PID" || true; fi

  gateway-conformance:
    name: Gateway Conformance
    runs-on: ubuntu-latest
    needs: [census, changes, generated-artifacts, build-rust]
    if: needs.changes.outputs.rust == 'true' || needs.changes.outputs.ts == 'true' || needs.changes.outputs.conformance == 'true'

    steps:
      - name: Checkout code
        uses: actions/checkout@v7.0.1

      # Built once by build-rust. An artifact keeps no file modes.
      - name: Fetch the Rust binaries
        uses: actions/download-artifact@v8
        with:
          name: rust-binaries
          path: target/release

      - name: Make the binaries executable
        run: chmod +x target/release/semiont-*

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: 'npm'
          cache-dependency-path: |
            package-lock.json
            tests/conformance/package-lock.json

      # The suite imports @semiont/core — its test issuer, and the job stream's
      # subjects — and bundles the spec with the root's redocly. Core is the one
      # package it builds.
      - name: Install dependencies
        run: |
          npm ci --include=optional
          npm run build --workspace=@semiont/core

      # The suite runs every case on the NATS plane too, against a real broker
      # with JetStream, and spawns it from PATH.
      - name: Install nats-server
        run: scripts/ci/install-nats-server.sh

      # Black-box: it starts gateway processes and checks them against specs/.
      - name: Run the gateway conformance suite
        run: |
          cd tests/conformance
          npm ci
          npm run test:gateway
        env:
          CI: true

  dispatcher-conformance:
    name: Dispatcher Conformance
    runs-on: ubuntu-latest
    needs: [census, changes, generated-artifacts, build-rust]
    if: needs.changes.outputs.rust == 'true' || needs.changes.outputs.ts == 'true' || needs.changes.outputs.conformance == 'true'

    steps:
      - name: Checkout code
        uses: actions/checkout@v7.0.1

      # Built once by build-rust. An artifact keeps no file modes.
      - name: Fetch the Rust binaries
        uses: actions/download-artifact@v8
        with:
          name: rust-binaries
          path: target/release

      - name: Make the binaries executable
        run: chmod +x target/release/semiont-*

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: 'npm'
          cache-dependency-path: |
            package-lock.json
            tests/conformance/package-lock.json

      # The suite imports @semiont/core — its test issuer — and bundles the
      # spec with the root's redocly. Core is the one package it builds.
      - name: Install dependencies
        run: |
          npm ci --include=optional
          npm run build --workspace=@semiont/core

      # The dispatcher's queue is JetStream, on a real broker spawned from PATH.
      - name: Install nats-server
        run: scripts/ci/install-nats-server.sh

      # Black-box: it starts dispatcher processes behind a gateway and meets
      # them only on the bus and their health port.
      - name: Run the dispatcher conformance suite
        run: |
          cd tests/conformance
          npm ci
          npm run test:dispatcher
        env:
          CI: true

  archivist-conformance:
    name: Archivist Conformance
    runs-on: ubuntu-latest
    needs: [census, changes, generated-artifacts, build-rust]
    if: needs.changes.outputs.rust == 'true' || needs.changes.outputs.ts == 'true' || needs.changes.outputs.conformance == 'true'

    steps:
      - name: Checkout code
        uses: actions/checkout@v7.0.1

      # Built once by build-rust. An artifact keeps no file modes.
      - name: Fetch the Rust binaries
        uses: actions/download-artifact@v8
        with:
          name: rust-binaries
          path: target/release

      - name: Make the binaries executable
        run: chmod +x target/release/semiont-*

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: 'npm'
          cache-dependency-path: |
            package-lock.json
            tests/conformance/package-lock.json

      # The suite imports @semiont/core — its test issuer — and bundles the
      # spec with the root's redocly. Core is the one package it builds.
      - name: Install dependencies
        run: |
          npm ci --include=optional
          npm run build --workspace=@semiont/core

      # The harness's global setup refuses to run without a broker on PATH.
      - name: Install nats-server
        run: scripts/ci/install-nats-server.sh

      # Black-box: it starts Archivist processes behind a gateway and meets
      # them on the bus, at their HTTP surface and in the files they keep.
      - name: Run the Archivist conformance suite
        run: |
          cd tests/conformance
          npm ci
          npm run test:archivist
        env:
          CI: true

  sdk-conformance:
    name: SDK Conformance
    runs-on: ubuntu-latest
    needs: [census, changes, generated-artifacts, build-rust]
    if: needs.changes.outputs.rust == 'true' || needs.changes.outputs.ts == 'true' || needs.changes.outputs.conformance == 'true' || needs.changes.outputs.python-sdk == 'true' || needs.changes.outputs.go == 'true'

    steps:
      - name: Checkout code
        uses: actions/checkout@v7.0.1

      # Built once by build-rust. An artifact keeps no file modes.
      - name: Fetch the Rust binaries
        uses: actions/download-artifact@v8
        with:
          name: rust-binaries
          path: target/release

      - name: Make the binaries executable
        run: chmod +x target/release/semiont-*

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: 'npm'
          cache-dependency-path: |
            package-lock.json
            tests/conformance/package-lock.json

      # The TypeScript drivers run the built SDK, as an application would;
      # building it builds the packages under it first.
      - name: Install dependencies
        run: |
          npm ci --include=optional
          npm run build --workspace=@semiont/sdk

      # Every case runs on the NATS plane too, against a real broker spawned
      # from PATH.
      - name: Install nats-server
        run: scripts/ci/install-nats-server.sh

      # The Python driver runs the SDK from its locked environment, which the
      # suite's setup makes with uv.
      - name: Setup Python
        uses: actions/setup-python@v7.1.0
        with:
          python-version: '3.12'

      - name: Setup uv
        uses: astral-sh/setup-uv@v10.3.2

      # The Go drivers are static binaries, built from their own module so
      # that what only a driver takes reaches nothing else.
      - name: Setup Go
        uses: actions/setup-go@v7.0.0
        with:
          go-version-file: packages/go/sdk/conformance/go.mod
          cache: false

      - name: Build the Go drivers
        run: cd packages/go/sdk/conformance && CGO_ENABLED=0 go build -o bin/ ./cmd/...

      # Each SDK's drivers, put through the corpus against the gateway; the
      # suite type-checks the TypeScript drivers and makes the Python SDK's
      # environment before it starts.
      - name: Run the SDK conformance suite
        run: |
          cd tests/conformance
          npm ci
          npm run test:sdk
        env:
          CI: true

  # A worker written on an SDK, held to docs/protocol/WORKER-CONTRACT.md: a
  # real gateway, with the suite playing the dispatcher.
  worker-conformance:
    name: Worker Conformance
    runs-on: ubuntu-latest
    needs: [census, changes, generated-artifacts, build-rust]
    if: needs.changes.outputs.rust == 'true' || needs.changes.outputs.ts == 'true' || needs.changes.outputs.conformance == 'true' || needs.changes.outputs.python-sdk == 'true' || needs.changes.outputs.go == 'true'

    steps:
      - name: Checkout code
        uses: actions/checkout@v7.0.1

      # Built once by build-rust. An artifact keeps no file modes.
      - name: Fetch the Rust binaries
        uses: actions/download-artifact@v8
        with:
          name: rust-binaries
          path: target/release

      - name: Make the binaries executable
        run: chmod +x target/release/semiont-*

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: 'npm'
          cache-dependency-path: |
            package-lock.json
            tests/conformance/package-lock.json

      # The TypeScript worker driver runs the built SDK over the built
      # transport, as a worker's author would.
      - name: Install dependencies
        run: |
          npm ci --include=optional
          npm run build:packages

      # Every case runs on the NATS plane too, against a real broker spawned
      # from PATH.
      - name: Install nats-server
        run: scripts/ci/install-nats-server.sh

      # The Python driver runs the SDK from its locked environment, which the
      # suite's setup makes with uv.
      - name: Setup Python
        uses: actions/setup-python@v7.1.0
        with:
          python-version: '3.12'

      - name: Setup uv
        uses: astral-sh/setup-uv@v10.3.2

      # The Go worker driver is a static binary, built from the drivers' own
      # module, as the SDK suite's are.
      - name: Setup Go
        uses: actions/setup-go@v7.0.0
        with:
          go-version-file: packages/go/sdk/conformance/go.mod
          cache: false

      - name: Build the Go drivers
        run: cd packages/go/sdk/conformance && CGO_ENABLED=0 go build -o bin/ ./cmd/...

      # Each SDK's worker driver, put through the corpus against the gateway;
      # the suite type-checks the TypeScript driver and makes the Python SDK's
      # environment before it starts.
      - name: Run the worker conformance suite
        run: |
          cd tests/conformance
          npm ci
          npm run test:worker
        env:
          CI: true

  # The Weaver, held to docs/protocol/WEAVER.md: the process a weaver image
  # runs, behind a real gateway and a real Archivist, writing a real neo4j,
  # which the suite reads back.
  weaver-conformance:
    name: Weaver Conformance
    runs-on: ubuntu-latest
    needs: [census, changes, generated-artifacts, build-rust]
    if: needs.changes.outputs.rust == 'true' || needs.changes.outputs.ts == 'true' || needs.changes.outputs.conformance == 'true' || needs.changes.outputs.weaver == 'true' || needs.changes.outputs.python-graph == 'true' || needs.changes.outputs.python-service == 'true' || needs.changes.outputs.python-sdk == 'true'
    env:
      # Where the suite finds its graph database, and the password it is
      # started with below: a container this job makes, and the suite clears.
      NEO4J_HOST: localhost
      NEO4J_PASSWORD: weaver-conformance-ci

    steps:
      - name: Checkout code
        uses: actions/checkout@v7.0.1

      # Built once by build-rust. An artifact keeps no file modes.
      - name: Fetch the Rust binaries
        uses: actions/download-artifact@v8
        with:
          name: rust-binaries
          path: target/release

      - name: Make the binaries executable
        run: chmod +x target/release/semiont-*

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: 'npm'
          cache-dependency-path: |
            package-lock.json
            tests/conformance/package-lock.json

      # The suite's harness is typed by the built @semiont/core.
      - name: Install dependencies
        run: |
          npm ci --include=optional
          npm run build --workspace=@semiont/core

      # The harness's global setup refuses to run without a broker on PATH.
      - name: Install nats-server
        run: scripts/ci/install-nats-server.sh

      # The neo4j the launcher starts for an operator, whose image
      # scripts/ci/neo4j-image.sh reads from the launcher's own descriptor.
      - name: Start neo4j
        run: |
          image=$(scripts/ci/neo4j-image.sh)
          docker run -d --name neo4j -p 7687:7687 -e NEO4J_AUTH="neo4j/${NEO4J_PASSWORD}" "$image"
          for attempt in $(seq 1 60); do
            if docker exec neo4j cypher-shell -u neo4j -p "$NEO4J_PASSWORD" 'RETURN 1' > /dev/null 2>&1; then
              exit 0
            fi
            sleep 2
          done
          docker logs neo4j
          echo "neo4j did not answer within two minutes"
          exit 1

      # The suite starts the Python Weaver by the interpreter of its project's
      # locked environment (harness/paths.ts): the environment its image has, on
      # the Python the SDK's floor names, without the development group, with
      # every database's client.
      - name: Setup Python
        uses: actions/setup-python@v7.1.0
        with:
          python-version: '3.12'

      - name: Setup uv
        uses: astral-sh/setup-uv@v10.3.2

      - name: Make the Python Weaver's environment
        run: uv sync --locked --no-dev --all-extras --project images/weaver

      # Black-box: it starts Weaver processes behind a gateway and an
      # Archivist, records through the Archivist, and reads the graph.
      - name: Run the Weaver conformance suite
        run: |
          cd tests/conformance
          npm ci
          npm run test:weaver
        env:
          CI: true

  # The Smelter, held to docs/protocol/SMELTER.md: the process a smelter image
  # runs, behind a real gateway and a real Archivist, with the suite playing
  # its embedding provider, writing a real Qdrant, which the suite reads back.
  smelter-conformance:
    name: Smelter Conformance
    runs-on: ubuntu-latest
    needs: [census, changes, generated-artifacts, build-rust]
    if: needs.changes.outputs.rust == 'true' || needs.changes.outputs.ts == 'true' || needs.changes.outputs.conformance == 'true' || needs.changes.outputs.smelter == 'true' || needs.changes.outputs.python-vectors == 'true' || needs.changes.outputs.python-service == 'true' || needs.changes.outputs.python-sdk == 'true'
    env:
      # Where the suite finds its vector database: a container this job makes,
      # whose index the suite clears.
      QDRANT_HOST: localhost

    steps:
      - name: Checkout code
        uses: actions/checkout@v7.0.1

      # Built once by build-rust. An artifact keeps no file modes.
      - name: Fetch the Rust binaries
        uses: actions/download-artifact@v8
        with:
          name: rust-binaries
          path: target/release

      - name: Make the binaries executable
        run: chmod +x target/release/semiont-*

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: 'npm'
          cache-dependency-path: |
            package-lock.json
            tests/conformance/package-lock.json

      # The suite's harness is typed by the built @semiont/core.
      - name: Install dependencies
        run: |
          npm ci --include=optional
          npm run build --workspace=@semiont/core

      # The harness's global setup refuses to run without a broker on PATH.
      - name: Install nats-server
        run: scripts/ci/install-nats-server.sh

      # The Qdrant the launcher starts for an operator, whose image
      # scripts/ci/qdrant-image.sh reads from the launcher's own descriptor.
      # It is asked what the launcher asks it, to know it is ready.
      - name: Start Qdrant
        run: |
          image=$(scripts/ci/qdrant-image.sh)
          docker run -d --name qdrant -p 6333:6333 "$image"
          for attempt in $(seq 1 60); do
            if curl -fsS "http://${QDRANT_HOST}:6333/readyz" > /dev/null 2>&1; then
              exit 0
            fi
            sleep 2
          done
          docker logs qdrant
          echo "Qdrant did not answer within two minutes"
          exit 1

      # The suite starts the Smelter by the interpreter of its project's locked
      # environment (harness/paths.ts): the environment its image has, on the
      # Python the SDK's floor names, without the development group. It reads a
      # scanned page with the `tesseract` program, as its image does.
      - name: Setup Python
        uses: actions/setup-python@v7.1.0
        with:
          python-version: '3.12'

      - name: Setup uv
        uses: astral-sh/setup-uv@v10.3.2

      - name: Install the tesseract program
        run: |
          sudo apt-get update
          sudo apt-get install -y tesseract-ocr
          tesseract --version

      - name: Make the Smelter's environment
        run: uv sync --locked --no-dev --project images/smelter

      # Black-box: it starts Smelter processes behind a gateway and an
      # Archivist, records through the Archivist, and reads the index.
      - name: Run the Smelter conformance suite
        run: |
          cd tests/conformance
          npm ci
          npm run test:smelter
        env:
          CI: true

  # The Librarian, held to docs/protocol/LIBRARIAN.md: the process a librarian
  # image runs, behind a real gateway, beside a real Archivist, a Weaver and a
  # Smelter, which write the neo4j and the Qdrant it reads, with the suite
  # playing its two models and its embedding provider.
  librarian-conformance:
    name: Librarian Conformance
    runs-on: ubuntu-latest
    needs: [census, changes, generated-artifacts, build-rust]
    if: needs.changes.outputs.rust == 'true' || needs.changes.outputs.ts == 'true' || needs.changes.outputs.conformance == 'true' || needs.changes.outputs.librarian == 'true' || needs.changes.outputs.weaver == 'true' || needs.changes.outputs.smelter == 'true' || needs.changes.outputs.python-graph == 'true' || needs.changes.outputs.python-vectors == 'true' || needs.changes.outputs.python-inference == 'true' || needs.changes.outputs.python-service == 'true' || needs.changes.outputs.python-sdk == 'true'
    env:
      # Where the suite finds its graph database, with the password it is
      # started with below, and its vector database: containers this job
      # makes, and the suite clears.
      NEO4J_HOST: localhost
      NEO4J_PASSWORD: librarian-conformance-ci
      QDRANT_HOST: localhost

    steps:
      - name: Checkout code
        uses: actions/checkout@v7.0.1

      # Built once by build-rust. An artifact keeps no file modes.
      - name: Fetch the Rust binaries
        uses: actions/download-artifact@v8
        with:
          name: rust-binaries
          path: target/release

      - name: Make the binaries executable
        run: chmod +x target/release/semiont-*

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: 'npm'
          cache-dependency-path: |
            package-lock.json
            tests/conformance/package-lock.json

      # The suite's harness is typed by the built @semiont/core.
      - name: Install dependencies
        run: |
          npm ci --include=optional
          npm run build --workspace=@semiont/core

      # The harness's global setup refuses to run without a broker on PATH.
      - name: Install nats-server
        run: scripts/ci/install-nats-server.sh

      # The neo4j the launcher starts for an operator, whose image
      # scripts/ci/neo4j-image.sh reads from the launcher's own descriptor.
      - name: Start neo4j
        run: |
          image=$(scripts/ci/neo4j-image.sh)
          docker run -d --name neo4j -p 7687:7687 -e NEO4J_AUTH="neo4j/${NEO4J_PASSWORD}" "$image"
          for attempt in $(seq 1 60); do
            if docker exec neo4j cypher-shell -u neo4j -p "$NEO4J_PASSWORD" 'RETURN 1' > /dev/null 2>&1; then
              exit 0
            fi
            sleep 2
          done
          docker logs neo4j
          echo "neo4j did not answer within two minutes"
          exit 1

      # The Qdrant the launcher starts for an operator, whose image
      # scripts/ci/qdrant-image.sh reads from the launcher's own descriptor.
      # It is asked what the launcher asks it, to know it is ready.
      - name: Start Qdrant
        run: |
          image=$(scripts/ci/qdrant-image.sh)
          docker run -d --name qdrant -p 6333:6333 "$image"
          for attempt in $(seq 1 60); do
            if curl -fsS "http://${QDRANT_HOST}:6333/readyz" > /dev/null 2>&1; then
              exit 0
            fi
            sleep 2
          done
          docker logs qdrant
          echo "Qdrant did not answer within two minutes"
          exit 1

      # The suite starts the Librarian, the Weaver and the Smelter by the
      # interpreters of their projects' locked environments
      # (harness/paths.ts): the environments their images have, on the Python
      # the SDK's floor names, without the development group. The Librarian
      # and the Weaver have every database's client, and the Librarian every
      # provider's library. The Smelter reads a scanned page with the
      # `tesseract` program, as its image does.
      - name: Setup Python
        uses: actions/setup-python@v7.1.0
        with:
          python-version: '3.12'

      - name: Setup uv
        uses: astral-sh/setup-uv@v10.3.2

      - name: Install the tesseract program
        run: |
          sudo apt-get update
          sudo apt-get install -y tesseract-ocr
          tesseract --version

      - name: Make the Python Weaver's environment
        run: uv sync --locked --no-dev --all-extras --project images/weaver

      - name: Make the Smelter's environment
        run: uv sync --locked --no-dev --project images/smelter

      - name: Make the Librarian's environment
        run: uv sync --locked --no-dev --all-extras --project images/librarian

      # Black-box: it starts Librarian processes behind a gateway, beside an
      # Archivist, a Weaver and a Smelter, records through the Archivist, asks
      # the Librarian on the bus, and receives the telemetry it exports.
      - name: Run the Librarian conformance suite
        run: |
          cd tests/conformance
          npm ci
          npm run test:librarian
        env:
          CI: true

  # The Worker service, held to docs/protocol/WORKER-SERVICE.md: the process a
  # worker image runs, behind a real gateway, with the suite playing the
  # dispatcher, the record, the Smelter and its provider.
  worker-service-conformance:
    name: Worker Service Conformance
    runs-on: ubuntu-latest
    needs: [census, changes, generated-artifacts, build-rust]
    if: needs.changes.outputs.rust == 'true' || needs.changes.outputs.ts == 'true' || needs.changes.outputs.conformance == 'true' || needs.changes.outputs.worker == 'true' || needs.changes.outputs.python-inference == 'true' || needs.changes.outputs.python-service == 'true' || needs.changes.outputs.python-sdk == 'true'

    steps:
      - name: Checkout code
        uses: actions/checkout@v7.0.1

      # Built once by build-rust. An artifact keeps no file modes.
      - name: Fetch the Rust binaries
        uses: actions/download-artifact@v8
        with:
          name: rust-binaries
          path: target/release

      - name: Make the binaries executable
        run: chmod +x target/release/semiont-*

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: 'npm'
          cache-dependency-path: |
            package-lock.json
            tests/conformance/package-lock.json

      # The suite imports @semiont/core — its test issuer — and bundles the
      # spec with the root's redocly. Core is the one package it builds.
      - name: Install dependencies
        run: |
          npm ci --include=optional
          npm run build --workspace=@semiont/core

      # The suite starts the Python Worker service by the interpreter of its
      # project's locked environment, made as the worker image makes it: on the
      # Python the SDK's floor names, without the development group, with every
      # provider's library.
      - name: Setup Python
        uses: actions/setup-python@v7.1.0
        with:
          python-version: '3.12'

      - name: Setup uv
        uses: astral-sh/setup-uv@v10.3.2

      - name: Make the Python Worker service's environment
        run: uv sync --locked --no-dev --all-extras --project images/worker

      # The suite's setup looks for a broker on PATH, as every suite's does.
      - name: Install nats-server
        run: scripts/ci/install-nats-server.sh

      - name: Run the worker-service conformance suite
        run: |
          cd tests/conformance
          npm ci
          npm run test:worker-service
        env:
          CI: true

  # The Python SDK: both type checkers, strict, on the oldest Python it
  # supports, where a newer one would let through what that one refuses; its
  # tests on every Python it supports. tests/refusals is checked with the rest:
  # a program there that starts to type-check fails the checker that let it.
  test-sdk-python:
    name: Python SDK
    runs-on: ubuntu-latest
    needs: [census, changes, generated-artifacts]
    if: needs.changes.outputs.python-sdk == 'true'
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.12', '3.13', '3.14']

    defaults:
      run:
        working-directory: packages/sdk-python

    steps:
      - name: Checkout code
        uses: actions/checkout@v7.0.1

      - name: Setup Python
        uses: actions/setup-python@v7.1.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Setup uv
        uses: astral-sh/setup-uv@v10.3.2

      - name: Install the locked environment
        run: uv sync --locked

      - name: Type-check with mypy (strict)
        if: matrix.python-version == '3.12'
        run: uv run mypy

      # pyright runs on Node, which the runner has.
      - name: Type-check with pyright (strict)
        if: matrix.python-version == '3.12'
        run: uv run pyright

      # The sign-in store takes its lock one way on Windows and another
      # everywhere else: both checkers read the package as Windows does too.
      - name: Type-check as Windows
        if: matrix.python-version == '3.12'
        run: |
          uv run mypy --platform win32
          uv run pyright --pythonplatform Windows

      - name: Lint and check formatting
        if: matrix.python-version == '3.12'
        run: |
          uv run ruff check
          uv run ruff format --check

      - name: Run the tests
        run: uv run pytest

      # What publish-pypi.yml uploads, built and checked here on every change:
      # a release is not the first place a packaging break is seen.
      - name: Build the distributions and check them
        if: matrix.python-version == '3.12'
        run: ../../scripts/ci/build-python-sdk.sh

  # The sign-in store on Windows: the launcher keeps its sign-ins there too,
  # in another directory and under another lock (specs/src/sign-in-store).
  # These are the tests of what differs by system.
  test-sdk-python-windows:
    name: Python SDK (sign-in store, Windows)
    runs-on: windows-latest
    needs: [census, changes, generated-artifacts]
    if: needs.changes.outputs.python-sdk == 'true'

    defaults:
      run:
        working-directory: packages/sdk-python

    steps:
      - name: Checkout code
        uses: actions/checkout@v7.0.1

      - name: Setup Python
        uses: actions/setup-python@v7.1.0
        with:
          python-version: '3.12'

      - name: Setup uv
        uses: astral-sh/setup-uv@v10.3.2

      - name: Install the locked environment
        run: uv sync --locked

      - name: Test the sign-in store
        run: uv run pytest tests/test_sign_in_store.py tests/test_state_dir.py

  # The Python inference drivers, as the Python SDK is checked: both type
  # checkers, strict, on the oldest Python supported, and the tests on every
  # one. The locked environment has every provider's extra, so every driver is
  # read. The tests play each provider over HTTP on the runner, and reach no
  # real one.
  test-inference-python:
    name: Python Inference Drivers
    runs-on: ubuntu-latest
    needs: [census, changes, generated-artifacts]
    if: needs.changes.outputs.python-inference == 'true' || needs.changes.outputs.python-sdk == 'true'
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.12', '3.13', '3.14']

    defaults:
      run:
        working-directory: packages/inference-python

    steps:
      - name: Checkout code
        uses: actions/checkout@v7.0.1

      - name: Setup Python
        uses: actions/setup-python@v7.1.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Setup uv
        uses: astral-sh/setup-uv@v10.3.2

      - name: Install the locked environment
        run: uv sync --locked

      - name: Type-check with mypy (strict)
        if: matrix.python-version == '3.12'
        run: uv run mypy

      # pyright runs on Node, which the runner has.
      - name: Type-check with pyright (strict)
        if: matrix.python-version == '3.12'
        run: uv run pyright

      - name: Lint and check formatting
        if: matrix.python-version == '3.12'
        run: |
          uv run ruff check
          uv run ruff format --check

      - name: Run the tests
        run: uv run pytest

  # What every Python service is built on (packages/service-python), as the
  # Python SDK is checked: both type checkers, strict, on the oldest Python
  # supported, and the tests on every one. The locked environment takes the
  # SDK from this checkout. The tests read a configuration document, ask a
  # health endpoint, write a log and take a process's readings of itself; they
  # start no service.
  test-service-python:
    name: Python Service Package
    runs-on: ubuntu-latest
    needs: [census, changes, generated-artifacts]
    if: needs.changes.outputs.python-service == 'true' || needs.changes.outputs.python-sdk == 'true'
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.12', '3.13', '3.14']

    defaults:
      run:
        working-directory: packages/service-python

    steps:
      - name: Checkout code
        uses: actions/checkout@v7.0.1

      - name: Setup Python
        uses: actions/setup-python@v7.1.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Setup uv
        uses: astral-sh/setup-uv@v10.3.2

      - name: Install the locked environment
        run: uv sync --locked

      - name: Type-check with mypy (strict)
        if: matrix.python-version == '3.12'
        run: uv run mypy

      # pyright runs on Node, which the runner has.
      - name: Type-check with pyright (strict)
        if: matrix.python-version == '3.12'
        run: uv run pyright

      - name: Lint and check formatting
        if: matrix.python-version == '3.12'
        run: |
          uv run ruff check
          uv run ruff format --check

      - name: Run the tests
        run: uv run pytest

  # The Worker service's Python code (images/worker), as the Python SDK is
  # checked: both type checkers, strict, on the oldest Python supported, and
  # the tests on every one. The locked environment takes the SDK and the
  # inference drivers from this checkout. The tests run the case tables of
  # specs/ that state what the worker does; they start no service and reach
  # no provider.
  test-worker-python:
    name: Python Worker Service
    runs-on: ubuntu-latest
    needs: [census, changes, generated-artifacts]
    if: needs.changes.outputs.worker == 'true' || needs.changes.outputs.python-inference == 'true' || needs.changes.outputs.python-service == 'true' || needs.changes.outputs.python-sdk == 'true'
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.12', '3.13', '3.14']

    defaults:
      run:
        working-directory: images/worker

    steps:
      - name: Checkout code
        uses: actions/checkout@v7.0.1

      - name: Setup Python
        uses: actions/setup-python@v7.1.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Setup uv
        uses: astral-sh/setup-uv@v10.3.2

      - name: Install the locked environment
        run: uv sync --locked

      - name: Type-check with mypy (strict)
        if: matrix.python-version == '3.12'
        run: uv run mypy

      # pyright runs on Node, which the runner has.
      - name: Type-check with pyright (strict)
        if: matrix.python-version == '3.12'
        run: uv run pyright

      - name: Lint and check formatting
        if: matrix.python-version == '3.12'
        run: |
          uv run ruff check
          uv run ruff format --check

      # A generation to PDF runs the Typst compiler, and four tests run the
      # compiler itself. It is taken from the image the worker's Dockerfile
      # takes it from, so its version is stated once, there.
      - name: Put the worker image's typst on PATH
        run: |
          image=$(sed -n 's/^COPY --from=\(ghcr\.io\/typst\/typst:[^ ]*\) .*/\1/p' Dockerfile)
          test -n "$image"
          docker create --name typst "$image"
          mkdir -p "$RUNNER_TEMP/typst"
          docker cp typst:/bin/typst "$RUNNER_TEMP/typst/typst"
          docker rm typst
          "$RUNNER_TEMP/typst/typst" --version
          echo "$RUNNER_TEMP/typst" >> "$GITHUB_PATH"

      - name: Run the tests
        run: uv run pytest

  # The Python graph stores (packages/graph-python), as the Python SDK is
  # checked: both type checkers, strict, on the oldest Python supported, and
  # the tests on every one. The locked environment takes the SDK from this
  # checkout. These tests need no database: they run the codecs' case table of
  # specs/, the store contract against the in-memory store, and the two
  # Gremlin stores against fake clients.
  test-graph-python:
    name: Python Graph Stores
    runs-on: ubuntu-latest
    needs: [census, changes, generated-artifacts]
    if: needs.changes.outputs.python-graph == 'true' || needs.changes.outputs.python-sdk == 'true'
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.12', '3.13', '3.14']

    defaults:
      run:
        working-directory: packages/graph-python

    steps:
      - name: Checkout code
        uses: actions/checkout@v7.0.1

      - name: Setup Python
        uses: actions/setup-python@v7.1.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Setup uv
        uses: astral-sh/setup-uv@v10.3.2

      - name: Install the locked environment
        run: uv sync --locked

      - name: Type-check with mypy (strict)
        if: matrix.python-version == '3.12'
        run: uv run mypy

      # pyright runs on Node, which the runner has.
      - name: Type-check with pyright (strict)
        if: matrix.python-version == '3.12'
        run: uv run pyright

      - name: Lint and check formatting
        if: matrix.python-version == '3.12'
        run: |
          uv run ruff check
          uv run ruff format --check

      - name: Run the tests
        run: uv run pytest

  # The Python neo4j store against a real neo4j: the same store contract the
  # in-memory store is held to, asked of the database. It starts the neo4j the
  # launcher starts for an operator, whose image scripts/ci/neo4j-image.sh
  # reads from the launcher's own descriptor.
  test-graph-python-neo4j:
    name: Python Graph Stores (neo4j)
    runs-on: ubuntu-latest
    needs: [census, changes, generated-artifacts]
    if: needs.changes.outputs.python-graph == 'true' || needs.changes.outputs.python-sdk == 'true'
    env:
      # Where the run finds its database, and the password it was started
      # with below: a container this job makes and discards.
      NEO4J_HOST: localhost
      NEO4J_PASSWORD: graph-stores-ci

    steps:
      - name: Checkout code
        uses: actions/checkout@v7.0.1

      - name: Setup Python
        uses: actions/setup-python@v7.1.0
        with:
          python-version: '3.12'

      - name: Setup uv
        uses: astral-sh/setup-uv@v10.3.2

      - name: Install the locked environment
        working-directory: packages/graph-python
        run: uv sync --locked

      - name: Start neo4j
        run: |
          image=$(scripts/ci/neo4j-image.sh)
          docker run -d --name neo4j -p 7687:7687 -e NEO4J_AUTH="neo4j/${NEO4J_PASSWORD}" "$image"
          for attempt in $(seq 1 60); do
            if docker exec neo4j cypher-shell -u neo4j -p "$NEO4J_PASSWORD" 'RETURN 1' > /dev/null 2>&1; then
              exit 0
            fi
            sleep 2
          done
          docker logs neo4j
          echo "neo4j did not answer within two minutes"
          exit 1

      - name: Run the store contract against it
        working-directory: packages/graph-python
        run: uv run pytest tests/neo4j_live.py

  # The Python vector stores and embedding providers (packages/vectors-python),
  # as the Python SDK is checked: both type checkers, strict, on the oldest
  # Python supported, and the tests on every one. The locked environment takes
  # the SDK from this checkout. These tests need no server: they run the two
  # case tables of specs/ against the in-memory store, and each provider
  # against one the test plays over HTTP.
  test-vectors-python:
    name: Python Vector Stores
    runs-on: ubuntu-latest
    needs: [census, changes, generated-artifacts]
    if: needs.changes.outputs.python-vectors == 'true' || needs.changes.outputs.python-sdk == 'true'
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.12', '3.13', '3.14']

    defaults:
      run:
        working-directory: packages/vectors-python

    steps:
      - name: Checkout code
        uses: actions/checkout@v7.0.1

      - name: Setup Python
        uses: actions/setup-python@v7.1.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Setup uv
        uses: astral-sh/setup-uv@v10.3.2

      - name: Install the locked environment
        run: uv sync --locked

      - name: Type-check with mypy (strict)
        if: matrix.python-version == '3.12'
        run: uv run mypy

      # pyright runs on Node, which the runner has.
      - name: Type-check with pyright (strict)
        if: matrix.python-version == '3.12'
        run: uv run pyright

      - name: Lint and check formatting
        if: matrix.python-version == '3.12'
        run: |
          uv run ruff check
          uv run ruff format --check

      - name: Run the tests
        run: uv run pytest

  # The Python Qdrant store against a real Qdrant: the same store contract the
  # in-memory store is held to, asked of the database, and what the database
  # then holds of each point. It starts the Qdrant the launcher starts for an
  # operator, whose image scripts/ci/qdrant-image.sh reads from the launcher's
  # own descriptor, and asks it what the launcher asks it, to know it is ready.
  test-vectors-python-qdrant:
    name: Python Vector Stores (Qdrant)
    runs-on: ubuntu-latest
    needs: [census, changes, generated-artifacts]
    if: needs.changes.outputs.python-vectors == 'true' || needs.changes.outputs.python-sdk == 'true'
    env:
      # Where the run finds its Qdrant: a container this job makes and discards.
      QDRANT_HOST: localhost

    steps:
      - name: Checkout code
        uses: actions/checkout@v7.0.1

      - name: Setup Python
        uses: actions/setup-python@v7.1.0
        with:
          python-version: '3.12'

      - name: Setup uv
        uses: astral-sh/setup-uv@v10.3.2

      - name: Install the locked environment
        working-directory: packages/vectors-python
        run: uv sync --locked

      - name: Start Qdrant
        run: |
          image=$(scripts/ci/qdrant-image.sh)
          docker run -d --name qdrant -p 6333:6333 "$image"
          for attempt in $(seq 1 60); do
            if curl -fsS "http://${QDRANT_HOST}:6333/readyz" > /dev/null 2>&1; then
              exit 0
            fi
            sleep 2
          done
          docker logs qdrant
          echo "Qdrant did not answer within two minutes"
          exit 1

      - name: Run the store contract against it
        working-directory: packages/vectors-python
        run: uv run pytest tests/qdrant_live.py

  # The Weaver's Python code (images/weaver), as the Python SDK is checked: both
  # type checkers, strict, on the oldest Python supported, and the tests on
  # every one. The locked environment takes the SDK and the graph stores from
  # this checkout. The tests run the fold's case table of specs/ and the
  # Weaver over a scripted transport and a graph in the process; they start no
  # service and reach no database. The process is held by Weaver Conformance.
  test-weaver-python:
    name: Python Weaver
    runs-on: ubuntu-latest
    needs: [census, changes, generated-artifacts]
    if: needs.changes.outputs.weaver == 'true' || needs.changes.outputs.python-graph == 'true' || needs.changes.outputs.python-service == 'true' || needs.changes.outputs.python-sdk == 'true'
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.12', '3.13', '3.14']

    defaults:
      run:
        working-directory: images/weaver

    steps:
      - name: Checkout code
        uses: actions/checkout@v7.0.1

      - name: Setup Python
        uses: actions/setup-python@v7.1.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Setup uv
        uses: astral-sh/setup-uv@v10.3.2

      - name: Install the locked environment
        run: uv sync --locked

      - name: Type-check with mypy (strict)
        if: matrix.python-version == '3.12'
        run: uv run mypy

      # pyright runs on Node, which the runner has.
      - name: Type-check with pyright (strict)
        if: matrix.python-version == '3.12'
        run: uv run pyright

      - name: Lint and check formatting
        if: matrix.python-version == '3.12'
        run: |
          uv run ruff check
          uv run ruff format --check

      - name: Run the tests
        run: uv run pytest

  # The Smelter's code (images/smelter), as the Python SDK is checked:
  # both type checkers, strict, on the oldest Python supported, and the tests
  # on every one. The locked environment takes the SDK from this checkout, and
  # PDFium from its binding's wheel. The tests read PDFs with the real PDFium
  # and scanned pages with the real `tesseract` program, which the runner's
  # own packages install with its English data: an image's Tesseract is
  # Alpine's, another build of the same engine, so no test rests on how sure
  # the engine was or on a box to the pixel. They start no service.
  test-smelter-python:
    name: Python Smelter
    runs-on: ubuntu-latest
    needs: [census, changes, generated-artifacts]
    if: needs.changes.outputs.smelter == 'true' || needs.changes.outputs.python-vectors == 'true' || needs.changes.outputs.python-service == 'true' || needs.changes.outputs.python-sdk == 'true'
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.12', '3.13', '3.14']

    defaults:
      run:
        working-directory: images/smelter

    steps:
      - name: Checkout code
        uses: actions/checkout@v7.0.1

      - name: Setup Python
        uses: actions/setup-python@v7.1.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Setup uv
        uses: astral-sh/setup-uv@v10.3.2

      - name: Install the tesseract program
        run: |
          sudo apt-get update
          sudo apt-get install -y tesseract-ocr
          tesseract --version

      - name: Install the locked environment
        run: uv sync --locked

      - name: Type-check with mypy (strict)
        if: matrix.python-version == '3.12'
        run: uv run mypy

      # pyright runs on Node, which the runner has.
      - name: Type-check with pyright (strict)
        if: matrix.python-version == '3.12'
        run: uv run pyright

      - name: Lint and check formatting
        if: matrix.python-version == '3.12'
        run: |
          uv run ruff check
          uv run ruff format --check

      - name: Run the tests
        run: uv run pytest

  # The Librarian's Python code (images/librarian), as the Python SDK is
  # checked: both type checkers, strict, on the oldest Python supported, and
  # the tests on every one. The locked environment takes the SDK, the graph
  # stores, the vector stores and the inference drivers from this checkout.
  # The tests run the Librarian's case tables of specs/ and its code over
  # fakes of everything it reads by; they start no service and reach no
  # database, no index and no model.
  test-librarian-python:
    name: Python Librarian
    runs-on: ubuntu-latest
    needs: [census, changes, generated-artifacts]
    if: needs.changes.outputs.librarian == 'true' || needs.changes.outputs.python-graph == 'true' || needs.changes.outputs.python-vectors == 'true' || needs.changes.outputs.python-inference == 'true' || needs.changes.outputs.python-service == 'true' || needs.changes.outputs.python-sdk == 'true'
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.12', '3.13', '3.14']

    defaults:
      run:
        working-directory: images/librarian

    steps:
      - name: Checkout code
        uses: actions/checkout@v7.0.1

      - name: Setup Python
        uses: actions/setup-python@v7.1.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Setup uv
        uses: astral-sh/setup-uv@v10.3.2

      - name: Install the locked environment
        run: uv sync --locked

      - name: Type-check with mypy (strict)
        if: matrix.python-version == '3.12'
        run: uv run mypy

      # pyright runs on Node, which the runner has.
      - name: Type-check with pyright (strict)
        if: matrix.python-version == '3.12'
        run: uv run pyright

      - name: Lint and check formatting
        if: matrix.python-version == '3.12'
        run: |
          uv run ruff check
          uv run ruff format --check

      - name: Run the tests
        run: uv run pytest

  check-phantom-deps:
    name: Phantom Dependency Check
    runs-on: ubuntu-latest
    needs: [census, changes, generated-artifacts]
    if: needs.changes.outputs.ts == 'true'

    steps:
      - name: Checkout code
        uses: actions/checkout@v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: 'npm'
          cache-dependency-path: 'package-lock.json'

      - name: Build packages
        run: |
          npm ci --include=optional
          npm run build:packages

      - name: Verify every published dist import is declared
        run: node scripts/ci/check-dist-imports.mjs

  build-all:
    name: Build All Applications
    runs-on: ubuntu-latest
    needs: [census, changes, generated-artifacts]
    if: needs.changes.outputs.ts == 'true'

    steps:
      - name: Checkout code
        uses: actions/checkout@v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: 'npm'
          cache-dependency-path: 'package-lock.json'

      - name: Install dependencies
        run: |
          npm ci --include=optional
          npm run build:packages

      - name: Build all applications
        run: |
          # Build all workspaces
          npm run build
          echo "All applications built successfully"
        env:
          CI: true
          NODE_OPTIONS: "--max-old-space-size=4096"
          # Gateway environment variables for build
          JWT_SECRET: test-secret-key-for-testing-32char

  # Generated code is committed (so consumers and CI never need the
  # generators), which means it can go stale the moment its authority changes.
  # scripts/ci/local-build.sh has these gates too, but in CI that script runs
  # only in Stack Smoke, which few PRs trigger — without this job, nothing
  # checks generated artifacts on a PR.
  generated-artifacts:
    name: Generated Artifacts (drift)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .node-version

      - name: Setup Go
        uses: actions/setup-go@v7.0.0
        with:
          go-version-file: apps/launcher/go.mod

      # Authority: specs/src/bus/registry.json → TypeScript (packages/core),
      # the gateway's channel classification (images/gateway/src), and Go
      # (packages/go/sdk/bus). Any of them drifting means two sides can disagree
      # about channels at runtime.
      - name: Bus registry vs generated code
        run: |
          node scripts/bus/generate-ts.mjs --check
          node scripts/bus/generate-go.mjs --check

      # Authority: specs/src → the Python SDK's committed modules
      # (packages/sdk-python/src/semiont): the bus vocabulary, the kinds of id,
      # the error codes, the client's timing, its refresh table, the telemetry
      # it exports, the clients it signs in as, the entry of the sign-in store,
      # the media types, and the Encoding Standard's labels and single-byte
      # encodings. TypeScript and Rust build theirs from the same files at build
      # time; Python has no build, so its are committed, and are what can go
      # stale.
      - name: Spec tables vs the Python SDK's generated modules
        run: |
          node scripts/bus/generate-python.mjs --check
          node scripts/spec/generate-identifiers-python.mjs --check
          node scripts/spec/generate-error-codes-python.mjs --check
          node scripts/spec/generate-client-timing-python.mjs --check
          node scripts/spec/generate-cache-refresh-python.mjs --check
          node scripts/spec/generate-sdk-telemetry-python.mjs --check
          node scripts/spec/generate-oauth-clients-python.mjs --check
          node scripts/spec/generate-sign-in-python.mjs --check
          node scripts/spec/generate-media-types-python.mjs --check
          node scripts/spec/generate-encodings-python.mjs --check

      # Authority: specs/src → the Go SDK's committed code (packages/go/sdk):
      # the kinds of id (api/ids_gen.go, whose generator also holds
      # oapi-codegen's exclude-schemas to the kinds), the error codes, the
      # client's timing, the cache-refresh table, the SDK telemetry table, the sign-in store's entry,
      # the OAuth clients and the sign-in scope, the media types
      # (mediatypes), and the Encoding Standard's labels and single-byte
      # encodings (encodings_gen.go). TypeScript and Rust build theirs from
      # the same files at build time; a Go module has no build step, so its
      # are committed, and are what can go stale. The bus vocabulary and the
      # REST client have steps of their own.
      - name: Spec tables vs the Go SDK's generated code
        run: |
          node scripts/spec/generate-identifiers-go.mjs --check
          node scripts/spec/generate-error-codes-go.mjs --check
          node scripts/spec/generate-client-timing-go.mjs --check
          node scripts/spec/generate-cache-refresh-go.mjs --check
          node scripts/spec/generate-sdk-telemetry-go.mjs --check
          node scripts/spec/generate-sign-in-go.mjs --check
          node scripts/spec/generate-oauth-clients-go.mjs --check
          node scripts/spec/generate-media-types-go.mjs --check
          node scripts/spec/generate-encodings-go.mjs --check

      # A knowledge base's documents (specs/src/stack, and the project file's
      # schema in specs/src/kb-identity) → the launcher's types for them and the
      # schema text it validates them against (apps/launcher/internal/stack).
      # lint:spec-stack, in the Census job, holds every property of the schemas
      # to a field of the generated types.
      - name: Knowledge base documents vs the launcher's generated Go
        run: node scripts/spec/generate-stack-go.mjs --check

      # `semiont mcp`'s tools (apps/launcher/internal/verbs/mcp-tools.json) and
      # the components they name → each tool's input and output schema, made
      # self-contained, and the SDK methods no tool calls
      # (apps/launcher/internal/verbs/mcp_tools_gen.go). TestMCPToolsCensus, in
      # the launcher's suite, holds the table to the client surface both ways.
      - name: MCP tools vs the launcher's generated Go
        run: node scripts/spec/generate-mcp-tools-go.mjs --check

      # specs/openapi.json is a BUILD ARTIFACT (gitignored) — redocly bundles
      # it from specs/src/. A fresh checkout has no such file, so the client
      # check has to produce it first. Version pinned to the repo's devDependency:
      # an unpinned bundler would make a deterministic gate nondeterministic.
      - name: Bundle the OpenAPI spec
        run: npx --yes @redocly/cli@2.34.0 bundle specs/src/openapi.json -o specs/openapi.json

      # Authority: specs/openapi.json → packages/go/sdk/api/client_gen.go.
      # Deterministic because the generator version is pinned.
      - name: OpenAPI spec vs generated Go client
        run: |
          go run github.com/oapi-codegen/oapi-codegen/v2/cmd/oapi-codegen@v2.6.0 \
            -config packages/go/sdk/oapi-codegen.yaml \
            -o /tmp/client_gen.check.go specs/openapi.json
          if ! diff -q /tmp/client_gen.check.go packages/go/sdk/api/client_gen.go; then
            echo "::error::packages/go/sdk/api/client_gen.go is stale — run: cd packages/go/sdk && go generate ./..."
            exit 1
          fi
          echo "sdk-go client matches the spec"

      # The drift check above is SELF-CONSISTENT: same command both sides, so
      # a generation command that drops schemas passes it forever. This is the
      # independent oracle — spec says N schemas, Go must have N.
      - name: Generated Go client covers every schema
        run: node scripts/ci/check-go-schema-coverage.mjs

      # Authority: specs/openapi.json → packages/sdk-python/src/semiont/types.py.
      # Deterministic because the generator and the formatter are pinned in the
      # package's lockfile, and run on the Python the package's floor names.
      # Its independent oracle is the package's own suite, which holds the
      # generated models to the spec's schemas and to the kinds of id.
      - name: Setup Python
        uses: actions/setup-python@v7.1.0
        with:
          python-version: '3.12'

      - name: Setup uv
        uses: astral-sh/setup-uv@v10.3.2

      - name: OpenAPI spec vs the Python SDK's generated models
        run: uv run --project packages/sdk-python --locked python packages/sdk-python/scripts/generate_models.py --check

      # Authority: the npm package @opencode-ai/models (the models.dev
      # catalogue), at the one version the root package.json pins → the model
      # catalogue file the Python inference package's tests read, and its
      # notice (packages/inference-python/tests/catalogue). The package carries
      # no copy: an image's build makes the file with the same script. This
      # one is the tests' fixture, real data at the pin, so the script, the
      # package's reader and the pin are held to each other. A bump of the pin
      # without `npm run generate:model-catalogue` fails here. This and the
      # next are the checks of this job that read an installed package, so
      # this one installs first: the root's own dependencies at the lockfile's
      # versions, without the workspaces' and without running any package's
      # scripts. They are the job's last steps, so that no other check runs
      # with a node_modules it did not have before.
      - name: models.dev catalogue vs the inference tests' catalogue file
        run: |
          npm ci --workspaces=false --ignore-scripts
          npm run generate:model-catalogue:check

      # Authority: the Encoding Standard, as two implementations of it have
      # it → specs/src/text/encoding-cases.json, the table every reader of a
      # resource's text runs: every label of the standard, and every byte of
      # each of its single-byte encodings. The labels are read from the npm
      # package @exodus/bytes at the one version the root package.json pins,
      # and the bytes from this job's Node, whose TextDecoder must take every
      # label as that package's table has it. The Rust SDK's tests then hold
      # the table to encoding_rs. A bump of the pin without
      # `npm run generate:encoding-cases` fails here when the table changes.
      - name: Encoding Standard vs the table of its labels and single-byte encodings
        run: npm run generate:encoding-cases:check

  # Everything about the launcher's module but its suite: formatting, vet on
  # every target a release ships, the Go SDK's own build and tests, and the
  # vulnerability scan. The suite is test-launcher's.
  check-launcher:
    name: Launcher Checks (Go)
    runs-on: ubuntu-latest
    needs: [census, changes, generated-artifacts]
    if: needs.changes.outputs.go == 'true'

    steps:
      - name: Checkout code
        uses: actions/checkout@v7.0.1

      - name: Setup Go
        uses: actions/setup-go@v7.0.0
        with:
          go-version-file: apps/launcher/go.mod

      # gofmt REPORTS on stdout and exits 0 even when files are unformatted —
      # `gofmt -l . && next` therefore never gates anything. The step fails on
      # any output instead.
      - name: Check formatting (gofmt)
        run: |
          unformatted=$(gofmt -l apps/launcher packages/go/sdk)
          if [ -n "$unformatted" ]; then
            echo "::error::These files are not gofmt-clean:"
            echo "$unformatted"
            exit 1
          fi
          echo "gofmt clean"

      - name: Vet launcher
        run: cd apps/launcher && go vet ./...

      # Every target a release ships. A call one system lacks compiles on
      # this job's Linux and on a developer's Mac; this is what finds it for
      # the others, arm64 Windows included, which no runner below runs. `vet`
      # compiles the tests too.
      - name: Launcher compiles for every target
        run: |
          cd apps/launcher
          for os in darwin linux windows; do
            for arch in amd64 arm64; do
              echo "::group::$os/$arch"
              GOOS=$os GOARCH=$arch go vet ./...
              echo "::endgroup::"
            done
          done

      # packages/go/sdk is a separate module (the generated API client + bus
      # registry the launcher consumes via a replace directive) — it needs its
      # own vet/build, or a broken generated file only surfaces downstream.
      # `go test` too: the bus client's wire-contract tests (subscribe before
      # emit, correlation, failure channels) and the bridged-set invariants
      # live here, and a build-only step never ran a single one of them.
      - name: Vet, build and test sdk-go
        run: cd packages/go/sdk && go vet ./... && go build ./... && go test -timeout 5m ./...

      # The SDK's conformance drivers are a module of their own.
      - name: Vet the Go SDK's drivers
        run: cd packages/go/sdk/conformance && go vet ./...

      # The launcher's deps are go.yaml.in/yaml and santhosh-tekuri/jsonschema
      # (the stack's documents and their schemas), golang.org/x/sys (the Windows build's
      # file lock, access lists and process calls), golang.org/x/term (hidden
      # input and the terminal's size), sigstore/sigstore-go (an image's build
      # provenance, checked before it runs, and what it pulls in: protobuf,
      # TUF, the Sigstore clients) and packages/go/sdk (whose client pulls
      # oapi-codegen/runtime, whose telemetry is the OpenTelemetry API, and
      # whose reader of a resource's text decodes the legacy multi-byte
      # charsets with golang.org/x/text),
      # plus the Go stdlib compiled into the shipped binary (distributed via
      # Homebrew and the release's archives).
      # govulncheck scans stdlib + deps and reports only vulns reachable from
      # our code. nats-server's module is a requirement of the tests alone (they
      # read the broker's config with its parser): it is in no shipped binary,
      # and it is not among the modules this scan covers. Nor is what only a
      # launcher built with -tags scenario links (Sigstore's test
      # authority, for the scenario suite): no release is built that way. The
      # scanner is pinned, so a new release of it changes this job only when
      # someone chooses it.
      - name: Vulnerability scan launcher (govulncheck)
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@v1.9.0
          cd apps/launcher && govulncheck ./...

  # The same suite, run as a Windows program. The job above proves the
  # launcher compiles for Windows; nothing but a Windows machine proves what
  # it does there: the access lists that stand in for file modes, the file
  # lock, where state lives, how a port's holder is found, and every scenario
  # the fake runtime drives.
  #
  # The checkout is byte-for-byte what Linux gets (.gitattributes), which the
  # goldens and fixtures are compared against.
  # The launcher's suite, split across three runners by test. Its tests drive
  # a fake runtime whose stand-ins bind the stack's real host ports, so they
  # cannot run side by side in one process; on runners of their own, each with
  # its own loopback, they can. Each leg lists the root package's tests in
  # source order (`go test -list`) and runs its third of them, a block in that
  # order, so each test follows the test it follows in a serial run: some
  # tests leave a stand-in listening that the next test sees, and taking every
  # third test instead failed a golden that a serial run passes. The first leg
  # also runs the module's other packages. A new test lands in a leg with
  # nothing to update, and a leg left with no test fails.
  #
  # An EXPLICIT budget. These tests drive a fake runtime through real
  # start/stop lifecycles, so each leg is minutes long and serial; the whole
  # suite once ran at 594-612s against Go's undeclared 600s default, and the
  # first batch of new tests to cross that line failed as a "timeout" with no
  # bad code anywhere. A budget you never declared is not a budget.
  test-launcher:
    name: Launcher Tests (Go, ${{ matrix.leg }} of ${{ strategy.job-total }})
    runs-on: ubuntu-latest
    needs: [census, changes, generated-artifacts]
    if: needs.changes.outputs.go == 'true'
    strategy:
      fail-fast: false
      matrix:
        leg: [1, 2, 3]
    defaults:
      run:
        working-directory: apps/launcher

    steps:
      - name: Checkout code
        uses: actions/checkout@v7.0.1

      - name: Setup Go
        uses: actions/setup-go@v7.0.0
        with:
          go-version-file: apps/launcher/go.mod
          cache-dependency-path: apps/launcher/go.sum

      - name: Choose this leg's tests
        id: tests
        run: |
          names=$(go test -list '.*' . | grep '^Test' | awk -v k=${{ strategy.job-index }} -v n=${{ strategy.job-total }} '{ t[NR] = $0 } END { for (i = int(k * NR / n) + 1; i <= int((k + 1) * NR / n); i++) print t[i] }' | paste -sd '|' -)
          if [ -z "$names" ]; then
            echo "::error::leg ${{ matrix.leg }} has no test: go test -list found fewer tests than there are legs"
            exit 1
          fi
          echo "$names" | tr '|' '\n' | wc -l | xargs echo "tests in this leg:"
          echo "run=^($names)\$" >> "$GITHUB_OUTPUT"

      - name: Test the launcher
        run: go test -timeout 30m -run '${{ steps.tests.outputs.run }}' .

      - name: Test the launcher's other packages
        if: strategy.job-index == 0
        run: go test -timeout 30m $(go list ./... | grep -vx "$(go list .)")

  test-launcher-windows:
    name: Launcher Tests (Go, Windows)
    runs-on: windows-latest
    needs: [census, changes, generated-artifacts]
    # At night and for a release: a break only Windows sees is found the next
    # morning, and a release cannot ship it.
    if: needs.changes.outputs.tier == 'full'
    # A ceiling, not an estimate: how long the suite takes on a Windows runner
    # is measured by its first runs. It starts a process per fake command,
    # which costs more there than on Linux.
    timeout-minutes: 60
    defaults:
      run:
        working-directory: apps/launcher

    steps:
      - name: Checkout code
        uses: actions/checkout@v7.0.1

      - name: Setup Go
        uses: actions/setup-go@v7.0.0
        with:
          go-version-file: apps/launcher/go.mod
          cache-dependency-path: apps/launcher/go.sum

      - name: Vet launcher
        run: go vet ./...

      # An explicit budget, as the Linux job has, under the job's ceiling.
      - name: Test launcher
        run: go test -timeout 50m ./...

      # The launcher's Windows binary carries this module's client and bus
      # registry.
      - name: Test sdk-go
        working-directory: packages/go/sdk
        run: go test -timeout 5m ./...

  # ── The gate ─────────────────────────────────────────────────────────
  # The one check the merge ruleset requires. It needs every job and runs
  # whatever they did: a job that failed or was cancelled fails it; one skipped
  # by a condition passes it, as GitHub reports a skipped job as Success.
  # `always()`, not `!cancelled()` as the audits next door use: a gate that is
  # skipped when a job is cancelled would itself report Success, and the
  # cancelled job's failure would never reach the ruleset. lint:workflows
  # holds the condition and its needs to the whole workflow.
  gate:
    name: CI Gate
    runs-on: ubuntu-latest
    if: always()
    needs:
      - census
      - changes
      - test-browser
      - test-package
      - browser-security
      - lighthouse-accessibility
      - compliance-check
      - test-gateway
      - build-rust
      - gateway-security
      - gateway-conformance
      - dispatcher-conformance
      - archivist-conformance
      - sdk-conformance
      - worker-conformance
      - weaver-conformance
      - smelter-conformance
      - librarian-conformance
      - worker-service-conformance
      - test-sdk-python
      - test-sdk-python-windows
      - test-inference-python
      - test-service-python
      - test-worker-python
      - test-graph-python
      - test-graph-python-neo4j
      - test-vectors-python
      - test-vectors-python-qdrant
      - test-weaver-python
      - test-smelter-python
      - test-librarian-python
      - check-phantom-deps
      - build-all
      - generated-artifacts
      - check-launcher
      - test-launcher
      - test-launcher-windows
    steps:
      - name: What each job did
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: echo "$NEEDS"

      - name: Fail when a job failed or was cancelled
        if: ${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') }}
        run: |
          echo "::error::A job failed or was cancelled; its name is above with result failure or cancelled"
          exit 1
