name: Continuous Integration

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]
  workflow_dispatch:

jobs:
  test-browser:
    name: Browser Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: 'package-lock.json'

      - name: Build packages
        run: |
          npm ci --include=optional
          npm run build:packages

      - name: Run browser type check
        run: |
          echo "Running browser TypeScript type check..."
          cd apps/browser
          npm run typecheck
        env:
          CI: true
          NODE_OPTIONS: "--max-old-space-size=4096"

      - name: Run browser tests
        run: |
          echo "Running browser unit tests..."
          cd apps/browser
          npm test
        env:
          CI: true
          NODE_OPTIONS: "--max-old-space-size=4096"

  test-gateway:
    name: Gateway Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7.0.1

      # rustup installs the toolchain rust-toolchain.toml names, with rustfmt
      # and clippy.
      - name: Install the pinned Rust toolchain
        run: |
          rustup toolchain install
          cargo --version

      # Its own key: this job builds the dev profile (clippy, tests) and
      # Gateway Conformance the release one. A cache key is saved once, by
      # whichever job finishes first, so a shared key left the other restoring
      # the wrong profile and compiling every crate, every run.
      - name: Cache cargo
        uses: actions/cache@v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-gateway-dev-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml') }}
          restore-keys: |
            ${{ runner.os }}-gateway-dev-

      # The gateway's behaviour is the Gateway Conformance job's; what runs
      # here is the code's own hygiene and the runners for the shared case
      # tables, its only Rust tests.
      - name: Format, lint, and run the shared-table runners
        run: |
          cargo fmt --all --check
          cargo clippy --workspace --all-targets --locked -- -D warnings
          cargo test --workspace --locked

      # The broker is reached only by a crate that asks for semiont-core's
      # `nats` feature: the SDK, its HTTP transport, observability,
      # semiont-core itself and the dispatcher's handlers carry no NATS client.
      - name: Check which crates can reach the broker
        run: |
          for crate in semiont semiont-http-transport semiont-observability semiont-core semiont-dispatcher-handlers; do
            if cargo tree --locked -p "$crate" -e normal | grep -q '^.*async-nats '; then
              echo "✗ $crate reaches async-nats; only a crate that enables semiont-core's nats feature may"
              exit 1
            fi
          done

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'

      # Every crate each service binary links, on each platform the images are
      # built for, is under a permitted licence and credited in its image's NOTICE.
      - name: Check the crates the service binaries link
        run: |
          for target in x86_64-unknown-linux-musl aarch64-unknown-linux-musl; do
            cargo metadata --format-version 1 --locked --filter-platform "$target" > "$RUNNER_TEMP/metadata-$target.json"
          done
          node scripts/lint/check-image-crates.mjs "$RUNNER_TEMP"/metadata-*.json

  gateway-conformance:
    name: Gateway Conformance
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7.0.1

      - name: Install the pinned Rust toolchain
        run: |
          rustup toolchain install

      # Its own key, for the release profile: see Gateway Tests.
      - name: Cache cargo
        uses: actions/cache@v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-gateway-release-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml') }}
          restore-keys: |
            ${{ runner.os }}-gateway-release-

      - name: Build the gateway
        run: cargo build --release --locked -p semiont-gateway

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: |
            package-lock.json
            tests/conformance/package-lock.json

      # The suite imports @semiont/core — its test issuer, and the job stream's
      # subjects — and bundles the spec with the root's redocly. Core is the one
      # package it builds.
      - name: Install dependencies
        run: |
          npm ci --include=optional
          npm run build --workspace=@semiont/core

      # The suite runs every case on the NATS plane too, against a real broker
      # with JetStream, and spawns it from PATH.
      - name: Install nats-server
        run: |
          NATS_VERSION=v2.14.0
          curl -sSL "https://github.com/nats-io/nats-server/releases/download/${NATS_VERSION}/nats-server-${NATS_VERSION}-linux-amd64.tar.gz" | tar xz
          sudo mv "nats-server-${NATS_VERSION}-linux-amd64/nats-server" /usr/local/bin/
          nats-server --version

      # Black-box: it starts gateway processes and checks them against specs/.
      - name: Run the gateway conformance suite
        run: |
          cd tests/conformance
          npm ci
          npm run test:gateway
        env:
          CI: true

  dispatcher-conformance:
    name: Dispatcher Conformance
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7.0.1

      - name: Install the pinned Rust toolchain
        run: |
          rustup toolchain install

      # The workspace's release build, shared with Gateway Conformance.
      - name: Cache cargo
        uses: actions/cache@v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-gateway-release-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml') }}
          restore-keys: |
            ${{ runner.os }}-gateway-release-

      # The dispatcher reaches the bus only through a gateway.
      - name: Build the dispatcher and the gateway
        run: cargo build --release --locked -p semiont-dispatcher -p semiont-gateway

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: |
            package-lock.json
            tests/conformance/package-lock.json

      # The suite imports @semiont/core — its test issuer — and bundles the
      # spec with the root's redocly. Core is the one package it builds.
      - name: Install dependencies
        run: |
          npm ci --include=optional
          npm run build --workspace=@semiont/core

      # The dispatcher's queue is JetStream, on a real broker spawned from PATH.
      - name: Install nats-server
        run: |
          NATS_VERSION=v2.14.0
          curl -sSL "https://github.com/nats-io/nats-server/releases/download/${NATS_VERSION}/nats-server-${NATS_VERSION}-linux-amd64.tar.gz" | tar xz
          sudo mv "nats-server-${NATS_VERSION}-linux-amd64/nats-server" /usr/local/bin/
          nats-server --version

      # Black-box: it starts dispatcher processes behind a gateway and meets
      # them only on the bus and their health port.
      - name: Run the dispatcher conformance suite
        run: |
          cd tests/conformance
          npm ci
          npm run test:dispatcher
        env:
          CI: true

  sdk-conformance:
    name: SDK Conformance
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7.0.1

      - name: Install the pinned Rust toolchain
        run: |
          rustup toolchain install

      # The workspace's release build, shared with Gateway Conformance.
      - name: Cache cargo
        uses: actions/cache@v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-gateway-release-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml') }}
          restore-keys: |
            ${{ runner.os }}-gateway-release-

      # Every SDK is held to a real gateway.
      - name: Build the gateway
        run: cargo build --release --locked -p semiont-gateway

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: |
            package-lock.json
            tests/conformance/package-lock.json

      # The TypeScript driver runs the built transport, as an application
      # would; building it builds the packages under it first.
      - name: Install dependencies
        run: |
          npm ci --include=optional
          npm run build --workspace=@semiont/http-transport

      # Every case runs on the NATS plane too, against a real broker spawned
      # from PATH.
      - name: Install nats-server
        run: |
          NATS_VERSION=v2.14.0
          curl -sSL "https://github.com/nats-io/nats-server/releases/download/${NATS_VERSION}/nats-server-${NATS_VERSION}-linux-amd64.tar.gz" | tar xz
          sudo mv "nats-server-${NATS_VERSION}-linux-amd64/nats-server" /usr/local/bin/
          nats-server --version

      # Each SDK's driver, put through the corpus against the gateway; the
      # suite type-checks the TypeScript driver before it starts.
      - name: Run the SDK conformance suite
        run: |
          cd tests/conformance
          npm ci
          npm run test:sdk
        env:
          CI: true

  test-comprehensive:
    name: Comprehensive Test Suite
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: 'package-lock.json'

      - name: Install dependencies
        run: |
          npm ci --include=optional
          npm run build:packages

      - name: Run comprehensive test suite
        run: |
          echo "Running comprehensive test suite..."
          # One subshell per suite: `bash -e` ignores non-final failures
          # inside a bare `&&` chain, but honors a subshell's exit status.
          (cd apps/browser && npm test)

          echo "All tests completed successfully"
        env:
          CI: true
          NODE_OPTIONS: "--max-old-space-size=4096"


  validate-config:
    name: Configuration Validation
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: 'package-lock.json'

      - name: Install dependencies
        run: |
          npm ci --include=optional
          npm run build:packages

  check-phantom-deps:
    name: Phantom Dependency Check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: 'package-lock.json'

      - name: Build packages
        run: |
          npm ci --include=optional
          npm run build:packages

      - name: Verify every published dist import is declared
        run: node scripts/ci/check-dist-imports.mjs

  build-all:
    name: Build All Applications
    runs-on: ubuntu-latest
    needs: [test-browser, test-gateway]

    steps:
      - name: Checkout code
        uses: actions/checkout@v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: 'package-lock.json'

      - name: Install dependencies
        run: |
          npm ci --include=optional
          npm run build:packages

      - name: Build all applications
        run: |
          # Build all workspaces
          npm run build
          echo "All applications built successfully"
        env:
          CI: true
          NODE_OPTIONS: "--max-old-space-size=4096"
          # Gateway environment variables for build
          JWT_SECRET: test-secret-key-for-testing-32char

  # Generated code is committed (so consumers and CI never need the
  # generators), which means it can go stale the moment its authority changes.
  # scripts/ci/local-build.sh has these gates too, but in CI that script runs
  # only in Stack Smoke, which few PRs trigger — without this job, nothing
  # checks generated artifacts on a PR.
  generated-artifacts:
    name: Generated Artifacts (drift)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'

      - name: Setup Go
        uses: actions/setup-go@v7.0.0
        with:
          go-version-file: apps/launcher/go.mod

      # Authority: specs/src/bus/registry.json → TypeScript (packages/core),
      # the gateway's channel classification (apps/gateway/src), and Go
      # (packages/sdk-go/bus). Any of them drifting means two sides can disagree
      # about channels at runtime.
      - name: Bus registry vs generated code
        run: |
          node scripts/bus/generate-ts.mjs --check
          node scripts/bus/generate-go.mjs --check

      # specs/openapi.json is a BUILD ARTIFACT (gitignored) — redocly bundles
      # it from specs/src/. A fresh checkout has no such file, so the client
      # check has to produce it first. Version pinned to the repo's devDependency:
      # an unpinned bundler would make a deterministic gate nondeterministic.
      - name: Bundle the OpenAPI spec
        run: npx --yes @redocly/cli@2.34.0 bundle specs/src/openapi.json -o specs/openapi.json

      # Authority: specs/openapi.json → packages/sdk-go/client_gen.go.
      # Deterministic because the generator version is pinned.
      - name: OpenAPI spec vs generated Go client
        run: |
          go run github.com/oapi-codegen/oapi-codegen/v2/cmd/oapi-codegen@v2.6.0 \
            -generate types,client,skip-prune -package semiont \
            -o /tmp/client_gen.check.go specs/openapi.json
          if ! diff -q /tmp/client_gen.check.go packages/sdk-go/client_gen.go; then
            echo "::error::packages/sdk-go/client_gen.go is stale — run: cd packages/sdk-go && go generate ./..."
            exit 1
          fi
          echo "sdk-go client matches the spec"

      # The drift check above is SELF-CONSISTENT: same command both sides, so
      # a generation command that drops schemas passes it forever. This is the
      # independent oracle — spec says N schemas, Go must have N. (It was the
      # absence of this check that let ~150 pruned schemas sit unnoticed.)
      - name: Generated Go client covers every schema
        run: node scripts/ci/check-go-schema-coverage.mjs

  test-launcher:
    name: Launcher Tests (Go)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7.0.1

      - name: Setup Go
        uses: actions/setup-go@v7.0.0
        with:
          go-version-file: apps/launcher/go.mod

      # gofmt REPORTS on stdout and exits 0 even when files are unformatted —
      # `gofmt -l . && next` therefore never gates anything. Test the output,
      # or drift lives for weeks (launcher_test.go did exactly that).
      - name: Check formatting (gofmt)
        run: |
          unformatted=$(gofmt -l apps/launcher packages/sdk-go)
          if [ -n "$unformatted" ]; then
            echo "::error::These files are not gofmt-clean:"
            echo "$unformatted"
            exit 1
          fi
          echo "gofmt clean"

      - name: Vet launcher
        run: cd apps/launcher && go vet ./...

      # An EXPLICIT budget. These tests drive a fake runtime through real
      # start/stop lifecycles, so the suite is minutes long and serial; it had
      # been running at 594-612s against Go's undeclared 600s default, and the
      # first batch of new tests to cross that line failed as a "timeout" with
      # no bad code anywhere. A budget you never declared is not a budget.
      - name: Test launcher
        run: cd apps/launcher && go test -timeout 30m ./...

      # packages/sdk-go is a separate module (the generated API client + bus
      # registry the launcher consumes via a replace directive) — it needs its
      # own vet/build, or a broken generated file only surfaces downstream.
      # `go test` too: the bus client's wire-contract tests (subscribe before
      # emit, correlation, failure channels) and the bridged-set invariants
      # live here, and a build-only step never ran a single one of them.
      - name: Vet, build and test sdk-go
        run: cd packages/sdk-go && go vet ./... && go build ./... && go test -timeout 5m ./...

      # The launcher's deps are go-toml and packages/sdk-go (whose client
      # pulls oapi-codegen/runtime), plus the Go stdlib compiled into the
      # shipped binary (distributed via Homebrew). govulncheck scans stdlib +
      # deps and reports only vulns reachable from our code.
      - name: Vulnerability scan launcher (govulncheck)
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          cd apps/launcher && govulncheck ./...
