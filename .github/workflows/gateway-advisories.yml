name: Gateway Crate Advisories

# The crates the Rust workspace links — the gateway's and the crates the
# services share — held to RustSec's advisory database, and to where they may
# come from and which versions they may be named by: cargo-deny's advisories,
# sources and bans checks, as deny.toml configures them. Their licences are the
# Gateway Tests job's (check-image-crates.mjs).
#
# It runs when what the workspace links changes, and daily: the database changes
# without a commit here, so an advisory published today fails tomorrow's run,
# on the default branch, where a scheduled run reports to whoever last changed
# the schedule.

on:
  pull_request:
    paths:
      - 'packages/rust/**/Cargo.toml'
      - 'images/**/Cargo.toml'
      - packages/rust/Cargo.lock
      - packages/rust/deny.toml
      - packages/rust/rust-toolchain.toml
      - .github/workflows/gateway-advisories.yml
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch:

# One run per pull request: a push cancels the run of the push before it, which
# nobody is waiting for. A push to main is never cancelled: it is the run that
# sees the merged tree. lint:workflows holds every pull-request workflow to this.
concurrency:
  group: gateway-advisories-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  deny:
    name: Gateway Crate Advisories
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: packages/rust
    steps:
      - name: Checkout code
        uses: actions/checkout@v7.0.1

      # rustup installs the toolchain rust-toolchain.toml names.
      - name: Install the pinned Rust toolchain
        run: |
          rustup toolchain install
          cargo --version

      # Keyed by this file, which pins cargo-deny's version, and by the
      # toolchain that compiles it.
      - name: Cache cargo-deny
        id: cache
        uses: actions/cache@v6.1.0
        with:
          path: ~/.cargo/bin/cargo-deny
          key: ${{ runner.os }}-cargo-deny-${{ hashFiles('.github/workflows/gateway-advisories.yml', 'packages/rust/rust-toolchain.toml') }}

      - name: Install cargo-deny
        if: steps.cache.outputs.cache-hit != 'true'
        run: cargo install cargo-deny --locked --version 0.20.2

      # -D advisory-not-detected: an ignore that matches nothing fails the
      # run, so none outlives the crate it was about.
      - name: Check advisories, bans and sources
        run: cargo deny --locked check -D advisory-not-detected advisories bans sources
