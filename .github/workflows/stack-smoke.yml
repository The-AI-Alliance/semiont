# Stack smoke: boot a real stack and assert the things the hermetic suite
# cannot. The check itself is scripts/release/smoke-stack.sh, which this
# workflow runs and a laptop runs the same way; what it asserts is said there,
# once.
#
# The LAUNCHER always comes from the commit this workflow runs on. The IMAGES
# come from one of two places:
#
#   - the same commit, by default: scripts/ci/local-build.sh builds the
#     packages, publishes them to a Verdaccio it starts on the runner, builds
#     every image against it into the runner's docker store as `:local`, and
#     builds the launcher. Nothing is pushed anywhere. A change that moves the
#     launcher and an image together is tested together, before either is
#     published;
#   - a published tag, when a run names one (`images`): the release's question,
#     whether the images people will pull boot with this launcher, asked before
#     `latest` moves to them (docs/contributor/RELEASE.md).
name: Stack Smoke

on:
  workflow_dispatch:
    inputs:
      images:
        description: "Published ghcr tag to boot (e.g. 0.6.5, or latest); empty builds every image from this commit"
        required: false
        default: ''
        type: string
  # Self-testing: a change to this workflow, its script, the build it runs or
  # what that build leaves out of an image's context proves it still boots a
  # stack. Deliberately NOT a gate on other work — the
  # fake covers per-PR regression, and this lane answers "does the model match
  # reality", which periodic verification suffices for. It is also the only way
  # to exercise a dispatch-only workflow before it reaches the default branch,
  # which GitHub requires before `gh workflow run` will find it.
  pull_request:
    paths:
      - .github/workflows/stack-smoke.yml
      - scripts/release/smoke-stack.sh
      - scripts/ci/local-build.sh
      - .dockerignore
  # Nightly, on main: the periodic verification above, at 08:17 UTC (4:17 in
  # the morning Eastern under daylight time, 3:17 under standard; off the hour,
  # when GitHub delays scheduled runs least). It is also what keeps main's cache
  # of the Rust images' layers: only a run on main writes it, every pull
  # request's self-test can read it, and GitHub evicts an entry a week unread.
  # A scheduled run that fails mails whoever last changed this line.
  schedule:
    - cron: '17 8 * * *'

# One run per pull request: a push cancels the run of the push before it, which
# nobody is waiting for. A push to main is never cancelled: it is the run that
# sees the merged tree. lint:workflows holds every pull-request workflow to this.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  boot:
    runs-on: ubuntu-latest
    # A ceiling, not an estimate of how long the build takes on a runner.
    timeout-minutes: 90
    env:
      # The image tag the smoke writes into the stack's documents: `local`, the
      # images built below from this commit, unless the run names a published
      # tag. smoke-stack.sh takes it as its argument.
      IMAGES: ${{ inputs.images || 'local' }}
    steps:
      - uses: actions/checkout@v7.0.1

      # The Rust images' builder stage is one cold release build of the
      # workspace for Alpine, twelve minutes of this job's nineteen, and the
      # three Rust images share it. Its layers are kept between runs, keyed on
      # everything the stage copies and the toolchain it builds with, so a push
      # that changes no Rust restores the compiled stage and compiles nothing.
      # On a miss the nearest older cache gives the base image and
      # cargo-auditable; the compile itself is cold, because cargo's target is
      # a mount a layer cache does not hold. The key names the Rust trees whole,
      # not *.rs: the stage copies a JSON table too, and the first draft of this
      # key missed it. lint:workflows holds every path the Dockerfiles copy to a
      # pattern of this key.
      - name: Restore the Rust images' layers
        if: env.IMAGES == 'local'
        uses: actions/cache@v6.1.0
        with:
          path: ${{ runner.temp }}/rust-image-layers
          key: ${{ runner.os }}-rust-image-layers-${{ hashFiles('rust-toolchain.toml', 'version.json', 'specs/src/**', 'Cargo.toml', 'Cargo.lock', 'apps/gateway/**', 'apps/dispatcher/**', 'apps/archivist/**', 'packages/*-rust/**', '.dockerignore') }}
          restore-keys: |
            ${{ runner.os }}-rust-image-layers-

      - name: Build the packages, images and launcher from this commit
        if: env.IMAGES == 'local'
        # The stack boots under docker, the engine that builds the images, so
        # they are not copied into the runner's podman as well.
        run: scripts/ci/local-build.sh --no-fanout --layer-cache "$RUNNER_TEMP/rust-image-layers"

      - uses: actions/setup-go@v7.0.0
        if: env.IMAGES != 'local'
        with:
          go-version-file: apps/launcher/go.mod

      - name: Build the launcher from this commit
        # Where the smoke script runs it from.
        if: env.IMAGES != 'local'
        run: cd apps/launcher && go build -o dist/semiont .

      - name: Boot a stack and check it
        # There is no Ollama on a runner, so the new KB's inference and
        # embedding start one as a container and pull their models — about
        # 1.8 GB of image plus two small models. That is the supported path,
        # and it exercises the host-probe → container-fallback branch and
        # ensureModels along with everything else.
        run: scripts/release/smoke-stack.sh "$IMAGES"
