name: Architecture Compliance

on:
  push:
    branches: [main, develop, 'feature/**']
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

jobs:
  compliance-check:
    name: React Hooks Architecture Review
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --include=optional

      - name: Build packages (doc-snippets gate checks docs against dist)
        id: build
        run: npm run build:packages

      # Every gate below is INDEPENDENT: each checks a different invariant, and a
      # failure in one says nothing about the others. They defaulted to
      # `if: success()`, so the first failure skipped the rest — which meant one
      # push per problem, and (because two of the skipped steps WRITE the
      # compliance reports) a `cat` further down failing on a file nobody was
      # going to produce.
      #
      # They all depend on the build, though: auditing docs against a `dist` that
      # was never emitted would report nonsense. So each runs when the BUILD
      # succeeded, regardless of its sibling gates. `!cancelled()` rather than
      # `always()` so a cancelled run stops promptly.

      - name: Run Doc Snippets Audit
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: |
          echo "::group::Doc Snippets Audit (sdk docs' code fences compile against dist through the exports map)"
          ./scripts/compliance/audit-doc-snippets.sh
          echo "::endgroup::"

      - name: Run Raw Bus Access Audit
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: |
          echo "::group::Raw Bus Access Audit (forbid client.emit/.on/.stream outside the SDK)"
          ./scripts/compliance/audit-raw-bus.sh
          echo "::endgroup::"

      - name: Run CSS Gates
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: |
          echo "::group::CSS Gates (stylelint + every var() resolves + no utility frameworks)"
          fail=0
          npm run lint:css || fail=1
          npm run lint:css-variables || fail=1
          npm run lint:css-classes || fail=1
          npm run lint:translations || fail=1
          npm run lint:no-utility-classes || fail=1
          echo "::endgroup::"
          exit $fail

      - name: Run StateUnit Compliance Audit
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: |
          echo "::group::StateUnit Compliance Audit (A1-static no-class / X3-static no-module-state / X5 fire-and-forget)"
          fail=0
          ./scripts/compliance/audit-state-unit-no-class.sh || fail=1
          ./scripts/compliance/audit-state-unit-module-state.sh || fail=1
          ./scripts/compliance/audit-fire-and-forget-promise-void.sh || fail=1
          echo "::endgroup::"
          exit $fail

      - name: Run React-UI Compliance Audit
        id: react-ui-audit
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: |
          echo "::group::React-UI Compliance Audit"
          cd packages/react-ui
          ./scripts/generate-compliance-report.sh
          echo "::endgroup::"

          # Capture report summary
          echo "::group::React-UI Summary"
          head -n 20 ../../.compliance/REACT-UI-COMPLIANCE.md
          echo "::endgroup::"

          # Check for violations
          if grep -q "Failing (❌): [1-9]" ../../.compliance/REACT-UI-COMPLIANCE.md; then
            echo "react_ui_violations=true" >> $GITHUB_OUTPUT
            echo "::error::React-UI has architecture violations"
          else
            echo "react_ui_violations=false" >> $GITHUB_OUTPUT
            echo "::notice::React-UI is compliant"
          fi

      - name: Run Browser Compliance Audit
        id: browser-audit
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: |
          echo "::group::Browser Compliance Audit"
          cd apps/browser
          ./scripts/generate-compliance-report.sh
          echo "::endgroup::"

          # Capture report summary
          echo "::group::Browser Summary"
          head -n 20 ../../.compliance/BROWSER-COMPLIANCE.md
          echo "::endgroup::"

          # Check for violations
          if grep -q "Failing (❌): [1-9]" ../../.compliance/BROWSER-COMPLIANCE.md; then
            echo "browser_violations=true" >> $GITHUB_OUTPUT
            echo "::error::Browser has architecture violations"
          else
            echo "browser_violations=false" >> $GITHUB_OUTPUT
            echo "::notice::Browser is compliant"
          fi

      - name: Display Full React-UI Report
        if: always()
        run: |
          echo "::group::Full React-UI Compliance Report"
          cat .compliance/REACT-UI-COMPLIANCE.md
          echo "::endgroup::"

      - name: Display Full Browser Report
        if: always()
        run: |
          echo "::group::Full Browser Compliance Report"
          cat .compliance/BROWSER-COMPLIANCE.md
          echo "::endgroup::"

      - name: Upload React-UI Compliance Report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: react-ui-compliance-report
          path: .compliance/REACT-UI-COMPLIANCE.md
          retention-days: 30

      - name: Upload Browser Compliance Report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: browser-compliance-report
          path: .compliance/BROWSER-COMPLIANCE.md
          retention-days: 30

      - name: Create Summary
        if: always()
        run: |
          echo "## Architecture Compliance Report" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          # React-UI Summary
          echo "### React-UI Package" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          grep -A 10 "^## Summary" .compliance/REACT-UI-COMPLIANCE.md >> $GITHUB_STEP_SUMMARY || echo "Report not generated" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          # Browser Summary
          echo "### Browser Application" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          grep -A 10 "^## Summary" .compliance/BROWSER-COMPLIANCE.md >> $GITHUB_STEP_SUMMARY || echo "Report not generated" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          # Overall Status
          echo "---" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          if [ "${{ steps.react-ui-audit.outputs.react_ui_violations }}" = "true" ] || [ "${{ steps.browser-audit.outputs.browser_violations }}" = "true" ]; then
            echo "❌ **FAILED**: Architecture violations detected" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "Please review the full reports above and fix all violations." >> $GITHUB_STEP_SUMMARY
          else
            echo "✅ **PASSED**: All workspaces are compliant" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "🎉 Zero architecture violations detected!" >> $GITHUB_STEP_SUMMARY
          fi

      - name: Fail on Violations
        if: steps.react-ui-audit.outputs.react_ui_violations == 'true' || steps.browser-audit.outputs.browser_violations == 'true'
        run: |
          echo "❌ Architecture compliance check failed"
          echo ""
          echo "Violations detected in:"
          if [ "${{ steps.react-ui-audit.outputs.react_ui_violations }}" = "true" ]; then
            echo "  - React-UI package"
          fi
          if [ "${{ steps.browser-audit.outputs.browser_violations }}" = "true" ]; then
            echo "  - Browser application"
          fi
          echo ""
          echo "See the full reports above for details on all violations."
          echo "Fix all violations before merging."
          exit 1
