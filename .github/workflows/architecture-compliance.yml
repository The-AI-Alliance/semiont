name: Architecture Compliance

on:
  push:
    branches: [main, develop, 'feature/**']
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

# One run per pull request: a push cancels the run of the push before it, which
# nobody is waiting for. A push to main is never cancelled: it is the run that
# sees the merged tree. lint:workflows holds every pull-request workflow to this.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  compliance-check:
    name: React Hooks Architecture Review
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --include=optional

      - name: Build packages (doc-snippets gate checks docs against dist)
        id: build
        run: npm run build:packages

      # Every gate below is INDEPENDENT: each checks a different invariant, and a
      # failure in one says nothing about the others. They defaulted to
      # `if: success()`, so the first failure skipped the rest — which meant one
      # push per problem, and (because two of the skipped steps WRITE the
      # compliance reports) a `cat` further down failing on a file nobody was
      # going to produce.
      #
      # They all depend on the build, though: auditing docs against a `dist` that
      # was never emitted would report nonsense. So each runs when the BUILD
      # succeeded, regardless of its sibling gates. `!cancelled()` rather than
      # `always()` so a cancelled run stops promptly.
      #
      # The lint:* gates, which read the tree and no build, run in ci.yml's
      # first stage (the census job), ahead of everything that builds.

      - name: Run Doc Snippets Audit
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: |
          echo "::group::Doc Snippets Audit (sdk docs' code fences compile against dist through the exports map)"
          ./scripts/compliance/audit-doc-snippets.sh
          echo "::endgroup::"

      - name: Run React Hooks Ordering Audit
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: |
          echo "::group::React Hooks Ordering Audit (no hook in a conditional render or inside a callback)"
          npx tsx ./scripts/compliance/audit-hooks-ordering.ts
          echo "::endgroup::"

      - name: Run Raw Bus Access Audit
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: |
          echo "::group::Raw Bus Access Audit (forbid client.emit/.on/.stream outside the SDK)"
          ./scripts/compliance/audit-raw-bus.sh
          echo "::endgroup::"

      - name: Run StateUnit Compliance Audit
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: |
          echo "::group::StateUnit Compliance Audit (no class in a state-unit file / X3-static no-module-state / X5 fire-and-forget / A5 gathered context is SDK state / session-bound units built under a session)"
          fail=0
          ./scripts/compliance/audit-state-unit-no-class.sh || fail=1
          ./scripts/compliance/audit-state-unit-module-state.sh || fail=1
          ./scripts/compliance/audit-fire-and-forget-promise-void.sh || fail=1
          ./scripts/compliance/audit-gathered-context-component-state.sh || fail=1
          ./scripts/compliance/audit-session-typed-factories.sh || fail=1
          echo "::endgroup::"
          exit $fail

      - name: Run Boot Contract Audit
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: |
          echo "::group::Boot Contract Audit (P1-P3 path environment + H1 test-env hygiene + vi.mock targets + every service image can be supervised)"
          fail=0
          ./scripts/compliance/audit-path-env.sh || fail=1
          ./scripts/compliance/audit-test-env-hygiene.sh || fail=1
          ./scripts/compliance/audit-mock-targets.sh || fail=1
          ./scripts/compliance/audit-supervision.sh || fail=1
          echo "::endgroup::"
          exit $fail

      - name: Run Storage-URI One-Home Audit
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: |
          echo "::group::Storage-URI One-Home Audit (storageUri lives on Representation; descriptor access is invisible to tsc)"
          ./scripts/compliance/audit-storage-uri-one-home.sh
          echo "::endgroup::"

      - name: Run One-Home Audits
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: |
          echo "::group::One-Home Audits (A6 one generated validator over the spec + toolbar preferences persisted by the policy layer alone)"
          fail=0
          ./scripts/compliance/audit-spec-validator.sh || fail=1
          ./scripts/compliance/audit-toolbar-pref-storage.sh || fail=1
          echo "::endgroup::"
          exit $fail

      # The two audits below decide by exit status: batch-audit.ts exits
      # non-zero when a symbol fails, its wrapper passes that on, and the step
      # fails. Nothing here reads a report to find out. This step holds the
      # audits to that: each must refuse a planted violation and pass a clean
      # tree, because a gate that cannot fail passes everything.
      - name: Check the Compliance Audits Can Fail
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: ./scripts/compliance/audit-compliance-gate.sh

      - name: Run React-UI Compliance Audit
        id: react-ui-audit
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: |
          cd packages/react-ui
          ./scripts/generate-compliance-report.sh

      - name: Run Browser Compliance Audit
        id: browser-audit
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: |
          cd apps/browser
          ./scripts/generate-compliance-report.sh

      - name: Display Full React-UI Report
        if: always()
        run: |
          echo "::group::Full React-UI Compliance Report"
          cat .compliance/REACT-UI-COMPLIANCE.md
          echo "::endgroup::"

      - name: Display Full Browser Report
        if: always()
        run: |
          echo "::group::Full Browser Compliance Report"
          cat .compliance/BROWSER-COMPLIANCE.md
          echo "::endgroup::"

      - name: Upload React-UI Compliance Report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: react-ui-compliance-report
          path: .compliance/REACT-UI-COMPLIANCE.md
          retention-days: 30

      - name: Upload Browser Compliance Report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: browser-compliance-report
          path: .compliance/BROWSER-COMPLIANCE.md
          retention-days: 30

      - name: Create Summary
        if: always()
        run: |
          echo "## Architecture Compliance Report" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          # React-UI Summary
          echo "### React-UI Package" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          grep -A 10 "^## Summary" .compliance/REACT-UI-COMPLIANCE.md >> $GITHUB_STEP_SUMMARY || echo "Report not generated" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          # Browser Summary
          echo "### Browser Application" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          grep -A 10 "^## Summary" .compliance/BROWSER-COMPLIANCE.md >> $GITHUB_STEP_SUMMARY || echo "Report not generated" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          # Overall Status
          echo "---" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          if [ "${{ steps.react-ui-audit.outcome }}" = "success" ] && [ "${{ steps.browser-audit.outcome }}" = "success" ]; then
            echo "✅ **PASSED**: no failing symbol in either workspace" >> $GITHUB_STEP_SUMMARY
          else
            echo "❌ **FAILED**: React-UI audit ${{ steps.react-ui-audit.outcome }}, Browser audit ${{ steps.browser-audit.outcome }}" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "Each failing audit names its failing symbols in its own step's log, and the full reports are above." >> $GITHUB_STEP_SUMMARY
          fi
