name: Release

run-name: "Release (${{ inputs.dry_run == true && 'dry run' || 'live' }})"

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Dry run (the gate and the version checks; no tag, no release, no publish)'
        required: false
        type: boolean
        default: false
      # Every release since 0.5.26 has wanted the desktop apps, so the flag
      # defaults on. Turn it off deliberately for a release that ships none.
      desktop:
        description: 'Build and publish desktop apps'
        required: false
        type: boolean
        default: true

jobs:
  # A dry run is held to it too: it is the rehearsal of this one.
  advisories:
    permissions:
      contents: read
    uses: ./.github/workflows/npm-advisories.yml

  # The release gate, on the exact commit about to be tagged: every job of
  # ci.yml in its full tier (Windows included), CodeQL, and a stack booted from
  # images built from the commit. "The nightly was green" goes stale the moment
  # main moves, so the gate runs its own. A dry run is held to it too.
  gate-ci:
    permissions:
      contents: read
      pull-requests: read
    uses: ./.github/workflows/ci.yml
    secrets: inherit

  gate-codeql:
    permissions:
      actions: read
      contents: read
      security-events: write
    uses: ./.github/workflows/codeql-analysis.yml

  gate-stack-smoke:
    permissions:
      contents: read
    uses: ./.github/workflows/stack-smoke.yml

  tag:
    needs: [advisories, gate-ci, gate-codeql, gate-stack-smoke]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
      go_modules: ${{ steps.tags.outputs.modules }}

    steps:
      - uses: actions/checkout@v7.0.1

      - name: Read version
        id: version
        run: |
          VERSION=$(jq -r .version version.json)
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=v$VERSION" >> "$GITHUB_OUTPUT"
          echo "Version: $VERSION"

      - name: Verify version sync
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          ERRORS=0
          for pkg in packages/typescript/*/package.json apps/*/package.json images/*/package.json; do
            PKG_VERSION=$(jq -r .version "$pkg")
            if [ "$PKG_VERSION" != "$VERSION" ]; then
              echo "::error::Version mismatch in $pkg: expected $VERSION, got $PKG_VERSION"
              ERRORS=$((ERRORS + 1))
            fi
          done
          if [ "$ERRORS" -gt 0 ]; then
            echo "::error::$ERRORS package(s) have mismatched versions"
            exit 1
          fi
          echo "All packages at version $VERSION"

      # The release's tag, and one for each Go module it publishes: a Go module
      # in a subdirectory is versioned by a tag named for its directory.
      - name: Name the tags
        id: tags
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          MODULES=$(scripts/release/published-go-modules.sh)
          TAGS="v$VERSION"
          for dir in $MODULES; do
            TAGS="$TAGS $dir/v$VERSION"
          done
          echo "modules=$(paste -sd' ' - <<< "$MODULES")" >> "$GITHUB_OUTPUT"
          echo "tags=$TAGS" >> "$GITHUB_OUTPUT"
          echo "Tags: $TAGS"

      # A dry run stops here, having tagged nothing. Every channel publishes
      # from the tag, and a Go module is published by its tag alone, the
      # first time anyone asks the module proxy for it.
      - name: Create and push the tags
        if: inputs.dry_run != true
        run: |
          for TAG in ${{ steps.tags.outputs.tags }}; do
            AT=$(git ls-remote origin "refs/tags/$TAG" | cut -f1)
            if [ -z "$AT" ]; then
              git tag "$TAG"
              git push origin "refs/tags/$TAG"
              echo "Pushed tag $TAG"
            elif [ "$AT" = "$(git rev-parse HEAD)" ]; then
              echo "::warning::Tag $TAG is already on origin at this commit — skipping"
            else
              echo "::error::Tag $TAG is already on origin at $AT, not at this commit"
              exit 1
            fi
          done

      - name: Create GitHub Release
        if: inputs.dry_run != true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ steps.version.outputs.tag }}"
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "::warning::Release $TAG already exists — skipping"
          else
            gh release create "$TAG" --title "$TAG" --generate-notes
            echo "Created release $TAG"
          fi

  # Go has no registry to upload to. The module proxy makes a version's zip
  # from its tag the first time it is asked for it, the checksum database
  # records the zip's hash, and pkg.go.dev lists what the proxy holds. Asking
  # publishes the version, and fails if the proxy cannot make a module of the
  # tag. A job of its own, beside the other channels, so a proxy that does not
  # answer holds none of them back. The proxy writes each capital letter of a
  # path as `!` and the letter in lower case.
  publish-go:
    name: Publish the Go modules
    needs: tag
    if: inputs.dry_run != true
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - name: Ask the Go module proxy for each module at the version
        run: |
          VERSION="${{ needs.tag.outputs.version }}"
          for dir in ${{ needs.tag.outputs.go_modules }}; do
            MODULE="github.com/$GITHUB_REPOSITORY/$dir"
            ESCAPED=$(perl -pe 's/([A-Z])/!\l$1/g' <<< "$MODULE")
            curl -sSf --retry 5 --retry-delay 10 --retry-all-errors -o /dev/null \
              "https://proxy.golang.org/$ESCAPED/@v/v$VERSION.zip"
            echo "proxy.golang.org serves $MODULE v$VERSION"
          done

  trigger-npm:
    name: Trigger npm publish (runs separately)
    needs: tag
    if: inputs.dry_run != true
    runs-on: ubuntu-latest
    permissions:
      actions: write
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Trigger npm publish workflow
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        # At the tag, as the launcher, the crates and PyPI are. Without a ref
        # the run builds whatever main is when it starts, and a merge between
        # the tag and that moment would be published under this version.
        run: |
          gh workflow run publish-npm-packages.yml --ref "${{ needs.tag.outputs.tag }}" --field stable_release=true
          echo "Triggered publish-npm-packages.yml at ${{ needs.tag.outputs.tag }} (stable release)"

  trigger-launcher:
    name: Trigger launcher release (runs separately)
    needs: tag
    if: inputs.dry_run != true
    runs-on: ubuntu-latest
    permissions:
      actions: write
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Trigger launcher release workflow
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh workflow run launcher-release.yml --ref "${{ needs.tag.outputs.tag }}"
          echo "Triggered launcher-release.yml at ${{ needs.tag.outputs.tag }}"

  trigger-crates:
    name: Trigger crates publish (runs separately)
    needs: tag
    if: inputs.dry_run != true
    runs-on: ubuntu-latest
    permissions:
      actions: write
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Trigger crates publish workflow
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh workflow run publish-crates.yml --ref "${{ needs.tag.outputs.tag }}"
          echo "Triggered publish-crates.yml at ${{ needs.tag.outputs.tag }}"

  trigger-pypi:
    name: Trigger PyPI publish (runs separately)
    needs: tag
    if: inputs.dry_run != true
    runs-on: ubuntu-latest
    permissions:
      actions: write
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Trigger PyPI publish workflow
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh workflow run publish-pypi.yml --ref "${{ needs.tag.outputs.tag }}" --field stable_release=true
          echo "Triggered publish-pypi.yml at ${{ needs.tag.outputs.tag }} (stable release)"

  desktop:
    needs: tag
    if: inputs.dry_run != true && inputs.desktop == true
    uses: ./.github/workflows/publish-desktop.yml
    secrets: inherit
