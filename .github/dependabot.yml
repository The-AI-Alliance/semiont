version: 2
updates:
  # All npm dependencies — root + every workspace (apps/*, images/*, packages/*) in one pass.
  # A single "/" entry traverses all npm workspaces, so per-workspace entries are
  # redundant. Groups below match by package name across every workspace.
  #
  # Every entry ends in a group that takes whatever its earlier groups did not,
  # so an ecosystem's updates arrive as one pull request a week and one run of
  # CI, not one of each per package: a Monday once opened ten of them at once on
  # a pool of twenty jobs, and they were closed unmerged behind a batch. The
  # rust-toolchain entry moves one file and needs no group.
  #
  # The root's @opencode-ai/models is the models.dev catalogue, pinned to one
  # version. A model catalogue file is generated from it: the file an image
  # carries for the Python inference drivers, and the one copy the repository
  # keeps, the fixture of the Python inference package's tests
  # (packages/inference-python/tests/catalogue). The package is published every
  # day: this entry's weekly schedule is what keeps it to one bump a week. A
  # bump comes with the fixture regenerated (`npm run generate:model-catalogue`):
  # CI's drift job fails until it is, and the diff is the models whose facts
  # moved, to be read.
  - package-ecosystem: "npm"
    directory: "/"
    versioning-strategy: increase-if-necessary
    # Let a published version age before raising a PR — most malicious or broken
    # releases are yanked within a day or two. Security fixes are exempt: they use
    # Dependabot's security-update flow, which cooldown does not gate.
    cooldown:
      default-days: 5
      semver-patch-days: 3
      semver-minor-days: 5
      semver-major-days: 14
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
    open-pull-requests-limit: 20
    labels:
      - "kind:dependencies"
    commit-message:
      prefix: "deps"
      include: "scope"
    groups:
      # react and react-dom must move in exact lockstep
      react:
        patterns:
          - "react"
          - "react-dom"
          - "@types/react"
          - "@types/react-dom"
      # react-i18next peer-requires a matching i18next major
      i18n:
        patterns:
          - "i18next"
          - "i18next-*"
          - "react-i18next"
      # keep native platform binaries in lockstep with the tool that pins their version
      bundler-binaries:
        patterns:
          - "vite"
          - "rolldown"
          - "@rolldown/binding-*"
          - "tailwindcss"
          - "@tailwindcss/*"
          - "lightningcss"
          - "lightningcss-*"
      # The @opentelemetry SDK packages share a version line, and each line
      # requires the API minor it was released with: they move together.
      opentelemetry:
        patterns:
          - "@opentelemetry/*"
      # Everything else in one pull request. A dependency goes in the first
      # group it matches, so the lockstep groups above keep their own.
      npm:
        patterns:
          - "*"

  # E2E test suite — tests/ is NOT in the root workspaces[], so "/" does not reach it;
  # it needs its own entry.
  - package-ecosystem: "npm"
    directory: "/tests/e2e"
    versioning-strategy: increase-if-necessary
    cooldown:
      default-days: 5
      semver-patch-days: 3
      semver-minor-days: 5
      semver-major-days: 14
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
    open-pull-requests-limit: 5
    labels:
      - "kind:dependencies"
      - "tests:e2e"
    groups:
      e2e:
        patterns:
          - "*"
    commit-message:
      prefix: "tests"
      include: "scope"

  # Gateway conformance suite — outside workspaces[] like tests/e2e, so it
  # needs its own entry.
  - package-ecosystem: "npm"
    directory: "/tests/conformance"
    versioning-strategy: increase-if-necessary
    cooldown:
      default-days: 5
      semver-patch-days: 3
      semver-minor-days: 5
      semver-major-days: 14
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
    open-pull-requests-limit: 5
    labels:
      - "kind:dependencies"
      - "tests:conformance"
    groups:
      conformance:
        patterns:
          - "*"
    commit-message:
      prefix: "tests"
      include: "scope"

  # The launcher's program (apps/launcher): the MCP go-sdk and go.yaml.in/yaml,
  # and packages/go/launcher and packages/go/sdk through replace directives,
  # plus the `go` directive/toolchain. Reachability-aware stdlib CVE scanning
  # is handled by govulncheck in ci.yml.
  # NB: kept to default-days only; the semver cooldown tiers are npm-oriented.
  - package-ecosystem: "gomod"
    directory: "/apps/launcher"
    cooldown:
      default-days: 5
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
    open-pull-requests-limit: 5
    labels:
      - "kind:dependencies"
      - "app:launcher"
    groups:
      launcher:
        patterns:
          - "*"
    commit-message:
      prefix: "launcher"
      include: "scope"

  # The launcher's libraries (packages/go/launcher): go.yaml.in/yaml,
  # santhosh-tekuri/jsonschema, sigstore-go, the MCP go-sdk, and
  # packages/go/sdk through a replace directive, plus the `go`
  # directive/toolchain.
  # nats-server is a requirement of the libraries' tests, which read the
  # broker's config with the parser of the image the launcher runs. Its
  # version moves with that image's tag (descriptors.go): a bump here alone
  # fails TestBrokerPairIsReadByTheLaunchedBrokersParser. It is also the
  # version of the broker CI's conformance jobs install
  # (scripts/ci/install-nats-server.sh), so a bump here runs every suite
  # against the new broker.
  # NB: kept to default-days only; the semver cooldown tiers are npm-oriented.
  - package-ecosystem: "gomod"
    directory: "/packages/go/launcher"
    cooldown:
      default-days: 5
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
    open-pull-requests-limit: 5
    labels:
      - "kind:dependencies"
      - "app:launcher"
    groups:
      # Alone, as the paragraph above says: its bump runs every suite against
      # the new broker, and the launcher's tests fail until the image moves.
      nats-server:
        patterns:
          - "github.com/nats-io/nats-server/v2"
      launcher-libraries:
        patterns:
          - "*"
    commit-message:
      prefix: "launcher"
      include: "scope"

  # Go SDK (packages/go/sdk). Its OWN entry because gomod is not
  # workspace-aware: this is a separate module, and the launcher's entry above
  # updates the launcher's go.mod only.
  #
  # Without it the drift is invisible from inside the repo. The launcher
  # `replace`s this module and MVS then resolves the HIGHER requirement, so a
  # monorepo build and govulncheck both see the launcher's version
  # (oapi-codegen/runtime v1.7.0) while this go.mod goes on declaring v1.6.0 —
  # green everywhere, and nothing reports it. But sdk-go is consumed by module
  # path, so an EXTERNAL consumer resolves the stale minimum declared here.
  - package-ecosystem: "gomod"
    directory: "/packages/go/sdk"
    cooldown:
      default-days: 5
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
    open-pull-requests-limit: 5
    labels:
      - "kind:dependencies"
      - "sdk:go"
    groups:
      sdk-go:
        patterns:
          - "*"
    commit-message:
      prefix: "sdk-go"
      include: "scope"

  # The Go SDK's conformance drivers (packages/go/sdk/conformance): a module of
  # their own, so that what only a driver takes (an OTLP exporter) reaches no
  # other module. gomod is not workspace-aware, so it has its own entry.
  - package-ecosystem: "gomod"
    directory: "/packages/go/sdk/conformance"
    cooldown:
      default-days: 5
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
    open-pull-requests-limit: 5
    labels:
      - "kind:dependencies"
      - "sdk:go"
    groups:
      sdk-go-conformance:
        patterns:
          - "*"
    commit-message:
      prefix: "sdk-go"
      include: "scope"

  # The Python projects: the SDK, the inference drivers, the graph stores, the
  # vector stores and the service package Semiont's Python services are built
  # from, and the four services themselves, the Worker (images/worker), the
  # Weaver (images/weaver), the Smelter (images/smelter) and the Librarian
  # (images/librarian). Their
  # runtime dependencies, and the tools their gates are made of. The type
  # checkers, the formatter and the SDK's model generator are pinned to a
  # version each, because what they say of a package, and what the generator
  # writes, is held by CI: a bump of one is a change to read, and for the
  # generator or the formatter it comes with a regenerated types.py. A bump of
  # Anthropic's library is a change to read too: anthropic.py lists what the
  # driver leans on in it. So is one of PDFium's binding: pdfium.py lists what
  # the Smelter's reader leans on in it.
  # One entry for them all, and a group for each tool they all pin: every
  # project's tests but the SDK's hold its pins to the SDK's,
  # so a tool moves in every manifest in one PR, and a gate that goes red
  # names the tool.
  - package-ecosystem: "uv"
    directories:
      - "/packages/sdk-python"
      - "/packages/inference-python"
      - "/packages/graph-python"
      - "/packages/vectors-python"
      - "/packages/service-python"
      - "/images/worker"
      - "/images/weaver"
      - "/images/smelter"
      - "/images/librarian"
    cooldown:
      default-days: 5
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
    open-pull-requests-limit: 5
    groups:
      mypy:
        patterns: ["mypy"]
      pyright:
        patterns: ["pyright"]
      ruff:
        patterns: ["ruff"]
      pytest:
        patterns: ["pytest"]
      # Everything else in one pull request; the tools above are matched first.
      python:
        patterns: ["*"]
    labels:
      - "kind:dependencies"
    commit-message:
      prefix: "python"
      include: "scope"

  # The Rust workspace's crates (Cargo.toml at the root: the gateway, the
  # dispatcher and the crates they share), one lockfile for all of them. One grouped PR:
  # the crates move together (the OpenTelemetry and hyper families
  # especially), and every bump runs the conformance suites and the crate
  # licence gate.
  - package-ecosystem: "cargo"
    directory: "/"
    cooldown:
      default-days: 5
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
    open-pull-requests-limit: 5
    labels:
      - "kind:dependencies"
    groups:
      gateway-crates:
        patterns:
          - "*"
    commit-message:
      prefix: "gateway"
      include: "scope"

  # The repository's Rust toolchain (rust-toolchain.toml), which every Rust
  # build uses. Its channel is also the tag of every Rust image: the service
  # images' builder stage (rust:<channel>-alpine) and the desktop builder
  # (rust:<channel>-bookworm). local-build.sh, apps/desktop/build.sh,
  # publish-service-images.yml and build-images.js ask
  # scripts/ci/rust-toolchain.sh for it, so one bump moves the compiler
  # everywhere; the cooldown gives the official images time to be published.
  - package-ecosystem: "rust-toolchain"
    directory: "/"
    cooldown:
      default-days: 5
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
    open-pull-requests-limit: 5
    labels:
      - "kind:dependencies"
    commit-message:
      prefix: "gateway"
      include: "scope"

  # The desktop app's crates (apps/desktop/src-tauri, Tauri). One grouped PR,
  # as for the gateway: Tauri's crates move together.
  - package-ecosystem: "cargo"
    directory: "/apps/desktop/src-tauri"
    cooldown:
      default-days: 5
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
    open-pull-requests-limit: 5
    labels:
      - "kind:dependencies"
      - "app:desktop"
    groups:
      desktop-crates:
        patterns:
          - "*"
    commit-message:
      prefix: "desktop"
      include: "scope"

  # GitHub Actions dependencies
  - package-ecosystem: "github-actions"
    directory: "/"
    # Actions run in CI with repo secrets — let a release age before adopting it.
    # Security updates use a separate flow that cooldown does not gate.
    # NB: github-actions cooldown supports only default-days, not the semver tiers.
    cooldown:
      default-days: 5
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
    open-pull-requests-limit: 5
    labels:
      - "kind:dependencies"
    groups:
      actions:
        patterns:
          - "*"
    commit-message:
      prefix: "actions"
      include: "scope"

  # Browser Docker base image (images/browser/Dockerfile) — docker is not
  # workspace-aware, so each Dockerfile keeps its own entry.
  - package-ecosystem: "docker"
    directory: "/images/browser"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
    open-pull-requests-limit: 5
    labels:
      - "kind:dependencies"
      - "image:browser"
    groups:
      browser-image:
        patterns:
          - "*"
    commit-message:
      prefix: "browser-docker"
      include: "scope"

  # The desktop builder (apps/desktop/Dockerfile.builder) has no entry: its one
  # base image is rust:<channel>-bookworm, which the rust-toolchain entry moves.

  # Service image base images (images/<svc>/Dockerfile). Grouped into one PR:
  # the gateway's, the dispatcher's and the archivist's runtime base is one
  # alpine, so an ungrouped bump opens several PRs for one upgrade. Their
  # builder's Rust tag comes from rust-toolchain.toml, which the rust-toolchain
  # entry updates. images/browser is Node, and has its own entry. images/worker,
  # images/smelter, images/weaver and images/librarian are Python, and have their
  # own too.
  - package-ecosystem: "docker"
    directories:
      - "/images/gateway"
      - "/images/archivist"
      - "/images/dispatcher"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
    open-pull-requests-limit: 5
    labels:
      - "kind:dependencies"
    groups:
      service-base-images:
        patterns:
          - "*"
    commit-message:
      prefix: "service-docker"
      include: "scope"

  # The images of the Python services (images/worker/Dockerfile,
  # images/weaver/Dockerfile, images/smelter/Dockerfile,
  # images/librarian/Dockerfile). Their Python base is no
  # tag this entry can move: it is python:${PYTHON_FLOOR}-<variant>, the floor
  # packages/sdk-python/pyproject.toml states, which a person moves. What each
  # file's FROM lines write out, and this entry moves, is the uv that makes
  # the image's environment, in all four at once. Outside the service group,
  # whose base is Alpine.
  - package-ecosystem: "docker"
    directories:
      - "/images/worker"
      - "/images/weaver"
      - "/images/smelter"
      - "/images/librarian"
    # uv makes each image's environment: let a release age before adopting it.
    # The base-image entries above wait for nothing, so that an image's OS
    # patches are not held back.
    # NB: docker cooldown supports only default-days, not the semver tiers.
    cooldown:
      default-days: 5
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
    open-pull-requests-limit: 5
    labels:
      - "kind:dependencies"
    groups:
      python-service-images:
        patterns:
          - "*"
    commit-message:
      prefix: "service-docker"
      include: "scope"
