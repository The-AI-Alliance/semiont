version: 2
updates:
  # All npm dependencies — root + every workspace (apps/*, packages/*) in one pass.
  # A single "/" entry traverses all npm workspaces, so per-workspace entries are
  # redundant. Groups below match by package name across every workspace.
  #
  # The root's @opencode-ai/models is the models.dev catalogue, pinned to one
  # version. A model catalogue file is generated from it: the file an image
  # carries for the Python inference drivers, and the one copy the repository
  # keeps, the fixture of the Python inference package's tests
  # (packages/inference-python/tests/catalogue). The package is published every
  # day: this entry's weekly schedule is what keeps it to one bump a week. A
  # bump comes with the fixture regenerated (`npm run generate:model-catalogue`):
  # CI's drift job fails until it is, and the diff is the models whose facts
  # moved, to be read.
  - package-ecosystem: "npm"
    directory: "/"
    versioning-strategy: increase-if-necessary
    # Let a published version age before raising a PR — most malicious or broken
    # releases are yanked within a day or two. Security fixes are exempt: they use
    # Dependabot's security-update flow, which cooldown does not gate.
    cooldown:
      default-days: 5
      semver-patch-days: 3
      semver-minor-days: 5
      semver-major-days: 14
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
    open-pull-requests-limit: 20
    labels:
      - "dependencies"
    commit-message:
      prefix: "deps"
      include: "scope"
    groups:
      # react and react-dom must move in exact lockstep
      react:
        patterns:
          - "react"
          - "react-dom"
          - "@types/react"
          - "@types/react-dom"
      # react-i18next peer-requires a matching i18next major
      i18n:
        patterns:
          - "i18next"
          - "i18next-*"
          - "react-i18next"
      # keep native platform binaries in lockstep with the tool that pins their version
      bundler-binaries:
        patterns:
          - "vite"
          - "rolldown"
          - "@rolldown/binding-*"
          - "tailwindcss"
          - "@tailwindcss/*"
          - "lightningcss"
          - "lightningcss-*"
      # @opentelemetry packages share a version line and root package.json overrides
      opentelemetry:
        patterns:
          - "@opentelemetry/*"

  # E2E test suite — tests/ is NOT in the root workspaces[], so "/" does not reach it;
  # it needs its own entry.
  - package-ecosystem: "npm"
    directory: "/tests/e2e"
    versioning-strategy: increase-if-necessary
    cooldown:
      default-days: 5
      semver-patch-days: 3
      semver-minor-days: 5
      semver-major-days: 14
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "tests"
    commit-message:
      prefix: "tests"
      include: "scope"

  # Gateway conformance suite — outside workspaces[] like tests/e2e, so it
  # needs its own entry.
  - package-ecosystem: "npm"
    directory: "/tests/conformance"
    versioning-strategy: increase-if-necessary
    cooldown:
      default-days: 5
      semver-patch-days: 3
      semver-minor-days: 5
      semver-major-days: 14
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "tests"
    commit-message:
      prefix: "tests"
      include: "scope"

  # Go launcher (apps/launcher): go-toml, oapi-codegen/runtime, and
  # packages/sdk-go through a replace directive, plus the `go`
  # directive/toolchain. Reachability-aware stdlib CVE scanning is handled by
  # govulncheck in ci.yml.
  # NB: kept to default-days only; the semver cooldown tiers are npm-oriented.
  - package-ecosystem: "gomod"
    directory: "/apps/launcher"
    cooldown:
      default-days: 5
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "launcher"
    commit-message:
      prefix: "launcher"
      include: "scope"

  # Go SDK (packages/sdk-go). Its OWN entry because gomod is not
  # workspace-aware: this is a separate module, and the launcher's entry above
  # updates the launcher's go.mod only.
  #
  # Without it the drift is invisible from inside the repo. The launcher
  # `replace`s this module and MVS then resolves the HIGHER requirement, so a
  # monorepo build and govulncheck both see the launcher's version
  # (oapi-codegen/runtime v1.7.0) while this go.mod goes on declaring v1.6.0 —
  # green everywhere, and nothing reports it. But sdk-go is consumed by module
  # path, so an EXTERNAL consumer resolves the stale minimum declared here.
  - package-ecosystem: "gomod"
    directory: "/packages/sdk-go"
    cooldown:
      default-days: 5
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "sdk-go"
    commit-message:
      prefix: "sdk-go"
      include: "scope"

  # The Python packages: the SDK, and the inference drivers Semiont's Python
  # services are built from. Their runtime dependencies, and the tools their
  # gates are made of. The type checkers, the formatter and the SDK's model
  # generator are pinned to a version each, because what they say of a
  # package, and what the generator writes, is held by CI: a bump of one is a
  # change to read, and for the generator or the formatter it comes with a
  # regenerated types.py. A bump of Anthropic's library is a change to read
  # too: anthropic.py lists what the driver leans on in it.
  # One entry for both packages, and a group for each tool they both pin: the
  # inference package's tests hold its pins to the SDK's, so a tool moves in
  # both manifests in one PR, and a gate that goes red names the tool.
  - package-ecosystem: "uv"
    directories:
      - "/packages/sdk-python"
      - "/packages/inference-python"
    cooldown:
      default-days: 5
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
    open-pull-requests-limit: 5
    groups:
      mypy:
        patterns: ["mypy"]
      pyright:
        patterns: ["pyright"]
      ruff:
        patterns: ["ruff"]
      pytest:
        patterns: ["pytest"]
    labels:
      - "dependencies"
      - "sdk-python"
      - "inference-python"
    commit-message:
      prefix: "python"
      include: "scope"

  # The Rust workspace's crates (Cargo.toml at the root: the gateway, the
  # dispatcher and the crates they share), one lockfile for all of them. One grouped PR:
  # the crates move together (the OpenTelemetry and hyper families
  # especially), and every bump runs the conformance suites and the crate
  # licence gate.
  - package-ecosystem: "cargo"
    directory: "/"
    cooldown:
      default-days: 5
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "gateway"
    groups:
      gateway-crates:
        patterns:
          - "*"
    commit-message:
      prefix: "gateway"
      include: "scope"

  # The repository's Rust toolchain (rust-toolchain.toml), which every Rust
  # build uses. Its channel is also the tag of every Rust image: the service
  # images' builder stage (rust:<channel>-alpine) and the desktop builder
  # (rust:<channel>-bookworm). local-build.sh, apps/desktop/build.sh,
  # publish-service-images.yml and build-images.js ask
  # scripts/ci/rust-toolchain.sh for it, so one bump moves the compiler
  # everywhere; the cooldown gives the official images time to be published.
  - package-ecosystem: "rust-toolchain"
    directory: "/"
    cooldown:
      default-days: 5
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "gateway"
    commit-message:
      prefix: "gateway"
      include: "scope"

  # The desktop app's crates (apps/desktop/src-tauri, Tauri). One grouped PR,
  # as for the gateway: Tauri's crates move together.
  - package-ecosystem: "cargo"
    directory: "/apps/desktop/src-tauri"
    cooldown:
      default-days: 5
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "desktop"
    groups:
      desktop-crates:
        patterns:
          - "*"
    commit-message:
      prefix: "desktop"
      include: "scope"

  # GitHub Actions dependencies
  - package-ecosystem: "github-actions"
    directory: "/"
    # Actions run in CI with repo secrets — let a release age before adopting it.
    # Security updates use a separate flow that cooldown does not gate.
    # NB: github-actions cooldown supports only default-days, not the semver tiers.
    cooldown:
      default-days: 5
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "github-actions"
    commit-message:
      prefix: "actions"
      include: "scope"

  # Browser Docker base image (apps/browser/Dockerfile) — docker is not
  # workspace-aware, so each Dockerfile keeps its own entry.
  - package-ecosystem: "docker"
    directory: "/apps/browser"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "browser"
      - "docker"
    commit-message:
      prefix: "browser-docker"
      include: "scope"

  # The desktop builder (apps/desktop/Dockerfile.builder) has no entry: its one
  # base image is rust:<channel>-bookworm, which the rust-toolchain entry moves.

  # Service image base images (apps/<svc>/Dockerfile). Grouped into one PR:
  # the make-meaning sidecars share a base image, so an ungrouped bump opens
  # several PRs for one upgrade. The gateway's, the dispatcher's and the
  # archivist's runtime base is alpine; their builder's Rust tag comes from rust-toolchain.toml, which
  # the rust-toolchain entry updates. Major node updates are ignored because node
  # 26's undici breaks the qdrant client the sidecars carry; drop the ignore
  # when qdrant ships a fix. apps/browser and apps/worker carry no qdrant
  # client, run Node 26, and have their own entries.
  - package-ecosystem: "docker"
    directories:
      - "/apps/gateway"
      - "/apps/smelter"
      - "/apps/weaver"
      - "/apps/archivist"
      - "/apps/librarian"
      - "/apps/dispatcher"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "services"
      - "docker"
    groups:
      service-base-images:
        patterns:
          - "*"
    ignore:
      - dependency-name: "node"
        update-types:
          - "version-update:semver-major"
    commit-message:
      prefix: "service-docker"
      include: "scope"

  # Worker base image (apps/worker/Dockerfile). Outside the service group: its
  # @semiont/jobs carries no qdrant client, so it runs Node 26 and takes the
  # major node updates the qdrant-bound sidecars cannot.
  - package-ecosystem: "docker"
    directory: "/apps/worker"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "services"
      - "docker"
    commit-message:
      prefix: "service-docker"
      include: "scope"
