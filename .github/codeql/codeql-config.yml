name: "Enhanced Security CodeQL Config"

disable-default-queries: false

queries:
  # `security-and-quality` is a superset of `security-extended` plus
  # quality/maintainability/reliability/correctness queries.
  - name: security-and-quality
    uses: security-and-quality

paths:
  - images/browser/src
  # The Rust workspace: its services and the crates they share
  - images/gateway/src
  - images/dispatcher/src
  - images/dispatcher/handlers
  - images/dispatcher/jetstream
  - images/archivist/src
  - images/archivist/record
  - images/archivist/staging
  - packages/codegen-rust
  - packages/core-rust
  - packages/http-service-rust
  - packages/http-transport-rust
  - packages/observability-rust
  - packages/sdk-rust
  - packages/telemetry-rust
  # The desktop shell: a Cargo workspace of its own, outside the root one
  - apps/desktop/src-tauri/src
  # Go launcher — module root, not a src/ dir (main.go and its tests)
  - apps/launcher
  # The launcher's libraries: a module root too
  - packages/go/launcher
  # The Go SDK the launcher is built on: a module root too
  - packages/go/sdk
  - packages/http-transport/src
  - packages/core/src
  - packages/react-ui/src
  - packages/observability/src
  - packages/sdk/src
  # The Python SDK and the Python inference drivers: what each wheel holds
  - packages/sdk-python/src
  - packages/inference-python/src
  - packages/graph-python/src
  - packages/vectors-python/src
  - packages/service-python/src
  # The Worker service's, the Weaver's, the Smelter's and the Librarian's Python code
  - images/worker/src
  - images/weaver/src
  - images/smelter/src
  - images/librarian/src

paths-ignore:
  - packages/go/launcher/testdata
  - images/browser/node_modules
  - "**/node_modules"
  - "**/*.test.ts"
  - "**/*.test.tsx"
  - "**/*.spec.ts"
  - "**/dist"
  - "**/build"
  - "**/.next"
  - "**/coverage"

# Custom query filters for enhanced security analysis
query-filters:
  - include:
      kind:
        - problem
        - path-problem
      tags:
        - security
        - external/cwe
        - maintainability
        - reliability
        - correctness
  - exclude:
      id:
        # Exclude specific queries that are not relevant
        - js/unused-local-variable
        - js/debugger-statement
        # Reads no `type` statement (PEP 695) as a definition, so it reports
        # every type alias the Python SDK exports. pyright holds the property
        # in CI: a name in `__all__` that is not defined fails it
        # (reportUnsupportedDunderAll).
        - py/undefined-export