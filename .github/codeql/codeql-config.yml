name: "Enhanced Security CodeQL Config"

disable-default-queries: false

queries:
  # `security-and-quality` is a superset of `security-extended` plus
  # quality/maintainability/reliability/correctness queries.
  - name: security-and-quality
    uses: security-and-quality

paths:
  - apps/browser/src
  # The Rust workspace: its services and the crates they share
  - apps/gateway/src
  - apps/dispatcher/src
  - apps/dispatcher/handlers
  - apps/dispatcher/jetstream
  - apps/archivist/src
  - apps/archivist/record
  - apps/archivist/staging
  - packages/codegen-rust
  - packages/core-rust
  - packages/http-service-rust
  - packages/http-transport-rust
  - packages/observability-rust
  - packages/sdk-rust
  - packages/telemetry-rust
  # The desktop shell: a Cargo workspace of its own, outside the root one
  - apps/desktop/src-tauri/src
  # Go launcher — module root, not a src/ dir (main.go + internal/)
  - apps/launcher
  # The Go SDK the launcher is built on: a module root too
  - packages/sdk-go
  - packages/http-transport/src
  - packages/core/src
  - packages/content/src
  - packages/event-sourcing/src
  - packages/graph/src
  - packages/inference/src
  - packages/vectors/src
  - packages/jobs/src
  - packages/make-meaning/src
  - packages/ontology/src
  - packages/react-ui/src
  - packages/mcp-server/src
  - packages/observability/src
  - packages/sdk/src
  # The Python SDK: what its wheel holds
  - packages/sdk-python/src

paths-ignore:
  - apps/launcher/testdata
  - apps/browser/node_modules
  - "**/node_modules"
  - "**/*.test.ts"
  - "**/*.test.tsx"
  - "**/*.spec.ts"
  - "**/dist"
  - "**/build"
  - "**/.next"
  - "**/coverage"

# Custom query filters for enhanced security analysis
query-filters:
  - include:
      kind:
        - problem
        - path-problem
      tags:
        - security
        - external/cwe
        - maintainability
        - reliability
        - correctness
  - exclude:
      id:
        # Exclude specific queries that are not relevant
        - js/unused-local-variable
        - js/debugger-statement
        # Reads no `type` statement (PEP 695) as a definition, so it reports
        # every type alias the Python SDK exports. pyright holds the property
        # in CI: a name in `__all__` that is not defined fails it
        # (reportUnsupportedDunderAll).
        - py/undefined-export